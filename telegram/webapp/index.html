<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<title>Fidel English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column, one task per screen, sticky top bar with streak */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --fg:#16231D; --muted:#5B6B62; --line:#DCE3DD;
  --accent:#1F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E1EFE8;
  --gold:#A8700F; --gold-soft:#FBF0D9;
  --good:#1E7A46; --good-soft:#E2F4E8; --bad:#B23A2E; --bad-soft:#FBE5E2;
  --font-en:"Lexend","Noto Sans Ethiopic",system-ui,sans-serif;
  --font-am:"Noto Sans Ethiopic","Nyala","Ebrima",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#18231D; --fg:#E7EFEA; --muted:#9AAFA3; --line:#2A3A31;
  --accent:#4FB58A; --accent-ink:#0B1410; --accent-soft:#1D3329;
  --gold:#E2B04F; --gold-soft:#33291A;
  --good:#5CC98A; --good-soft:#173324; --bad:#F07A6C; --bad-soft:#3A1E1B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#18231D; --fg:#E7EFEA; --muted:#9AAFA3; --line:#2A3A31;
  --accent:#4FB58A; --accent-ink:#0B1410; --accent-soft:#1D3329;
  --gold:#E2B04F; --gold-soft:#33291A;
  --good:#5CC98A; --good-soft:#173324; --bad:#F07A6C; --bad-soft:#3A1E1B; color-scheme:dark;}

body{background:var(--bg);color:var(--fg);font-family:var(--font-en);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.am{font-family:var(--font-am)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:13px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

h1,h2{text-wrap:balance;margin:0}
.view{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.goal{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.goal h1{font-size:22px;font-weight:700}
.goal p{margin:0;opacity:.92}
.goal .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
.goal .bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}

.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.lvl{border-radius:12px;padding:8px 4px;text-align:center;line-height:1.25;font-weight:500;font-size:15px}
.lvl small{display:block;font-family:var(--font-am);font-weight:400;font-size:12px;color:var(--muted)}
.lvl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lvl[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}

.action{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.action .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.action b{display:block;font-size:16px}
.action span.s{display:block;font-size:14px;color:var(--muted)}
.action.gold{background:var(--gold-soft);border-color:var(--gold)}
.action.gold .ic{background:var(--gold);color:var(--surface)}
.action.off{cursor:default}
.action.off .ic{background:var(--line);color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.trial{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:14px}
.trial b{color:var(--gold)}
.trial button{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap}
.plans{display:flex;flex-direction:column;gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.plan.best{border:2px solid var(--gold)}
.plan h2{font-size:18px;margin:0}
.plan .price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .price small{font-size:14px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.plan .tagb{align-self:flex-start;font-size:12px;font-weight:700;background:var(--gold);color:var(--surface);border-radius:99px;padding:3px 10px}
.lesson.locked{opacity:.6}
.lesson.locked .num{background:var(--line)}
.paynote{font-size:13px;color:var(--muted);text-align:center}

.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.lesson:active{transform:scale(.99)}
.num{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.lesson.done .num{background:var(--accent);color:var(--accent-ink)}
.lt{flex:1;min-width:0}
.lt b{display:block;font-weight:500}
.lt span{display:block;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-family:var(--font-en);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-right:4px}
.pills{flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.on{background:var(--good-soft);color:var(--good)}

.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.tip{background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.tip summary{font-weight:700;color:var(--accent);cursor:pointer}
.tip p{margin:8px 0 0}
.tip p.am{color:var(--fg)}
.pairs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:240px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%}
.card .en{font-size:clamp(26px,7.5vw,38px);font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.card .en.long{font-size:clamp(21px,5.8vw,29px)}
.card .pron{font-family:var(--font-am);color:var(--muted);font-size:17px}
.card .pron small{font-family:var(--font-en);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.card .thnote{font-size:12px;color:var(--muted)}
.card .meaning{font-family:var(--font-am);font-size:clamp(21px,6.2vw,29px);font-weight:600;color:var(--accent);padding-top:12px;margin-top:6px;border-top:1px dashed var(--line);width:100%}
.card .tap{font-size:14px;color:var(--gold);font-weight:500}

.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 14px;border-radius:14px;font-weight:500;background:var(--surface);border:1px solid var(--line);text-align:center;line-height:1.25}
.btn small{display:block;font-family:var(--font-am);font-weight:400;font-size:13px;color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary small{color:var(--accent-ink);opacity:.85}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.btn.gold small{color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{flex:none}

.qprompt{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.qprompt .ask{font-size:14px;color:var(--muted)}
.qprompt .big{font-size:clamp(23px,6.8vw,34px);font-weight:700;line-height:1.25;text-wrap:balance}
.speakbig{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.slowlink{font-size:14px;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:6px}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:56px;padding:12px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:17px;font-weight:500;text-align:left}
.opt.am{font-size:18px}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-size:17px}
.qprompt .sub{font-size:17px;color:var(--muted)}
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border-radius:14px;border:2px dashed var(--line);background:var(--surface)}
.built.right{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.built.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:44px;padding:8px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:17px;font-weight:500}
.tile.used{visibility:hidden}
.built .tile{border-color:var(--accent);color:var(--accent)}

.micwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.mic{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 0 var(--accent-soft);transition:box-shadow .3s}
.mic.live{background:var(--bad);color:#fff;box-shadow:0 0 0 12px var(--bad-soft)}
.micnote{font-size:14px;color:var(--muted);text-align:center;margin:0}
.heard{min-height:24px;font-size:15px;color:var(--muted);text-align:center;font-style:italic}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.w{padding:4px 10px;border-radius:10px;font-weight:500;font-size:17px}
.w.ok{background:var(--good-soft);color:var(--good)}
.w.no{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}

.scen{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scen button{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1.2;text-align:center}
.scen button small{display:block;font-family:var(--font-am);font-size:12px;color:var(--muted)}
.scen button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scen button[aria-pressed="true"] small{color:var(--accent-ink)}
.chat{display:flex;flex-direction:column;gap:12px;min-height:200px}
.msg{max-width:86%;padding:12px 14px;border-radius:18px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.msg.tutor{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg .tr{font-family:var(--font-am);font-size:14px;color:var(--muted)}
.msg .say{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:500}
.fix{align-self:flex-end;max-width:86%;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:14px;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.fix b{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.fix .tr{font-family:var(--font-am);font-size:14px;color:var(--muted)}
.fix.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.fix.ok b{color:var(--good)}
.thinking{align-self:flex-start;color:var(--muted);font-size:14px;padding:6px 4px}
.inputbar{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line)}
.inputbar textarea{flex:1;min-width:0;resize:none;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:48px;max-height:120px}
.iconbtn{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn.send{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.iconbtn:disabled{opacity:.45}

.result{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.score{font-size:56px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:20}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:24px;line-height:1}
.avatarbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;line-height:1}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.hero .big{font-size:84px;line-height:1.1}
.hero h1{font-size:24px}
.hero p{margin:0;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:14px;font-weight:500}
.field input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%}
.field input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.field .err{font-size:13px;color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:10px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent);font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{min-height:44px;min-width:44px;padding:6px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.choices button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.choices.emoji button{font-size:26px;padding:4px 8px}
.mascot{display:flex;align-items:flex-end;gap:10px}
.mascot .face{flex:none;font-size:52px;line-height:1}
.mascot .bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;padding:10px 14px;font-size:15px}
.mascot .bubble .am{display:block;color:var(--muted);font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:22px;padding:22px 18px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.modal .box .big{font-size:72px;line-height:1.1}
.modal .box h2{font-size:21px}
.modal .box p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <button class="back" id="backBtn" aria-label="Back" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="logo" aria-hidden="true">🦁</div>
    <div class="brand"><b>Fidel English</b><span class="am">እንግሊዝኛ በአማርኛ</span></div>
    <div class="chip" title="Days in a row · ተከታታይ ቀናት">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>
      <span id="streak">0</span>
    </div>
    <button class="avatarbtn" id="profileBtn" aria-label="Profile and settings" hidden>🦁</button>
  </header>

  <section class="view" id="v-home"></section>
  <section class="view" id="v-cards" hidden></section>
  <section class="view" id="v-quiz" hidden></section>
  <section class="view" id="v-speak" hidden></section>
  <section class="view" id="v-tutor" hidden></section>
  <section class="view" id="v-result" hidden></section>
  <section class="view" id="v-pay" hidden></section>
  <section class="view" id="v-signup" hidden></section>
  <section class="view" id="v-profile" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const LEVELS = [
  { id:"beg",  en:"Beginner",      am:"ጀማሪ" },
  { id:"int",  en:"Intermediate",  am:"መካከለኛ" },
  { id:"adv",  en:"Advanced",      am:"ከፍተኛ" },
  { id:"pron", en:"Pronunciation", am:"አነባበብ" }
];
// words: [English, Amharic, hint]. Hint = English sound in Amharic letters (beginner) or a sound guide.
// tip: [English, Amharic]. pairs: minimal pairs for the listening test.
const LESSONS = [
  // ---------------- BEGINNER ----------------
  { id:"greet", level:"beg", en:"Greetings", am:"ሰላምታ", words:[

  { id:"g-be", level:"beg", grammar:true, en:"I am, you are, he is", am:"ነኝ፣ ነህ፣ ነው",
    tip:["'am / is / are' means 'to be'. I am, you are, he is, she is, it is, we are, they are. He = a man, she = a woman, it = a thing or animal. Don't mix up he and she.",

    words:[["I am Ethiopian.","ኢትዮጵያዊ ነኝ።"],["You are my friend.","አንተ ጓደኛዬ ነህ።"],["He is my brother.","እሱ ወንድሜ ነው።"],
    ["She is my sister.","እሷ እህቴ ናት።"],["It is a cat.","ድመት ነው።"],["It is hot today.","ዛሬ ሞቃት ነው።"],

  { id:"g-order", level:"beg", grammar:true, en:"Word order", am:"የቃላት ቅደም ተከተል",

  { id:"g-cont", level:"int", grammar:true, en:"Right now: I am eating", am:"አሁን እየሆነ ያለ",

         "አሁን እየተደረገ ላለ ነገር 'am / is / are' + ግሥ-ing እንጠቀማለን፡ I am eating = እየበላሁ ነው። She is working = እየሰራች ነው።"],
    words:[["I am eating now.","አሁን እየበላሁ ነው።"],["She is cooking dinner.","እራት እያበሰለች ነው።"],
    ["We are waiting for the bus.","አውቶቡስ እየጠበቅን ነው።"],["It is raining.","ዝናብ እየዘነበ ነው።"],
    ["What are you doing?","ምን እያደረጉ ነው?"],["He is talking on the phone.","በስልክ እያወራ ነው።"],
    ["They are playing outside.","ውጭ እየተጫወቱ ነው።"],["I am learning English.","እንግሊዝኛ እየተማርኩ ነው።"],["The baby is sleeping.","ሕፃኑ እየተኛ ነው።"],["Are you listening?","እያዳመጡ ነው?"]]},
  { id:"shop", level:"int", en:"Shopping", am:"ግብይት", words:[
    ["How much does this cost?","ይሄ ስንት ያወጣል?"],["Can I try it on?","ልሞክረው እችላለሁ?"],
    ["Do you have a smaller size?","ትንሽ መጠን አላችሁ?"],["It's too expensive.","በጣም ውድ ነው።"],
    ["Can you give me a discount?","ቅናሽ ሊያደርጉልኝ ይችላሉ?"],["I'll take it.","እወስደዋለሁ።"],
    ["Do you accept mobile money?","የሞባይል ክፍያ ትቀበላላችሁ?"],["Can I have a receipt, please?","እባክዎ ደረሰኝ ሊሰጡኝ ይችላሉ?"],["I'm just looking, thank you.","እያየሁ ብቻ ነው፣ አመሰግናለሁ።"],["Do you have this in black?","ይሄ በጥቁር አለ?"]]},
  { id:"g-questions", level:"int", grammar:true, en:"Asking questions", am:"ጥያቄ መጠየቅ",
    tip:["In Amharic, a question often sounds like a sentence with a different tone. In English, questions usually start with do or does: Do you like tea? Does she work here? With 'be' you swap the order: You are tired → Are you tired?",
         "በአማርኛ ጥያቄ ብዙ ጊዜ በድምፅ ብቻ ይለያል፤ በእንግሊዝኛ ግን ብዙ ጊዜ በ 'do' ወይም 'does' ይጀመራል፡ Do you like tea? Does she work here? በ 'be' ደግሞ ቦታ ይቀያየራል፡ You are tired → Are you tired?"],
    words:[["Do you like tea?","ሻይ ይወዳሉ?"],["Does she work here?","እሷ እዚህ ትሰራለች?"],["Do you speak English?","እንግሊዝኛ ይናገራሉ?"],
    ["Where do you live?","የት ነው የሚኖሩት?"],["What do you do?","ስራዎ ምንድን ነው?"],["Are you tired?","ደክሞዎታል?"],
    ["Is he your brother?","እሱ ወንድምዎ ነው?"],["How long does it take?","ምን ያህል ጊዜ ይወስዳል?"],["Why are you late?","ለምን አረፈዱ?"],["Can you swim?","መዋኘት ይችላሉ?"]]},
  { id:"dir", level:"int", en:"Asking for directions", am:"አቅጣጫ መጠየቅ", words:[
    ["Excuse me, where is the bank?","ይቅርታ፣ ባንኩ የት ነው?"],["Go straight.","ቀጥ ብለው ይሂዱ።"],
    ["Turn left.","ወደ ግራ ይታጠፉ።"],["Turn right.","ወደ ቀኝ ይታጠፉ።"],
    ["It's next to the hospital.","ከሆስፒታሉ አጠገብ ነው።"],["It's across the street.","ከመንገዱ ማዶ ነው።"],
    ["Is it far from here?","ከዚህ ሩቅ ነው?"],["It's a five-minute walk.","በእግር አምስት ደቂቃ ነው።"],["Take the first right.","የመጀመሪያውን ወደ ቀኝ ይታጠፉ።"],["I'm lost.","መንገድ ጠፋብኝ።"]]},
  { id:"g-past", level:"int", grammar:true, en:"The past tense", am:"ያለፈ ጊዜ",
    tip:["To talk about the past, add -ed: work → worked, play → played. Many common verbs change: go → went, eat → ate, see → saw, have → had, buy → bought. For questions and 'not', use did: Did you go? I didn't go.",
         "ስላለፈ ነገር ለመናገር በግሡ መጨረሻ '-ed' ይጨመራል፡ work → worked። ብዙ የተለመዱ ግሦች ግን ይለወጣሉ፡ go → went፣ eat → ate፣ see → saw፣ buy → bought። ለጥያቄና ለአሉታ 'did' እንጠቀማለን፡ Did you go? / I didn't go."],
    words:[["I worked yesterday.","ትናንት ሰራሁ።"],["I ate injera for lunch.","ለምሳ እንጀራ በላሁ።"],["She saw her friend.","ጓደኛዋን አየች።"],
    ["We had a good time.","ጥሩ ጊዜ አሳለፍን።"],["Did you call your mother?","ለእናትዎ ደወሉ?"],["I didn't go to school.","ትምህርት ቤት አልሄድኩም።"],
    ["He bought a new phone.","አዲስ ስልክ ገዛ።"],["They came home late.","ዘግይተው ወደ ቤት መጡ።"],["She went to Gondar last week.","ባለፈው ሳምንት ወደ ጎንደር ሄደች።"],["I wrote a letter.","ደብዳቤ ጻፍኩ።"]]},

    ["Yesterday I went to the market.","ትናንት ወደ ገበያ ሄድኩ።"],["I visited my grandmother.","አያቴን ጠየቅኩ።"],

    ["I didn't sleep well.","በደንብ አልተኛሁም።"],["Last year I moved to Addis Ababa.","ባለፈው ዓመት ወደ አዲስ አበባ ተዛወርኩ።"],

  { id:"health", level:"int", en:"At the doctor", am:"ሐኪም ቤት", words:[

  { id:"g-future", level:"int", grammar:true, en:"The future: will and going to", am:"የወደፊት ጊዜ",
    tip:["Use 'going to' for plans you already made: I'm going to visit my family. Use 'will' for quick decisions and promises: I'll help you. I will call you tomorrow.",
         "ቀደም ብሎ ለታቀደ ነገር 'going to'፡ I'm going to visit my family (ቤተሰቤን ልጠይቅ ነው)። ለድንገተኛ ውሳኔና ቃል ለመግባት 'will'፡ I'll help you (እረዳዎታለሁ)።"],
    words:[["I'm going to visit my family.","ቤተሰቤን ልጠይቅ ነው።"],["I will call you tomorrow.","ነገ እደውልልዎታለሁ።"],
    ["It will rain tonight.","ዛሬ ማታ ይዘንባል።"],["We are going to buy a house.","ቤት ልንገዛ ነው።"],["I'll help you.","እረዳዎታለሁ።"],
    ["What are you going to do this weekend?","በዚህ ቅዳሜና እሁድ ምን ሊያደርጉ ነው?"],["She will be here soon.","በቅርቡ እዚህ ትደርሳለች።"],["I won't be late.","አላረፍድም።"],["I will finish it tomorrow.","ነገ እጨርሰዋለሁ።"],["Are you going to come?","ሊመጡ ነው?"]]},
  { id:"phone", level:"int", en:"Phone calls", am:"የስልክ ጥሪ", words:[
    ["Hello, this is Abebe.","ሄሎ፣ አበበ ነኝ።"],["Can I speak to Sara, please?","እባክዎ ሳራን ማነጋገር እችላለሁ?"],

  { id:"restaurant", level:"int", en:"At a restaurant", am:"ምግብ ቤት", words:[

  { id:"g-perfect", level:"adv", grammar:true, en:"Present perfect", am:"የአሁን ፍጹም ጊዜ",
    tip:["Use have / has + past participle for life experiences and for things that started in the past and continue now: I have lived here for five years. Have you ever been to Lalibela? Don't use it with a finished time like 'yesterday'.",
         "'have / has' + past participle ለሕይወት ልምድ እና ከድሮ ጀምሮ እስከ አሁን ለሚቀጥል ነገር እንጠቀማለን፡ I have lived here for five years (እዚህ ለአምስት ዓመት ኖሬያለሁ)። እንደ 'yesterday' ካሉ ያለፉ የተወሰኑ ጊዜያት ጋር አይጠቀሙት።"],
    words:[["I have lived here for five years.","እዚህ ለአምስት ዓመት ኖሬያለሁ።"],["Have you ever been to Lalibela?","ላሊበላ ሄደው ያውቃሉ?"],
    ["I have never seen snow.","በረዶ አይቼ አላውቅም።"],["She has just finished her work.","ስራዋን አሁን ጨረሰች።"],
    ["We have known each other since 2015.","ከ2015 ጀምሮ እንተዋወቃለን።"],["Have you eaten yet?","እስካሁን በልተዋል?"],
    ["I haven't decided yet.","እስካሁን አልወሰንኩም።"],["He has worked here since January.","ከጥር ጀምሮ እዚህ ይሰራል።"],["Have you finished your homework?","የቤት ስራዎን ጨርሰዋል?"],["They have already left.","አስቀድመው ሄደዋል።"]]},
  { id:"smalltalk", level:"adv", en:"Small talk", am:"ቀላል ጨዋታ", words:[
    ["How's it going?","እንዴት ነው?"],["What do you do for a living?","ስራዎ ምንድን ነው?"],
    ["How was your weekend?","ቅዳሜና እሁድ እንዴት ነበር?"],["Lovely weather today, isn't it?","ዛሬ አየሩ ደስ ይላል፣ አይደል?"],
    ["Have you been here before?","ከዚህ በፊት እዚህ መጥተው ያውቃሉ?"],["It was great talking to you.","ከእርስዎ ጋር ማውራቴ ደስ ብሎኛል።"],
    ["Let's keep in touch.","ግንኙነታችንን እንቀጥል።"],["Take care!","ራስዎን ይጠብቁ!"],["Are you from around here?","የዚህ አካባቢ ሰው ነዎት?"],["What brings you here?","ወደዚህ ምን አመጣዎት?"]]},
  { id:"interview", level:"adv", en:"Job interview", am:"የስራ ቃለ መጠይቅ", words:[
    ["Tell me about yourself.","ስለራስዎ ይንገሩኝ።"],["I have three years of experience in sales.","በሽያጭ ሶስት ዓመት የስራ ልምድ አለኝ።"],
    ["My greatest strength is solving problems.","ትልቁ ጥንካሬዬ ችግሮችን መፍታት ነው።"],["I work well under pressure.","ጫና ውስጥም ቢሆን በደንብ እሰራለሁ።"],
    ["Why do you want to work here?","ለምን እዚህ መስራት ፈለጉ?"],["I'm eager to learn and grow with your company.","ከድርጅታችሁ ጋር ለመማርና ለማደግ ጓጉቻለሁ።"],
    ["Where do you see yourself in five years?","ከአምስት ዓመት በኋላ ራስዎን የት ያዩታል?"],["Do you have any questions for us?","ለእኛ ጥያቄ አለዎት?"],["What are your weaknesses?","ደካማ ጎኖችዎ ምንድን ናቸው?"],["Thank you for the opportunity.","ለዕድሉ አመሰግናለሁ።"]]},
  { id:"g-cond", level:"adv", grammar:true, en:"If sentences", am:"'ቢሆን' ዓረፍተ ነገሮች",
    tip:["Real possibility: If it rains, I will stay home. Imaginary: If I had more money, I would buy a house. Past regret: If I had studied, I would have passed.",
         "ሊሆን የሚችል፡ If it rains, I will stay home (ከዘነበ ቤት እቆያለሁ)። ምናባዊ፡ If I had more money, I would buy a house (ብዙ ገንዘብ ቢኖረኝ ቤት እገዛ ነበር)። ስላለፈ ፀፀት፡ If I had studied, I would have passed (ባጠና ኖሮ አልፍ ነበር)።"],
    words:[["If it rains, I will stay home.","ከዘነበ ቤት እቆያለሁ።"],["If you study hard, you will pass.","ጠንክረው ካጠኑ ያልፋሉ።"],
    ["If I had more money, I would buy a house.","ብዙ ገንዘብ ቢኖረኝ ቤት እገዛ ነበር።"],["If I were you, I would take the job.","እኔ እርስዎን ብሆን ስራውን እቀበል ነበር።"],
    ["What would you do if you won the lottery?","ሎተሪ ቢደርስዎ ምን ያደርጋሉ?"],["If I had known, I would have helped you.","ባውቅ ኖሮ እረዳዎት ነበር።"],
    ["Call me if you need anything.","ማንኛውም ነገር ካስፈለገዎ ይደውሉልኝ።"],["Unless we hurry, we will miss the bus.","ካልፈጠንን አውቶቡሱ ያመልጠናል።"],["If I see him, I'll tell him.","ካየሁት እነግረዋለሁ።"],["If I had a car, I would drive to work.","መኪና ቢኖረኝ ወደ ስራ እየነዳሁ እሄድ ነበር።"]]},
  { id:"phrasal", level:"adv", en:"Phrasal verbs", am:"ሐረጋዊ ግሶች", words:[
    ["Don't give up.","ተስፋ አይቁረጡ።"],["Please turn off the light.","እባክዎ መብራቱን ያጥፉ።"],
    ["I'm looking for my keys.","ቁልፎቼን እየፈለግኩ ነው።"],["Can you pick me up at the station?","ጣቢያው ድረስ መጥተው ሊወስዱኝ ይችላሉ?"],
    ["We ran out of sugar.","ስኳር አለቀብን።"],["I'll figure it out.","መፍትሄ አገኝለታለሁ።"],
    ["Let's catch up soon.","በቅርቡ ተገናኝተን እናውራ።"],["She takes care of her parents.","ወላጆቿን ትንከባከባለች።"],["Please fill out this form.","እባክዎ ይህን ቅጽ ይሙሉ።"],["The meeting was called off.","ስብሰባው ተሰርዟል።"]]},
  { id:"stories", level:"adv", en:"Telling a story", am:"ታሪክ መናገር", words:[
    ["First, I woke up late.","መጀመሪያ፣ አርፍጄ ተነሳሁ።"],["Then, I missed the bus.","ከዚያም አውቶቡሱ አመለጠኝ።"],
    ["After that, I took a taxi.","ከዚያ በኋላ ታክሲ ያዝኩ።"],["Suddenly, it started to rain.","በድንገት ዝናብ መዝነብ ጀመረ።"],
    ["Luckily, I had an umbrella.","እንደ እድል ሆኖ ጃንጥላ ነበረኝ።"],["However, the road was closed.","ሆኖም መንገዱ ተዘግቶ ነበር።"],
    ["In the end, I arrived on time.","በመጨረሻ በሰዓቱ ደረስኩ።"],["Because of that, I was very tired.","በዚህ ምክንያት በጣም ደክሞኝ ነበር።"],["At first, I was nervous.","መጀመሪያ ላይ ተጨንቄ ነበር።"],["Meanwhile, my friend was waiting.","በዚያው ጊዜ ጓደኛዬ እየጠበቀኝ ነበር።"]]},
  { id:"idioms", level:"adv", en:"Natural expressions", am:"የተለመዱ አገላለጾች", words:[
    ["It's a piece of cake.","በጣም ቀላል ነው።"],["Break a leg!","መልካም ዕድል!"],
    ["I'm feeling under the weather.","ትንሽ አሞኛል።"],["Let's call it a day.","ለዛሬ በቃን።"],
    ["It costs an arm and a leg.","እጅግ በጣም ውድ ነው።"],["Better late than never.","ከመቅረት መዘግየት ይሻላል።"],
    ["I'm all ears.","በጥሞና እያዳመጥኩ ነው።"],["No worries.","ችግር የለም።"],["Once in a blue moon.","በጣም አልፎ አልፎ።"],["Let's get the ball rolling.","ስራውን እንጀምር።"]]},
  { id:"fast", level:"adv", hintLabel:"Fast", speakHint:true, en:"Fast natural English", am:"ፈጣን የተፈጥሮ እንግሊዝኛ",
    tip:["Native speakers join and shorten words when they talk fast. You don't have to speak like this, but you need to understand it. 'going to' → gonna, 'want to' → wanna, 'got to' → gotta, 'let me' → lemme, 'don't know' → dunno.",
         "እንግሊዝኛ ተናጋሪዎች በፍጥነት ሲናገሩ ቃላትን ያገናኛሉ፣ ያሳጥራሉ። እርስዎ እንደዚህ መናገር ግዴታ የለብዎትም፤ ግን ሲሰሙት መረዳት አለብዎት። Listen ቁልፉ ፈጣኑን አነጋገር ያሰማል።"],
    words:[["I'm going to eat.","ልበላ ነው።","I'm gonna eat."],["I want to go home.","ወደ ቤት መሄድ እፈልጋለሁ።","I wanna go home."],
    ["I have got to go.","መሄድ አለብኝ።","I gotta go."],["Let me see.","ልይ።","Lemme see."],["I don't know.","አላውቅም።","I dunno."],
    ["What are you doing?","ምን እያደረጉ ነው?","Whatcha doing?"],["Do you want to come?","መምጣት ይፈልጋሉ?","D'you wanna come?"],
    ["Give me a minute.","አንድ ደቂቃ ይስጡኝ።","Gimme a minute."],["What do you want to do?","ምን ማድረግ ይፈልጋሉ?","Whaddaya wanna do?"],["I'm kind of tired.","ትንሽ ደክሞኛል።","I'm kinda tired."]]},
  { id:"pro", level:"adv", en:"Professional English", am:"ሙያዊ እንግሊዝኛ", words:[
    ["Thank you for your email.","ለኢሜይልዎ አመሰግናለሁ።"],["I'm writing to ask about the job opening.","ስለ ክፍት የስራ ቦታው ለመጠየቅ ነው የምጽፈው።"],
    ["Could we schedule a meeting?","ስብሰባ ልንይዝ እንችላለን?"],["I'd like to add something.","አንድ ነገር መጨመር እፈልጋለሁ።"],
    ["Could you repeat that, please?","እባክዎ ይድገሙልኝ?"],["I agree with you.","በሀሳብዎ እስማማለሁ።"],
    ["I see your point, but I have a different idea.","ሀሳብዎ ገብቶኛል፣ ግን የተለየ ሀሳብ አለኝ።"],["I look forward to hearing from you.","ምላሽዎን በጉጉት እጠብቃለሁ።"],["Please find the report attached.","ሪፖርቱን አያይዤ ልኬዋለሁ።"],["Sorry for the late reply.","ዘግይቼ ስለመለስኩ ይቅርታ።"]]},
  { id:"present", level:"adv", en:"Presentations and meetings", am:"ገለጻና ስብሰባ", words:[
    ["Good morning, everyone.","እንደምን አደራችሁ ሁላችሁም።"],["Today I'm going to talk about our sales.","ዛሬ ስለ ሽያጫችን እናገራለሁ።"],
    ["Let's start with the first point.","በመጀመሪያው ነጥብ እንጀምር።"],["As you can see in this chart, sales went up.","በዚህ ሰንጠረዥ እንደምታዩት ሽያጩ ጨምሯል።"],
    ["To sum up, we had a good year.","ለማጠቃለል፣ ጥሩ ዓመት ነበረን።"],["Does anyone have any questions?","ጥያቄ ያለው ሰው አለ?"],
    ["That's a great question.","በጣም ጥሩ ጥያቄ ነው።"],["Thank you for your attention.","ስላዳመጣችሁኝ አመሰግናለሁ።"],["Let me move on to the next slide.","ወደሚቀጥለው ስላይድ ልለፍ።"],["I'd like to thank my team.","ቡድኔን ማመስገን እፈልጋለሁ።"]]},

  // ---------------- PRONUNCIATION ----------------
  { id:"p-th1", level:"pron", hintLabel:"Sound", en:"TH as in think", am:"የ'th' ድምፅ (think)",
    tip:["Amharic has no 'th' sound, so many speakers say 's' or 't' (sink instead of think). Put the tip of your tongue lightly between your teeth and blow air out. No voice.",
         "አማርኛ 'th' ድምፅ የለውም፤ ስለዚህ ብዙዎች 'ስ' ወይም 'ት' ይሉታል (think ፈንታ sink)። የምላስዎን ጫፍ በጥርሶችዎ መካከል በቀስታ ያድርጉና አየር ብቻ ይንፉ። ጉሮሮዎ አይንቀጠቀጥም።"],
    pairs:[["think","sink"],["three","tree"],["thank","tank"],["thin","tin"],["mouth","mouse"],["path","pass"]],
    words:[["think","ማሰብ","(th)ink"],["three","ሶስት","(th)ree"],["thank you","አመሰግናለሁ","(th)ank you"],["thing","ነገር","(th)ing"],
    ["Thursday","ሐሙስ","(th)ursday"],["mouth","አፍ","mou(th)"],["tooth","ጥርስ","too(th)"],["birthday","የልደት ቀን","bir(th)day"],["bath","ገላ መታጠብ","ba(th)"],["north","ሰሜን","nor(th)"]]},
  { id:"p-th2", level:"pron", hintLabel:"Sound", en:"TH as in this", am:"የ'th' ድምፅ (this)",
    tip:["Same tongue position as 'think', but now use your voice: your throat should buzz. Don't say 'z' or 'd' (dis instead of this).",
         "ምላስዎ ልክ እንደ 'think' በጥርሶችዎ መካከል ይሆናል፤ አሁን ግን ድምፅ ያሰሙ — ጉሮሮዎ ይንቀጠቀጣል። 'ዝ' ወይም 'ድ' አይበሉ (this ፈንታ dis)።"],
    pairs:[["they","day"],["then","den"],["those","doze"],["breathe","breeze"]],

let tts = null, dict = null, sampleFn = null, capsReady = false, micDenied = false;
const hasSpeech = "speechSynthesis" in window;
let voice = null;
function pickVoice(){ if(!hasSpeech) return; const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if (hasSpeech){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function browserSpeak(text, slow){
  if (!hasSpeech){ toast("Sound is not available on this browser · ድምፅ አይሰራም"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (voice) u.voice = voice; u.rate = slow ? 0.55 : 0.9;
  speechSynthesis.speak(u);
}
function speak(text, slow){
  text = String(text).replace(/\.\.\.$/, "");
  if (tts){
    tts.speak(text, { language:"en", rate: slow ? 0.7 : 0.95 }).catch(e => {
      const c = e && e.code;
      if (c === "not_granted" || c === "unavailable"){ tts = null; browserSpeak(text, slow); }
    });
    return;
  }
  browserSpeak(text, slow);
}
function stopSound(){ try { if (tts) tts.stop(); } catch(e){} if (hasSpeech) speechSynthesis.cancel(); }

const mic = { target:null, text:"", partial:"", state:"idle", timer:null };
function micStart(target){
  if (!dict || micDenied) return;
  if (dict.active()){ dict.stop(); return; }
  mic.target = target; mic.text = ""; mic.partial = "";
  stopSound();
  dict.start({ language:"en" }).catch(e => {
    const c = e && e.code;
    if (c === "not_granted"){ micDenied = true; toast("Microphone is off for this page · ማይክሮፎን ተዘግቷል"); refresh(); }
    else if (c === "unavailable"){ dict = null; refresh(); }
    else if (c === "rate_limited") toast("Please wait a moment and try again · ትንሽ ቆይተው ይሞክሩ");
    else if (c !== "stopped" && c !== "dismissed") toast("The microphone did not start. Try again · እንደገና ይሞክሩ");
  });
}
function onDictState({ state, reason }){
  mic.state = state;
  if (reason === "not_granted") micDenied = true;
  if (reason === "unavailable") dict = null;
  if (state === "idle" && mic.target === "speak" && !$("#v-speak").hidden){
    clearTimeout(mic.timer);
    if (mic.text.trim()) evaluateSpeech(mic.text); else renderSpeak();
    return;
  }
  if (mic.target === "speak") renderSpeakMic(); else renderTutorMic();
}
function onDictPartial({ text }){ mic.partial = text; showHeard(); }
function onDictFinal({ text }){
  mic.text += text; mic.partial = "";
  if (mic.target === "tutor"){ const b = $("#tbox"); if (b){ b.value = (b.value + text).replace(/^\s+/, ""); autoGrow(b); } }
  else { clearTimeout(mic.timer); mic.timer = setTimeout(() => { if (dict && dict.active()) dict.stop(); }, 1600); }
  showHeard();
}
function showHeard(){
  if (mic.target === "speak"){ const h = $("#heard"); if (h) h.textContent = (mic.text + " " + mic.partial).trim(); }
  else { const b = $("#tbox"); if (b && mic.partial) b.placeholder = mic.partial; }
}
(async () => {
  if (!window.claude || !claude.use) { capsReady = true; refresh(); return; }
  const [t, d, s, u] = await Promise.all([claude.use("tts"), claude.use("dictation"), claude.use("sample"), claude.use("user")]);
  try { isOwner = !!(u && await u.isOwner()); } catch(e){}
  tts = t; dict = d; sampleFn = s; capsReady = true;
  if (dict){ dict.onState(onDictState); dict.onPartial(onDictPartial); dict.onFinal(onDictFinal); }
  refresh();
})();

function daysSince(ds){ if (!ds) return null; const [y,m,d] = ds.split("-").map(Number); const a = new Date(y, m-1, d), b = new Date(); b.setHours(0,0,0,0); return Math.round((b - a) / 86400000); }
function liveStreak(){ const g = daysSince(store.last); return (g === 0 || g === 1) ? (store.streak || 0) : 0; }
function normPhone(v){ const m = v.replace(/[\s\-()]/g, "").match(/^(?:\+?251|0)?([79]\d{8})$/); return m ? "+251" + m[1] : null; }
const okEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

function modal(html, buttons){
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
  m.innerHTML = `<div class="box">${html}<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${buttons.map((b, i) =>
    `<button class="btn ${i===0?"primary":""}" data-mb="${i}">${b.label}</button>`).join("")}</div></div>`;
  m.addEventListener("click", e => {
    const b = e.target.closest("[data-mb]");
    if (!b && e.target !== m) return;
    m.remove();
    if (b && buttons[+b.dataset.mb].fn) buttons[+b.dataset.mb].fn();
  });
  document.body.appendChild(m); m.querySelector("[data-mb]").focus();
}

// ---------- quiz ----------
// type 0: English -> Amharic, 1: Amharic -> English, 2: listen -> English, 3: listen -> which of two similar words
function poolFor(w){
  const lv = (WORDMAP[w[0]] || {}).level;
  return LESSONS.filter(l => l.level === lv).flatMap(l => l.words).filter(x => x !== w && x[0] !== w[0]);
}
function buildQuestion(w, type, pool){
  const src = (pool && pool.length >= 3) ? pool : poolFor(w);
  const sameKind = src.filter(x => (x[0].length > 14) === (w[0].length > 14));
  const others = shuffle(sameKind.length >= 3 ? sameKind : src).filter(x => x[0] !== w[0] && x[1] !== w[1]).slice(0, 3);
  return { type, word: w, options: shuffle([w, ...others]) };
}
// ---- endless practice: new random questions every time ----
// type 4: put words in order, 5: fill the gap, 6: which sentence is correct
const SWAP = { is:"are", are:"is", am:"is", was:"were", were:"was", has:"have", have:"has", does:"do", do:"does",
  "doesn't":"don't", "don't":"doesn't", "isn't":"aren't", "aren't":"isn't", "wasn't":"weren't", "weren't":"wasn't", a:"an", an:"a" };
const QUIZ_LEN = 12;
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function toks(s){ return s.trim().split(/\s+/).map(t => { const m = t.match(/^(["“(]*)(.*?)([.,!?;:"”)]*)$/); return { pre:m[1], core:m[2], post:m[3] }; }); }
const joinToks = ts => ts.map(t => t.pre + t.core + t.post).join(" ");
const plainWord = c => /^[A-Za-z][A-Za-z'’-]*$/.test(c);
const isSentence = w => toks(w[0]).length >= 3 && !/[\/…↗↘]/.test(w[0]);
const capLike = (src, word) => /^[A-Z]/.test(src) ? word[0].toUpperCase() + word.slice(1) : word;
function swapIdx(w){
  if (/\bif I were\b/i.test(w[0]) || /[\/…]/.test(w[0])) return [];
  return toks(w[0]).map((t, i) => SWAP[t.core.toLowerCase()] ? i : -1).filter(i => i >= 0);
}
function correctQuestion(w){
  const idx = swapIdx(w); if (!idx.length) return null;
  const ts = toks(w[0]), t = ts[pickOne(idx)];
  t.core = capLike(t.core, SWAP[t.core.toLowerCase()]);
  const bad = joinToks(ts);
  return { type:6, word:w, options:shuffle([w[0], bad]), correctOpt:w[0] };
}
function gapQuestion(w, L){
  const ts = toks(w[0]); let cand = swapIdx(w);
  const grammar = cand.length > 0 && Math.random() < .7;
  if (!grammar) cand = ts.map((t, i) => t.core.length >= 3 && plainWord(t.core) ? i : -1).filter(i => i >= 0);
  if (!cand.length) return null;
  const i = pickOne(cand), ans = ts[i].core, opts = [ans];
  if (grammar) opts.push(capLike(ans, SWAP[ans.toLowerCase()]));
  const bank = shuffle([...new Set(L.words.flatMap(x => toks(x[0]).slice(1).map(t => t.core)).filter(c => c.length >= 2 && plainWord(c)))]);
  for (const b of bank){ if (opts.length >= 4) break; if (!opts.some(o => o.toLowerCase() === b.toLowerCase())) opts.push(i === 0 ? capLike("A", b) : b); }
  if (opts.length < 3) return null;
  const gap = ts.map((t, k) => k === i ? t.pre + "_____" + t.post : t.pre + t.core + t.post).join(" ");
  return { type:5, word:w, gap, options:shuffle(opts), correctOpt:ans };
}
function orderQuestion(w){
  const ts = toks(w[0]); if (ts.length < 3 || ts.length > 10) return null;
  const parts = ts.map(t => t.pre + t.core + t.post);
  parts[parts.length - 1] = parts[parts.length - 1].replace(/[.!?]+$/, "");
  let order = shuffle(parts.map((_, k) => k)), n = 0;
  while (order.every((v, k) => parts[v] === parts[k]) && n++ < 10) order = shuffle(order);
  return { type:4, word:w, parts, order, picked:[], end:(w[0].match(/[.!?]+$/) || [""])[0] };
}
function lessonQuiz(L){
  const qs = [], used = new Set(), want = Math.min(QUIZ_LEN, L.words.length * 2);
  for (let tries = 0; qs.length < want && tries < 400; tries++){
    const w = pickOne(L.words), types = [0, 1, 2];
    if (isSentence(w)) types.push(4, 4, 5, 5);
    if (swapIdx(w).length) types.push(6, 6, 5);
    const t = pickOne(types), key = w[0] + "|" + t;
    if (used.has(key) || (qs.length && qs[qs.length - 1].word === w)) continue;
    const q = t === 4 ? orderQuestion(w) : t === 5 ? gapQuestion(w, L) : t === 6 ? correctQuestion(w)
      : buildQuestion(w, t, L.words.filter(x => x !== w));
    if (!q) continue;
    used.add(key); qs.push(q);
  }
  // pronunciation lessons: add listening questions with the sound pairs
  (L.pairs ? shuffle(L.pairs).slice(0, 4) : []).forEach(p => {
    const a = [p[0], ""], b = [p[1], ""], t = Math.random() < .5 ? a : b;
    qs.splice(Math.floor(Math.random() * (qs.length + 1)), 0, { type:3, word:t, options:shuffle([a, b]) });
  });
  return qs;
}
function startQuiz(L, mode, items){
  S.mode = mode; S.lesson = L;
  if (mode === "lesson"){
    S.quiz = lessonQuiz(L);
  } else {
    S.quiz = items;
  }
  S.qi = 0; S.score = 0; renderQ(); show("quiz");
}
function renderQ(){
  const q = S.quiz[S.qi], n = S.quiz.length; S.answered = false;
  let prompt;
  if (q.type === 0) prompt = `<div class="ask">What does this mean? · <span class="am">ትርጉሙ ምንድን ነው?</span></div><div class="big">${esc(q.word[0])}</div>`;
  else if (q.type === 1) prompt = `<div class="ask">Choose the English · <span class="am">በእንግሊዝኛ ይምረጡ</span></div><div class="big am">${esc(q.word[1])}</div>`;
  else if (q.type === 4) prompt = `<div class="ask">Put the words in order · <span class="am">ቃላቱን በቅደም ተከተል ያስቀምጡ</span></div><div class="big am" style="font-size:clamp(20px,5.6vw,26px)">${esc(q.word[1])}</div>`;
  else if (q.type === 5) prompt = `<div class="ask">Fill the gap · <span class="am">ባዶውን ቦታ ይሙሉ</span></div><div class="big">${esc(q.gap)}</div><div class="sub am">${esc(q.word[1])}</div>`;
  else if (q.type === 6) prompt = `<div class="ask">Which sentence is correct? · <span class="am">የትኛው ትክክል ነው?</span></div><div class="big am" style="font-size:clamp(20px,5.6vw,26px)">${esc(q.word[1])}</div>`;
  else prompt = `<div class="ask">${q.type===3 ? "Which word do you hear? · <span class='am'>የትኛውን ቃል ሰሙ?</span>" : "Listen and choose · <span class='am'>ያዳምጡና ይምረጡ</span>"}</div>
    <button class="speakbig" id="qsay" aria-label="Play sound">${ICON_SPEAK.replace(/22/g,"40")}</button>
    <button class="slowlink" id="qslow">${ICON_SLOW.replace(/22/g,"18")} Slow · <span class="am">በዝግታ</span></button>`;
  const optCls = q.type === 0 ? "opt am" : "opt";
  const optText = o => typeof o === "string" ? o : q.type === 0 ? o[1] : o[0];
  const title = S.mode === "place" ? "Level test" : S.mode === "review" ? "Review" : S.mode === "exam" ? "Final exam" : "Question";
  const body = q.type === 4
    ? `<div class="built" id="built" aria-label="Your sentence"></div><div class="tiles" id="tiles"></div>
       <div class="row"><button class="btn" id="oclear"><span>Clear<small>አጥፋ</small></span></button>
       <button class="btn primary" id="ocheck" disabled><span>Check<small>አረጋግጥ</small></span></button></div>`
    : `<div class="opts">${q.options.map((o,k)=>`<button class="${optCls}" data-k="${k}">${esc(optText(o))}</button>`).join("")}</div>`;
  $("#v-quiz").innerHTML = `
    <div class="label">${title} ${S.qi+1} of ${n} · <span class="am">ጥያቄ ${S.qi+1}/${n}</span></div>
    <div class="progress"><i style="width:${S.qi/n*100}%"></i></div>
    <div class="qprompt">${prompt}</div>
    ${body}
    ${S.mode === "place" ? `<button class="btn" id="qdunno"><span>I don't know<small>አላውቅም</small></span></button>` : ""}
    <div id="fb"></div>`;
  if (q.type === 2 || q.type === 3){ $("#qsay").onclick = () => speak(q.word[0]); $("#qslow").onclick = () => speak(q.word[0], true); setTimeout(()=>speak(q.word[0]), 250); }
  if (q.type === 4){ renderTiles(); return; }
  $("#v-quiz .opts").onclick = e => { const b = e.target.closest("[data-k]"); if (b) answer(+b.dataset.k); };
  if ($("#qdunno")) $("#qdunno").onclick = () => answer(-1);
}
function renderTiles(){
  const q = S.quiz[S.qi];
  $("#built").innerHTML = q.picked.map((v, k) => `<button class="tile" data-un="${k}">${esc(q.parts[v])}</button>`).join("");
  $("#tiles").innerHTML = q.order.map(v => `<button class="tile ${q.picked.includes(v)?"used":""}" data-v="${v}" ${q.picked.includes(v)?"disabled":""}>${esc(q.parts[v])}</button>`).join("");
  $("#ocheck").disabled = q.picked.length !== q.parts.length;
  $("#tiles").onclick = e => { const b = e.target.closest("[data-v]"); if (!b || S.answered) return; q.picked.push(+b.dataset.v); renderTiles(); };
  $("#built").onclick = e => { const b = e.target.closest("[data-un]"); if (!b || S.answered) return; q.picked.splice(+b.dataset.un, 1); renderTiles(); };
  $("#oclear").onclick = () => { if (S.answered) return; q.picked = []; renderTiles(); };
  $("#ocheck").onclick = () => {
    const ok = q.picked.map(v => q.parts[v]).join(" ") === q.parts.join(" ");
    $("#built").classList.add(ok ? "right" : "wrong");
    $("#oclear").disabled = $("#ocheck").disabled = true;
    answer(ok ? 1 : 0);
  };
}
function answer(k){
  if (S.answered) return; S.answered = true;
  const q = S.quiz[S.qi], target = q.correctOpt !== undefined ? q.correctOpt : q.word;
  const ok = q.type === 4 ? k === 1 : (k >= 0 && q.options[k] === target);
  if (ok) S.score++;
  if (q.levelTag){ q.correct = ok; }
  if (S.mode !== "place" && q.type !== 3){ ok ? markRight(q.word[0]) : markWrong(q.word[0]); }
  if (q.type !== 4) document.querySelectorAll("#v-quiz .opt").forEach((b,i) => {
    if (q.options[i] === target) b.classList.add("right"); else if (i === k) b.classList.add("wrong");
  });
  if ($("#qdunno")) $("#qdunno").disabled = true;
  if (S.mode !== "place") speak(q.word[0]);
  const last = S.qi === S.quiz.length - 1;
  const detail = q.type === 3 ? `You heard: <b>${esc(q.word[0])}</b>` : `${esc(q.word[0])} = <span class="am">${esc(q.word[1])}</span>`;
  $("#fb").innerHTML = S.mode === "place" ? "" : `
    <div class="feedback ${ok?"good":"bad"}">
      <b>${ok ? "Correct! · <span class='am'>ትክክል!</span>" : "Not quite · <span class='am'>ትክክል አይደለም</span>"}</b>
      <span>${detail}</span>
    </div>`;
  $("#fb").insertAdjacentHTML("beforeend", `<button class="btn primary" id="qnext" style="margin-top:12px;width:100%"><span>${last?"See result":"Next"}<small>${last?"ውጤት ይመልከቱ":"ቀጣይ"}</small></span></button>`);
  $("#qnext").onclick = () => { if (last) finishQuiz(); else { S.qi++; renderQ(); } };
  $("#qnext").scrollIntoView({ behavior:"smooth", block:"nearest" });
}
function finishQuiz(){
  if (S.mode === "place") return finishPlacement();
  const n = S.quiz.length, pct = Math.round(S.score / n * 100), L = S.lesson;
  bumpStreak();
  if (S.mode === "review"){
    showResult({ L, big:`${S.score}/${n}`, pct, again: L.id === "mix" ? () => month4("mix") : startReview, kind:"Review" });
    return;
  }
  if (S.mode === "exam"){
    const passed = pct >= PASS_MARK;
    store.best.exam = Math.max(store.best.exam || 0, pct);
    if (passed){
      if (!store.cert) store.cert = { name:(store.profile && store.profile.name) || "Student", score:pct, date:Date.now() };
      else if (pct > store.cert.score) store.cert.score = pct;
    }
    saveStore();
    showResult({ L, big:`${pct}%`, pct, again:() => month4("exam"), kind:"Final exam", extra: passed
      ? `<button class="btn gold" id="rcert">🎓 <span>You passed! See your certificate<small>አልፈዋል! ሰርተፊኬትዎን ይመልከቱ</small></span></button>`
      : `<p class="foot" style="margin:0">You need ${PASS_MARK}% to pass. Do the big review and try again!<br><span class="am">ለማለፍ ${PASS_MARK}% ያስፈልጋል። ይከልሱና እንደገና ይሞክሩ!</span></p>` });
    if (passed) $("#rcert").onclick = showCertificate;
    return;
  }
  store.best[L.id] = Math.max(store.best[L.id] || 0, pct); saveStore();
  showResult({ L, big:`${S.score}/${n}`, pct, again:() => startQuiz(L, "lesson"), extra:
    `<button class="btn gold" id="rspk">${ICON_MIC(20)}<span>Now practise speaking<small>አሁን መናገር ይለማመዱ</small></span></button>` });
  $("#rspk").onclick = () => startSpeaking(L);
}

// ---------- review mistakes ----------
function startReview(){
  if (!canUse("lessons")){ showPaywall("lessons"); return; }
  const keys = shuffle(Object.keys(store.wrong).filter(k => WORDMAP[k])).slice(0, 10);
  if (!keys.length){ toast("No mistakes to review. Great work! · የሚከለስ ስህተት የለም"); renderHome(); return; }
  const items = keys.map((k, i) => buildQuestion(WORDMAP[k].w, i % 3));
  startQuiz({ id:"review", en:"Your mistakes", am:"ስህተቶችዎ", words:[] }, "review", items);
}

// ---------- placement test ----------
function startPlacement(){
  const pick = lv => shuffle(LESSONS.filter(l => l.level === lv).flatMap(l => l.words)).slice(0, 4);
  const items = [];
  ["beg","int","adv"].forEach(lv => pick(lv).forEach(w => { const q = buildQuestion(w, 0); q.levelTag = lv; items.push(q); }));
  startQuiz({ id:"place", en:"Level test", am:"የደረጃ ፈተና", words:[] }, "place", items);
}
function finishPlacement(){
  const got = lv => S.quiz.filter(q => q.levelTag === lv && q.correct).length;
  const b = got("beg"), i = got("int"), a = got("adv");
  const rec = (b >= 3 && i >= 3 && a >= 3) ? "adv" : (b >= 3 && i >= 3) ? "int" : "beg";
  const L = levelOf(rec);
  store.placed = true; saveStore();
  $("#v-result").innerHTML = `
    <div class="result">
      <div class="label">Your level · <span class="am">ደረጃዎ</span></div>
      <div class="score" style="font-size:40px">${L.en}</div>
      <p class="am" style="margin:0;font-size:20px">${L.am}</p>
      <p style="margin:8px 0 0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums">Beginner ${b}/4 · Intermediate ${i}/4 · Advanced ${a}/4</p>
    </div>
    <p class="foot" style="margin:0">Also do the Pronunciation section. It fixes the sounds that are hardest for Amharic speakers.<br><span class="am">የአነባበብ ክፍሉንም ይስሩ። ለአማርኛ ተናጋሪዎች ከባድ የሆኑትን ድምፆች ያስተካክላል።</span></p>
    <button class="btn primary" id="pStart"><span>Start ${L.en} lessons<small>${L.am} ትምህርቶችን ይጀምሩ</small></span></button>`;
  $("#pStart").onclick = () => { store.level = rec; store.month = ({ beg:1, int:2, adv:3 })[rec] || 1; saveStore(); renderHome(); };
  show("result");
}

// ---------- speaking practice ----------
const SP = { lesson:null, items:[], i:0, best:[], result:null };
const NUMS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const norm = s => s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean)
  .map(t => /^\d+$/.test(t) && +t <= 12 ? NUMS[+t] : t);
function compare(target, said){
  const pool = norm(said); let total = 0, hit = 0;
  const res = target.split(/\s+/).map(chunk => {
    const toks = norm(chunk); if (!toks.length) return [chunk, true];
    total++;
    const ok = toks.every(tk => { const i = pool.indexOf(tk); if (i >= 0){ pool.splice(i,1); return true; } return false; });
    if (ok) hit++;
    return [chunk, ok];
  });
  return { res, pct: total ? Math.round(hit / total * 100) : 0 };
}
function startSpeaking(L){
  if (!canUseMonth(monthOf(L))){ showPaywall(monthOf(L)); return; }
  SP.lesson = L; SP.items = shuffle(L.words).slice(0, 8); SP.i = 0; SP.best = SP.items.map(() => 0); SP.result = null;
  renderSpeak(); show("speak");
}
function renderSpeak(){
  const L = SP.lesson; if (!L) return;
  const w = SP.items[SP.i], n = SP.items.length, last = SP.i === n-1, canMic = !!dict && !micDenied;
  let body;
  if (SP.result){
    const r = SP.result;
    const msg = r.pct === 100 ? ["Perfect!","ፍጹም!"] : r.pct >= 70 ? ["Very close!","በጣም ተቃርበዋል!"] : ["Let's try again","እንደገና እንሞክር"];
    body = `<div class="feedback ${r.pct>=70?"good":"bad"}"><b>${msg[0]} · <span class="am">${msg[1]}</span> — ${r.pct}%</b>
        <span>You said: “${esc(r.said)}”</span></div>
      <div class="words">${r.res.map(([c,ok]) => `<span class="w ${ok?"ok":"no"}">${esc(c)}</span>`).join("")}</div>
      ${r.pct < 100 ? `<p class="micnote">Red words were missing or unclear. Listen again, then repeat.<br><span class="am">ቀይ ቃላት በደንብ አልተሰሙም። እንደገና ያዳምጡና ይድገሙ።</span></p>` : ""}`;
  } else if (canMic){
    body = `<div class="micwrap"><button class="mic" id="micBtn" aria-label="Speak">${ICON_MIC(36)}</button>
      <p class="micnote" id="micNote">Tap and say it · <span class="am">ይንኩና ይናገሩ</span></p>
      <div class="heard" id="heard"></div></div>`;
  } else {
    body = `<p class="micnote">Listen, then say it out loud 3 times. Copy the sound exactly.<br><span class="am">ያዳምጡ፣ ከዚያ 3 ጊዜ ጮክ ብለው ይናገሩ።</span></p>
      <p class="micnote" style="font-size:12px">The microphone check works in Chrome or the Claude desktop app.</p>
      <div class="row"><button class="btn" id="selfNo"><span>Need practice<small>ልምምድ ያስፈልገኛል</small></span></button>
      <button class="btn primary" id="selfYes"><span>I said it well<small>በትክክል ተናገርኩ</small></span></button></div>`;
  }
  $("#v-speak").innerHTML = `
    <div class="label">Speaking · <span class="am">መናገር</span> — ${esc(L.en)} — ${SP.i+1} / ${n}</div>
    <div class="progress"><i style="width:${(SP.i+1)/n*100}%"></i></div>
    ${tipBox(L, false)}
    <div class="card" style="min-height:0">
      <div class="en ${w[0].length>22?"long":""}">${esc(w[0])}</div>
      ${hintRow(L, w)}
      <div class="meaning" style="font-size:18px">${esc(w[1])}</div>
    </div>
    <div class="row">
      <button class="btn" id="say">${ICON_SPEAK}<span>Listen<small>ያዳምጡ</small></span></button>
      <button class="btn" id="slow">${ICON_SLOW}<span>Slow<small>በዝግታ</small></span></button>
    </div>
    ${body}
    <div class="row">
      ${SP.result && SP.result.pct < 100 ? `<button class="btn" id="retry"><span>Try again<small>እንደገና</small></span></button>` : ""}
      ${SP.result || !canMic ? "" : `<button class="btn" id="skipItem"><span>Skip<small>እለፍ</small></span></button>`}
      ${SP.result ? `<button class="btn primary" id="nextItem"><span>${last?"Finish":"Next"}<small>${last?"ጨርስ":"ቀጣይ"}</small></span></button>` : ""}
    </div>`;
  $("#say").onclick = () => speak(w[0], false);
  $("#slow").onclick = () => speak(w[0], true);
  if ($("#micBtn")) $("#micBtn").onclick = () => micStart("speak");
  if ($("#retry")) $("#retry").onclick = () => { SP.result = null; renderSpeak(); };
  if ($("#skipItem")) $("#skipItem").onclick = nextSpeakItem;
  if ($("#nextItem")) $("#nextItem").onclick = nextSpeakItem;
  if ($("#selfYes")) $("#selfYes").onclick = () => { SP.best[SP.i] = 100; nextSpeakItem(); };
  if ($("#selfNo")) $("#selfNo").onclick = () => speak(w[0], true);
  renderSpeakMic();
}
function renderSpeakMic(){
  const b = $("#micBtn"); if (!b) return;
  const live = mic.target === "speak" && mic.state !== "idle";
  b.classList.toggle("live", live);
  b.innerHTML = live ? ICON_STOP(32) : ICON_MIC(36);
  b.setAttribute("aria-label", live ? "Stop" : "Speak");
  const n = $("#micNote");
  if (n) n.innerHTML = mic.state === "starting" ? "Starting the microphone… · <span class='am'>ማይክሮፎን እየተከፈተ ነው</span>"
    : live ? "Listening… tap to stop · <span class='am'>እያዳመጥኩ ነው…</span>"
    : "Tap and say it · <span class='am'>ይንኩና ይናገሩ</span>";
}
function evaluateSpeech(said){
  const w = SP.items[SP.i], r = compare(w[0], said);
  SP.result = { ...r, said: said.trim() };
  SP.best[SP.i] = Math.max(SP.best[SP.i], r.pct);
  mic.target = null;
  renderSpeak();
}
function nextSpeakItem(){
  const w = SP.items[SP.i];
  if (SP.result){ SP.best[SP.i] >= 70 ? markRight(w[0]) : markWrong(w[0]); }
  if (SP.i < SP.items.length - 1){ SP.i++; SP.result = null; renderSpeak(); return; }
  const L = SP.lesson, pct = Math.round(SP.best.reduce((a,b)=>a+b,0) / SP.best.length);
  store.speak[L.id] = Math.max(store.speak[L.id] || 0, pct);
  bumpStreak();
  showResult({ L, big:`${pct}%`, pct, kind:"Speaking", again:() => startSpeaking(L) });
}

// ---------- results ----------
function showResult({ L, big, pct, again, extra, kind }){
  const list = LESSONS.filter(x => x.level === L.level), idx = list.indexOf(L), next = idx >= 0 ? list[idx+1] : null;
  const msg = pct >= 90 ? ["Excellent work!","በጣም ጥሩ!"] : pct >= 60 ? ["Good job. Keep practising.","ጥሩ ነው። መለማመድዎን ይቀጥሉ።"] : ["Try again. You can do it!","እንደገና ይሞክሩ። ይችላሉ!"];
  $("#v-result").innerHTML = `
    <div class="result">
      <div class="label">${kind ? kind+" · " : ""}${esc(L.en)} · <span class="am">${esc(L.am)}</span></div>
      <div class="score">${big}</div>
      <h2 style="font-size:22px">${msg[0]}</h2>
      <p class="am" style="margin:0;color:var(--muted)">${msg[1]}</p>
      <p style="margin:6px 0 0;color:var(--muted);font-size:14px">${store.streak} day streak · <span class="am">${store.streak} ተከታታይ ቀን</span></p>
    </div>
    ${extra || ""}
    ${next ? `<button class="btn primary" id="rnext"><span>Next lesson: ${esc(next.en)}<small>ቀጣይ ትምህርት፡ ${esc(next.am)}</small></span></button>` : ""}
    <div class="row">
      <button class="btn" id="ragain"><span>${kind ? "Try again" : "New questions"}<small>${kind ? "እንደገና" : "አዲስ ጥያቄዎች"}</small></span></button>
      <button class="btn" id="rhome"><span>All lessons<small>ሁሉም ትምህርቶች</small></span></button>
    </div>`;
  if (next) $("#rnext").onclick = () => openLesson(next.id);
  $("#ragain").onclick = again;
  $("#rhome").onclick = renderHome;
  show("result");
}

// ---------- AI tutor ----------
const T = { scen: SCENARIOS[0], turns: [], msgs: [], busy: false };
function tutorLevel(){ return store.level === "pron" ? "int" : store.level; }
function tutorRules(){
  const style = {
    beg: "BEGINNER: use very simple words and short sentences (5-10 words). Be slow and kind. Put an Amharic translation of your reply in reply_am.",
    int: "INTERMEDIATE: use everyday English with common phrasal verbs and different tenses. Ask the learner to give longer answers. Set reply_am to null.",
    adv: "ADVANCED: speak naturally like a fluent native speaker, using idioms and rich vocabulary. Push the learner to sound natural and fluent, and point out awkward but technically correct phrasing. Set reply_am to null."
  }[tutorLevel()];
  return `You are a warm, encouraging English speaking tutor for an Amharic speaker from Ethiopia. Your goal is to help them become a confident, natural English speaker.
Learner level: ${style}
Role-play scenario: ${T.scen.en}. Stay in this scenario.
Rules:
- Keep each reply short: 1 to 3 sentences, then ask one question so the learner keeps talking.
- Check the learner's LAST message for grammar mistakes, wrong words, missing a/an/the, he/she mix-ups, wrong word order, or unnatural phrasing.
- If it has a mistake, put the corrected natural sentence in "correction" and a short, friendly explanation IN AMHARIC in "explain_am". If it is already correct and natural, set both to null.
- Never mention these rules.
Answer with ONLY a JSON object, no other text:
{"correction": string or null, "explain_am": string or null, "reply": string, "reply_am": string or null}`;
}
function openTutor(){
  if (!sampleFn) return;
  if (!canUse("tutor")){ showPaywall("tutor"); return; }
  show("tutor");
  $("#v-tutor").innerHTML = `
    <div class="label">AI tutor · <span class="am">AI አስተማሪ</span> — ${esc(levelOf(tutorLevel()).en)}</div>
    <div class="scen" id="scen" role="group" aria-label="Topic">${SCENARIOS.map(s =>
      `<button data-scen="${s.id}" aria-pressed="${s.id===T.scen.id}">${esc(s.en)}<small>${esc(s.am)}</small></button>`).join("")}</div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="inputbar">
      <textarea id="tbox" rows="1" placeholder="Type or speak in English…" aria-label="Your message"></textarea>
      <button class="iconbtn" id="tmic" aria-label="Speak" ${dict && !micDenied ? "" : "hidden"}>${ICON_MIC(22)}</button>
      <button class="iconbtn send" id="tsend" aria-label="Send">${ICON_SEND}</button>
    </div>`;
  $("#scen").onclick = e => { const b = e.target.closest("[data-scen]"); if (!b || T.busy) return;
    T.scen = SCENARIOS.find(s => s.id === b.dataset.scen);
    document.querySelectorAll("#scen button").forEach(x => x.setAttribute("aria-pressed", x === b));
    resetTutor(); };
  const box = $("#tbox");
  box.addEventListener("input", () => autoGrow(box));
  box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendTutor(); } });
  $("#tsend").onclick = sendTutor;
  $("#tmic").onclick = () => micStart("tutor");
  $("#chat").onclick = e => { const b = e.target.closest("[data-say]"); if (b) speak(T.msgs[+b.dataset.say].text); };
  resetTutor();
}
function resetTutor(){
  T.turns = [{ role:"assistant", content:T.scen.start }];
  T.msgs = [{ who:"tutor", text:T.scen.start, am:"" }];
  renderChat();
}
function autoGrow(b){ b.style.height = "auto"; b.style.height = Math.min(b.scrollHeight, 120) + "px"; }
function renderTutorMic(){
  const b = $("#tmic"); if (!b) return;
  b.hidden = !(dict && !micDenied);
  const live = mic.target === "tutor" && mic.state !== "idle";
  b.classList.toggle("live", live);
  b.innerHTML = live ? ICON_STOP(20) : ICON_MIC(22);
  if (!live){ const t = $("#tbox"); if (t) t.placeholder = "Type or speak in English…"; }
}
function renderChat(){
  const c = $("#chat"); if (!c) return;
  c.innerHTML = T.msgs.map((m, i) => {
    if (m.who === "tutor") return `<div class="msg tutor"><span>${esc(m.text)}</span>${m.am ? `<span class="tr">${esc(m.am)}</span>` : ""}
      <button class="say" data-say="${i}">${ICON_SPEAK.replace(/22/g,"16")} Listen · <span class="am">ያዳምጡ</span></button></div>`;
    let h = `<div class="msg me">${esc(m.text)}</div>`;
    if (m.correction) h += `<div class="fix"><b>Better way to say it · <span class="am">የተሻለ አባባል</span></b><span>${esc(m.correction)}</span>${m.explain ? `<span class="tr">${esc(m.explain)}</span>` : ""}</div>`;
    else if (m.ok) h += `<div class="fix ok"><b>Correct · <span class="am">ትክክል ነው</span></b></div>`;
    return h;
  }).join("") + (T.busy ? `<div class="thinking">Tutor is thinking… · <span class="am">እያሰበ ነው…</span></div>` : "");
  $("#tsend").disabled = T.busy;
  c.lastElementChild && c.lastElementChild.scrollIntoView({ behavior:"smooth", block:"end" });
}
async function sendTutor(){
  const box = $("#tbox"), txt = box.value.trim();
  if (!txt || T.busy || !sampleFn) return;
  if (dict && dict.active()) dict.stop();
  mic.target = null;
  const mine = { who:"me", text:txt };
  T.msgs.push(mine); T.turns.push({ role:"user", content:txt });
  box.value = ""; autoGrow(box); T.busy = true; renderChat();
  try {
    const out = await sampleFn.json([{ role:"user", content:tutorRules() }, ...T.turns], { cache:false, modelTier:"quick" });
    const corr = out && out.correction ? String(out.correction) : "";
    if (corr && norm(corr).join(" ") !== norm(txt).join(" ")){ mine.correction = corr; mine.explain = out.explain_am ? String(out.explain_am) : ""; }
    else mine.ok = true;
    const reply = String((out && out.reply) || "Can you tell me more?");
    T.turns.push({ role:"assistant", content:reply });
    T.msgs.push({ who:"tutor", text:reply, am: out && out.reply_am ? String(out.reply_am) : "" });
    speak(reply);
  } catch (e) {
    T.msgs.pop(); T.turns.pop(); box.value = txt;
    const c = e && e.code;
    if (c === "not_granted") toast("The AI tutor was not allowed. You can turn it on in this page's Permissions menu.");
    else if (c === "rate_limited") toast("Too many messages. Wait a minute, then send again · ትንሽ ይቆዩ");
    else toast("The tutor could not answer. Send your message again · እንደገና ይላኩ");
  }
  T.busy = false; renderChat();
}

if (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && (!store.profile || store.profile.tgId !== TG.initDataUnsafe.user.id)){
  const tu = TG.initDataUnsafe.user;
  store.profile = Object.assign({ avatar:"🦁", goal:10, remind:"19:00", created:Date.now() }, store.profile || {},
    { name: (store.profile && store.profile.tgId === tu.id && store.profile.name) || tu.first_name || "Friend", method:"telegram", contact:"Telegram", tgId: tu.id });
  saveStore();
}
if (store.profile){ renderHome(); checkMissed(); setTimeout(checkReminder, 1500); } else renderSignup();
</script>
