function balloonPlay(){
  const run = ++GRUN, balloonPool = L => gameWords(L, w => w[0].length <= 44 && w[1].length <= (L >= 3 ? 26 : 16));
  let all = balloonPool(1);
  const B = { L:1, hearts:3, score:0, round:0, missed:new Map(), bs:[], w:null, shown:false, last:0, over:false, wait:false };
  const COLORS = ["#e2574c", "#f2b134", "#3fae6a", "#3a8fd9", "#a35bd6", "#ef7fb0"];
  $("#v-game").innerHTML = gameHudHTML([`<span id="bLife">${lives(3)}</span>`, `<span>⭐ <b id="bScore">0</b></span>`, `<span class="glvl" id="gLvl">${lvlChip(1)}</span>`]) +
    `<div class="bctl"><button class="btn" id="bHear">🔊 Listen again · <span class="am">እንደገና</span></button><button class="btn" id="bShow">👀 Show word</button></div>
    <div class="bfield" id="bField"><div class="gmsg" id="gMsg"></div></div><div id="bPanel"></div>`;
  show("game"); wireSnd();
  const field = $("#bField"); field.style.height = Math.max(320, Math.min(520, window.innerHeight - 300)) + "px";
  const round = () => {
    if (GRUN !== run || B.over) return;
    B.round++; B.shown = false; B.wait = false; $("#bShow").textContent = "👀 Show word";
    field.querySelectorAll(".balloon").forEach(x => x.remove());
    const L = B.round < 5 ? 1 : B.round < 10 ? 2 : B.round < 15 ? 3 : 4;
    if (L !== B.L){ B.L = L; all = balloonPool(L); levelUp(L); }
    const w = pickOne(all); B.w = w;
    const others = shuffle(all.filter(x => x[1] !== w[1] && x[0] !== w[0])).slice(0, 3);
    const set = shuffle([w, ...others]), FH = field.clientHeight, FW = field.clientWidth;
    const speed = Math.min(95, 38 + B.round * 3.2);
    B.bs = set.map((x, i) => {
      const el = document.createElement("button"); el.className = "balloon" + (x[1].length > 14 ? " long" : ""); el.style.setProperty("--c", COLORS[(B.round + i) % COLORS.length]);
      el.innerHTML = `<span class="am">${esc(x[1])}</span>`; field.appendChild(el);
      const b = { el, w:x, x:(i + .5) / set.length, y:FH + 30 + Math.random() * 90, sp:speed * (.85 + Math.random() * .3), ph:Math.random() * 6, popped:false };
      el.onclick = () => pop(b); return b;
    });
    setTimeout(() => { if (GRUN === run) speak(w[0]); }, 250);
  };
  const lose = (msg) => {
    B.hearts--; B.missed.set(B.w[0], B.w); markWrong(B.w[0]); SFX.bite(); $("#bLife").textContent = lives(B.hearts);
    gameMsgIn(msg + " " + B.w[0], B.w[1], 1400);
    B.wait = true;
    if (B.hearts <= 0){ B.over = true; setTimeout(() => gameOverPanel($("#bPanel"), "balloon", B.score, `🎈 Game over · <span class="am">ጨዋታው አለቀ!</span> ${B.round - 1} rounds`, B.missed, balloonPlay), 1300); }
    else setTimeout(round, 1500);
  };
  const pop = b => {
    if (B.wait || b.popped || B.over) return;
    b.popped = true; b.el.classList.add("pop");
    if (b.w === B.w){
      B.wait = true; B.score += B.shown ? 4 : 10 + Math.min(10, B.round); markRight(B.w[0]);
      $("#bScore").textContent = B.score; gameBeep(300, 1200, .12, "triangle", .1);
      gameMsgIn("🎉 " + B.w[0], pickOne(CHEER_RIGHT)[0], 900); setTimeout(round, 1000);
    } else { b.el.classList.add("no"); lose("✖"); }
  };
  $("#bHear").onclick = () => B.w && speak(B.w[0]);
  $("#bShow").onclick = () => { if (!B.w) return; B.shown = true; $("#bShow").textContent = "👀 " + B.w[0]; };
  const loop = ts => {
    if (GRUN !== run || current !== "game" || !document.body.contains(field)) return;
    const dt = B.last ? Math.min(.05, (ts - B.last) / 1000) : 0; B.last = ts;
    if (!B.wait && !B.over){
      const FW = field.clientWidth;
      B.bs.forEach(b => {
        if (b.popped) return;
        b.y -= b.sp * dt; b.ph += dt * 2;
        b.el.style.transform = `translate(${b.x * FW - 40 + Math.sin(b.ph) * 6}px, ${b.y}px)`;
      });
      const target = B.bs.find(b => b.w === B.w);
      if (target && !target.popped && target.y < -110) lose("💨");
    }
    requestAnimationFrame(loop);
  };
  round(); requestAnimationFrame(loop);
}

          <button class="btn gold" id="dNext">Next case · ቀጣይ ምስጢር →</button></div>`;
        $("#dNext").onclick = () => { D.i++; render(); };
      } else {
        D.tries++; D.hearts--; b.classList.add("bad"); b.disabled = true; SFX.bite(); $("#dLife").textContent = lives(D.hearts);
        D.missed.set(m.q, [m.opts[m.a], m.tam]);
        if (!D.extra){ D.extra = true; $("#dExtra").hidden = false; $("#dHint").disabled = true; }
        if (D.hearts <= 0) setTimeout(() => gameOverPanel(area(), "detective", D.score, "🕵️ Case closed! · <span class=\"am\">ጨዋታው አለቀ!</span>", D.missed, detectivePlay), 900);
        else $("#dWhy").innerHTML = `<div class="gwhy"><b>❌ Not quite. Read the clues again. · <span class="am">ፍንጮቹን እንደገና ያንብቡ።</span></b></div>`;
      }
    };
  };
  render();
}

const LOWER_START = /^(The|A|An|My|Your|His|Her|Our|Their|This|That|These|Those|He|She|It|We|They|You|There|What|Where|When|Why|How|Who|Whose|Which|Do|Does|Did|Is|Are|Was|Were|Can|Could|Will|Would|Should|Have|Has|Had|If|Although|Even|Unless|Instead|First|On|In|At|Yesterday|Today|Tomorrow|Let's|Let|Breakfast|Coffee|English|Not|Yes|No|Your|Our|Please|May|Must|Am|Some|Many|Much|Every|Each|However|Therefore|Because|So|But|And)$/;
function builderIntro(){
  GRUN++; stopSound();
  const gl = LESSONS.filter(l => l.grammar);
  $("#v-game").innerHTML = `<div class="gstart"><div class="gbadge">🧩</div><h1>Sentence Builder</h1><p class="am gsub">ዓረፍተ ነገር ገንቢ</p>
    <p>Tap the words in the right order, then press <b>Check</b>. Tap a word again to take it back. 💡 Hint shows the next word.</p>
    <p class="am">ቃላቱን በትክክለኛ ቅደም ተከተል ይንኩ፣ ከዚያ <b>Check</b> ይጫኑ። ቃሉን መልሰው ለማንሳት እንደገና ይንኩት።</p>
    ${gameBest("builder") ? `<p class="grec">🏆 Your best: ${gameBest("builder")} ⭐</p>` : ""}
    <p class="label">Choose grammar · <span class="am">ሰዋሰው ይምረጡ</span></p>
    <div class="bgram">${[1, 2, 3].map(m => `<p class="gsmall"><b>${MONTHS[m - 1].en} · ${esc(MONTHS[m - 1].sub)}</b></p>` + gl.filter(l => monthOf(l) === m).map(l => `<button data-gl="${l.id}">${esc(l.en)}</button>`).join("")).join("")}</div>
    <div class="grow"><button class="btn gold" data-gl="mix">🎲 Mixed: easy → hard</button><button class="btn" id="gBack">All games · ሁሉም ጨዋታዎች</button></div></div>`;
  $("#gBack").onclick = openGames;
  $("#v-game").querySelectorAll("[data-gl]").forEach(b => b.onclick = () => builderPlay(b.dataset.gl));

}
function builderPlay(gid){
  const run = ++GRUN, gl = LESSONS.filter(l => l.grammar);
  const okW = w => isSentence(w) && toks(w[0]).length <= 11;
  let items;
  if (gid === "mix") items = [1, 2, 3].flatMap(m => shuffle(gl.filter(l => monthOf(l) === m).flatMap(l => l.words.filter(okW).map(w => [w, l]))).slice(0, 4));
  else { const L = gl.find(l => l.id === gid); items = shuffle(L.words.filter(okW)).slice(0, 8).map(w => [w, L]); }
  const B = { i:0, score:0, missed:new Map(), placed:[], tries:0, hints:0, done:false };
  $("#v-game").innerHTML = gameHudHTML([`<span class="glvl" id="bbN">1/${items.length}</span>`, `<span>⭐ <b id="bbScore">0</b></span>`]) + `<div id="bbArea"></div>`;
  show("game"); wireSnd();
  const render = () => {
    if (GRUN !== run) return;
    if (B.i >= items.length){ gameOverPanel($("#bbArea"), "builder", B.score, `🧩 Well built! ${items.length} sentences · <span class="am">ጎበዝ!</span>`, B.missed, () => builderPlay(gid)); return; }
    const [w, L] = items[B.i], q = orderQuestion(w);
    if (!q){ B.i++; render(); return; }
    const chips = q.order.map(pi => { const t = q.parts[pi]; return pi === 0 && LOWER_START.test(t) ? t[0].toLowerCase() + t.slice(1) : t; });
    Object.assign(B, { q, w, L, chips, placed:[], tries:0, hints:0, done:false });
    $("#bbN").textContent = `${B.i + 1}/${items.length}`;
    draw();
  };
  const draw = () => {
    const { q, w, L, chips } = B;
    $("#bbArea").innerHTML = `<p class="gsmall">🧩 ${esc(L.en)}</p><div class="tq"><span class="am">${esc(w[1])}</span></div>
      <div class="tline" id="bbLine">${B.placed.length ? B.placed.map((k, i) => `<button class="tslot on ${B.bad && B.bad[i] ? "bad" : ""}" data-p="${i}">${esc(i === 0 ? cap(chips[k]) : chips[k])}</button>`).join("") : `<span class="gsmall">Tap the words below · ቃላቱን ይንኩ</span>`}<span class="tend">${B.placed.length === chips.length ? esc(q.end) : ""}</span></div>
      <div class="tchips">${chips.map((t, k) => `<button data-k="${k}" ${B.placed.includes(k) ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>
      <div class="grow g2"><button class="btn" id="bbHint" ${B.done ? "disabled" : ""}>💡 Hint</button><button class="btn gold" id="bbCheck" ${B.placed.length === chips.length && !B.done ? "" : "disabled"}>✔ Check</button></div><div id="bbWhy"></div>`;
    if (B.done) showWhy();
    $("#bbArea").querySelector(".tchips").onclick = e => { const b = e.target.closest("[data-k]"); if (!b || B.done) return; B.placed.push(+b.dataset.k); B.bad = null; gameBeep(520, 640, .06, "triangle", .05); draw(); };
    $("#bbLine").onclick = e => { const b = e.target.closest("[data-p]"); if (!b || B.done) return; B.placed.splice(+b.dataset.p, 1); B.bad = null; draw(); };
    $("#bbHint").onclick = () => {
      const want = B.q.parts[B.placed.length]; let i = 0;
      while (i < B.placed.length && B.q.parts[B.q.order[B.placed[i]]] === B.q.parts[i]) i++;
      B.placed = B.placed.slice(0, i);
      const k = B.chips.findIndex((_, kk) => !B.placed.includes(kk) && B.q.parts[B.q.order[kk]] === B.q.parts[i]);
      if (k >= 0){ B.placed.push(k); B.hints++; } B.bad = null; draw();
    };
    $("#bbCheck").onclick = check;
  };
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const check = () => {
    const got = B.placed.map(k => B.q.parts[B.q.order[k]]), ok = got.every((t, i) => t === B.q.parts[i]);
    if (ok){
      B.done = true; const pts = Math.max(3, 15 - B.tries * 5 - B.hints * 3); B.score += pts; B.pts = pts; markRight(B.w[0]);
      $("#bbScore").textContent = B.score; SFX.win(); sayIfOn(B.w[0]); draw();
    } else {
      B.tries++; B.bad = got.map((t, i) => t !== B.q.parts[i]); gameBeep(200, 120, .15, "square", .06);
      if (B.tries >= 2){ B.done = true; B.pts = 0; B.missed.set(B.w[0], B.w); markWrong(B.w[0]); }
      draw();
    }
  };
  const showWhy = () => {
    const good = B.pts > 0;
    $("#bbWhy").innerHTML = `<div class="gwhy ${good ? "ok" : ""}"><b>${good ? `✅ Correct! +${B.pts} ⭐` : "📝 The correct sentence:"}</b>

        $("#mPanel").scrollIntoView({ block:"nearest" });
        if (!last) $("#mNext").onclick = () => matchPlay(lv + 1, total);
        $("#mEnd").onclick = () => gameOverPanel($("#mPanel"), "match", total, `🧠 Memory master! · <span class="am">የማስታወስ ጀግና!</span>`, new Map(), () => matchPlay(1, 0));
      }

  };
}

const RACE = [
  [1, "She go to school every day.", "She goes to school every day.", ["She going to school every day.", "She go to the school every day."], "He / she / it: add -s to the verb (go → goes)."],
  [1, "I am agree with you.", "I agree with you.", ["I am agreeing with you.", "I agrees with you."], "'Agree' is a verb. Don't put 'am' before it."],
  [1, "He have two brothers.", "He has two brothers.", ["He haves two brothers.", "He having two brothers."], "He / she / it + has (not have)."],
  [1, "I have a umbrella.", "I have an umbrella.", ["I have the a umbrella.", "I has an umbrella."], "Use 'an' before a vowel sound: an umbrella, an apple."],
  [1, "They is my friends.", "They are my friends.", ["They am my friends.", "They be my friends."], "They / we / you + are."],
  [1, "I can to swim.", "I can swim.", ["I can swimming.", "I cans swim."], "After 'can', use the verb with no 'to'."],
  [1, "She don't like coffee.", "She doesn't like coffee.", ["She not like coffee.", "She doesn't likes coffee."], "He / she / it + doesn't + verb (no -s)."],
  [1, "My birthday is on May.", "My birthday is in May.", ["My birthday is at May.", "My birthday in May."], "Months use 'in': in May. Days use 'on': on Monday."],
  [1, "We was at home.", "We were at home.", ["We is at home.", "We be at home."], "We / you / they + were (past of 'are')."],
  [1, "She is my freind.", "She is my friend.", ["She is my frend.", "She is my freand."], "Spelling: f-r-i-e-n-d."],
  [2, "Yesterday I eat injera.", "Yesterday I ate injera.", ["Yesterday I eating injera.", "Yesterday I eated injera."], "'Yesterday' = past. Eat → ate (irregular)."],
  [2, "I goed to the market.", "I went to the market.", ["I go to the market yesterday.", "I wented to the market."], "Go → went. It's irregular, no -ed."],
  [2, "He is more tall than me.", "He is taller than me.", ["He is tallest than me.", "He is more taller than me."], "Short adjectives: add -er (tall → taller)."],
  [2, "I didn't went to work.", "I didn't go to work.", ["I didn't goes to work.", "I not went to work."], "After 'didn't', use the base verb: didn't go."],
  [2, "Where you are going?", "Where are you going?", ["Where you going?", "Where are going you?"], "In questions, 'are' comes before 'you'."],
  [2, "I am going to home.", "I am going home.", ["I am go home.", "I going to home."], "'Home' needs no 'to': go home, come home."],
  [2, "Explain me the problem.", "Explain the problem to me.", ["Explain to me problem.", "Explain me about the problem."], "Explain something TO someone."],
  [2, "There is many people here.", "There are many people here.", ["There is much people here.", "There are much people here."], "Many people = plural → 'there are'."],
  [2, "I will call you when I will arrive.", "I will call you when I arrive.", ["I call you when I will arrive.", "I will call you when I arrived."], "After 'when' (future), use the present: when I arrive."],
  [2, "Tommorow is Sunday.", "Tomorrow is Sunday.", ["Tomorow is Sunday.", "Tommorrow is Sunday."], "Spelling: t-o-m-o-r-r-o-w (one m, two r)."],
  [3, "If I will have time, I will help you.", "If I have time, I will help you.", ["If I had time, I will help you.", "If I will have time, I help you."], "After 'if' (future idea), use the present: If I have time…"],
  [3, "I look forward to hear from you.", "I look forward to hearing from you.", ["I look forward hearing from you.", "I look forward to heard from you."], "'Look forward to' + -ing."],
  [3, "I have been to Gondar last year.", "I went to Gondar last year.", ["I have went to Gondar last year.", "I go to Gondar last year."], "With a finished time (last year), use the past simple."],
  [3, "I am living here since 2020.", "I have lived here since 2020.", ["I live here since 2020.", "I am lived here since 2020."], "'Since + a time' → present perfect: I have lived."],
  [3, "The news are very good.", "The news is very good.", ["The news were very good.", "The new is very good."], "'News' is uncountable, so it takes 'is'."],
  [3, "Despite of the rain, we went out.", "Despite the rain, we went out.", ["Although of the rain, we went out.", "Despite the rain, we go out yesterday."], "'Despite' has no 'of'. (In spite OF = despite.)"],
  [3, "She asked me where do I live.", "She asked me where I live.", ["She asked me where I do live.", "She asked to me where I live."], "Reported questions use normal word order: where I live."],
  [3, "I'm used to wake up early.", "I'm used to waking up early.", ["I'm use to wake up early.", "I used to waking up early."], "'Be used to' + -ing = it is normal for me."],
  [3, "This is the more beautiful city I have ever seen.", "This is the most beautiful city I have ever seen.", ["This is the beautifulest city I have ever seen.", "This is most beautiful city I ever seen."], "'The most' + long adjective, with 'ever'."],
  [3, "I recieved your message.", "I received your message.", ["I receeved your message.", "I received you message."], "Spelling rule: 'i before e, except after c' → receive."],
  [3, "He suggested me to rest.", "He suggested that I rest.", ["He suggested me resting.", "He suggested to me rest."], "Suggest + that + person + verb."],
  [3, "Neither of the answers are correct.", "Neither of the answers is correct.", ["Neither the answers are correct.", "Neither of answer is correct."], "'Neither of…' takes a singular verb: is."]];

        <button class="btn gold" id="raNext">${R.hearts <= 0 ? "See score" : "Next · ቀጣይ"} →</button></div>`;
      $("#raNext").onclick = () => { if (R.hearts <= 0){ R.over = true; gameOverPanel($("#raArea"), "race", R.score, "🏃 Race over! · <span class=\"am\">ሩጫው አለቀ!</span>", R.missed, racePlay); } else { R.i++; render(); } }; }
    $("#raScore").textContent = R.score;

    ${gameBest("duel") ? `<p class="grec">🏆 Wins: ${gameBest("duel")}</p>` : ""}
    <div class="grow"><button class="btn gold" data-cpu="1">🤖 vs Computer · Easy</button><button class="btn gold" data-cpu="2">🤖 vs Computer · Normal</button><button class="btn gold" data-cpu="3">🤖 vs Computer · Hard</button>
    <button class="btn" data-cpu="0">👥 2 players on one phone · 2 ተጫዋቾች</button><button class="btn" id="gBack">All games · ሁሉም ጨዋታዎች</button></div></div>`;

function duelPlay(cpu){
  const run = ++GRUN, D = { p:0, o:0, round:0, lock:false, timer:null }, WIN = 7;
  const kinds = ["vocab", "grammar", "spell", "vocab", "complete", "clue"];
  const oName = cpu ? "🤖 Computer" : "🧑 Player 2";
  $("#v-game").innerHTML = `<div class="dscore"><span>🧑 ${cpu ? "You" : "Player 1"} <b id="duP">0</b></span><span class="gq">vs</span><span><b id="duO">0</b> ${oName}</span></div>
    ${cpu ? "" : `<div class="dpad top" id="duPad2"></div>`}<div class="dq2" id="duQ"></div><div class="dpad" id="duPad1"></div><div id="duEnd"></div>`;
  show("game");
  const pads = () => cpu ? [$("#duPad1")] : [$("#duPad1"), $("#duPad2")];
  const round = () => {
    if (GRUN !== run) return;
    D.round++; D.lock = false; D.out = new Set();
    const L = Math.min(4, 1 + Math.floor((D.p + D.o) / 4));
    const q = makeQ(kinds, L); D.q = q;
    $("#duQ").innerHTML = `<p class="qask">Round ${D.round} · ${esc(q.ask)}</p><div class="qp ${q.pAm ? "am" : ""} ${q.mono ? "mono" : ""}">${esc(q.p)}</div><div id="duMsg" class="dmsg"></div>`;
    pads().forEach((pad, pi) => { pad.innerHTML = (pi === 1 ? `<div class="dqmini ${q.pAm ? "am" : ""}">${esc(q.p)}</div>` : "") + q.opts.map((o, i) => `<button data-c="${i}" class="${q.optsAm ? "am" : ""}">${esc(o)}</button>`).join("");
      pad.onclick = e => { const b = e.target.closest("[data-c]"); if (b && !b.disabled) answer(pi === 0 ? "p" : "o", q.opts[+b.dataset.c] === q.a, b); }; });
    if (cpu){ const think = [0, [3200, 6200], [2300, 4600], [1500, 3100]][cpu]; clearTimeout(D.timer);
      D.timer = setTimeout(() => { if (GRUN === run && !D.lock) answer("o", Math.random() < [0, .6, .75, .88][cpu], null); }, think[0] + Math.random() * (think[1] - think[0])); }
  };
  const answer = (who, ok, b) => {
    if (D.lock || D.out.has(who)) return;
    if (b) b.classList.add(ok ? "ok" : "bad");
    if (ok){
      D.lock = true; clearTimeout(D.timer); D[who]++; $("#duP").textContent = D.p; $("#duO").textContent = D.o;
      who === "p" ? SFX.win() : SFX.bite();
      $("#duMsg").innerHTML = `${who === "p" ? (cpu ? "🧑 You got it!" : "🧑 Player 1 scores!") : cpu ? "🤖 Computer was faster!" : "🧑 Player 2 scores!"} · <b>${esc(D.q.a)}</b>`;
      pads().forEach(p => p.querySelectorAll("[data-c]").forEach((x, i) => { x.disabled = true; if (D.q.opts[i] === D.q.a) x.classList.add("ok"); }));
      setTimeout(() => { if (GRUN !== run) return; if (D.p >= WIN || D.o >= WIN) finish(); else round(); }, 1500);
    } else {
      D.out.add(who); if (who === "p" && D.q.w) markWrong(D.q.w[0]);
      $("#duMsg").textContent = who === "p" ? (cpu ? "❌ Wrong! Wait…" : "❌ Player 1 is out this round") : cpu ? "🤖 Computer made a mistake!" : "❌ Player 2 is out this round";
      const pad = who === "p" ? $("#duPad1") : $("#duPad2"); if (pad) pad.querySelectorAll("[data-c]").forEach(x => x.disabled = true);
      if (!cpu && D.out.size >= 2 || cpu && D.out.size >= 2){ D.lock = true; clearTimeout(D.timer); $("#duMsg").innerHTML = `Nobody scores. Answer: <b>${esc(D.q.a)}</b>`; setTimeout(round, 1700); }
    }
  };
  const finish = () => {
    const pw = D.p >= WIN;
    if (cpu && pw){ if (!store.games) store.games = {}; store.games.duel = (store.games.duel || 0) + 1; saveStore(); party(); }
    $("#duPad1").innerHTML = ""; if ($("#duPad2")) $("#duPad2").innerHTML = "";
    $("#duQ").innerHTML = `<div class="gshop"><p class="gtitle">${pw ? (cpu ? "🏆 You win! · አሸነፉ!" : "🏆 Player 1 wins!") : cpu ? "🤖 The computer wins this time · በሚቀጥለው ያሸንፋሉ!" : "🏆 Player 2 wins!"}</p>
      <p class="gbig">${D.p} – ${D.o}</p><div class="grow"><button class="btn gold" id="duAgain">Rematch · እንደገና 🥊</button><button class="btn" id="duAll">All games · ሁሉም ጨዋታዎች</button></div></div>`;
    $("#duAgain").onclick = () => duelPlay(cpu); $("#duAll").onclick = openGames;
  };
  round();
}

const HUMAN_TALK = [["Someone sneezes. Humans say…", "Bless you!"], ["You meet someone for the first time.", "Nice to meet you."], ["Someone gives you a gift.", "Thank you so much!"],

function qHuman(){ const h = pickOne(HUMAN_TALK), others = shuffle(HUMAN_TALK.filter(x => x !== h)).slice(0, 3).map(x => x[1]);

function alienPlay(){

    if (q.kind !== "human"){ q.ask = "The alien asks: \"What does this mean?\""; q.askAm = "ባዕዱ ይጠይቃል፦ ምን ማለት ነው?"; }

function bombPlay(){
  const run = ++GRUN, B = { bomb:1, cut:0, t:0, max:0, score:0, missed:new Map(), busy:false }, WIRES = ["#e2574c", "#3a8fd9", "#f2b134", "#3fae6a"];

  const newBomb = () => { B.cut = 0; B.max = Math.max(14, 32 - (B.bomb - 1) * 3); B.t = B.max; $("#boN").textContent = B.bomb; wires(); };

      else { B.t = Math.max(.5, B.t - 4); qMiss(B.missed, q); SFX.bite(); $("#boBomb").classList.add("shake"); setTimeout(() => $("#boBomb") && $("#boBomb").classList.remove("shake"), 400); }
      await wait(ok ? 600 : 1800); if (GRUN !== run || B.dead) return;
      if (B.cut >= WIRES.length){
        B.score += Math.round(B.t) * 2; $("#boS").textContent = B.score; SFX.win();

      setTimeout(() => gameOverPanel($("#boQ"), "bomb", B.score, `💥 BOOM! You defused ${B.bomb - 1} bomb${B.bomb === 2 ? "" : "s"}. · <span class="am">ቦምቡ ፈነዳ!</span>`, B.missed, bombPlay), 700); }
  }, 100);
  newBomb(); next();
}

function openLesson(id){ const L = LESSONS.find(l => l.id === id); const m = monthOf(L); if (!canUseMonth(m)){ showPaywall(m); return; } openLessonNow(id); }
function openLessonNow(id){ S.lesson = LESSONS.find(l=>l.id===id); S.i=0; S.flipped=false; S.tipOpen=true; renderCard(); show("cards"); }

  $("#card").onclick = () => { S.flipped = !S.flipped; renderCard(); };
  $("#v-cards #say").onclick = () => speak(sayText(L, w), false);
  $("#v-cards #slow").onclick = () => speak(sayText(L, w), true);
  $("#prev").onclick = () => { if (S.i>0){ S.i--; S.flipped=false; renderCard(); } };

  if ($("#go")) $("#go").onclick = () => startQuiz(L, "lesson");

}

// ---------- quiz ----------
// type 0: English -> Amharic, 1: Amharic -> English, 2: listen -> English, 3: listen -> which of two similar words
function poolFor(w){
  const lv = (WORDMAP[w[0]] || {}).level;
  return LESSONS.filter(l => l.level === lv).flatMap(l => l.words).filter(x => x !== w && x[0] !== w[0]);
}
function buildQuestion(w, type, pool){
  const src = (pool && pool.length >= 3) ? pool : poolFor(w);
  const sameKind = src.filter(x => (x[0].length > 14) === (w[0].length > 14));
  const others = shuffle(sameKind.length >= 3 ? sameKind : src).filter(x => x[0] !== w[0] && x[1] !== w[1]).slice(0, 3);
  return { type, word: w, options: shuffle([w, ...others]) };
}
// ---- endless practice: new random questions every time ----
// type 4: put words in order, 5: fill the gap, 6: which sentence is correct
const SWAP = { is:"are", are:"is", am:"is", was:"were", were:"was", has:"have", have:"has", does:"do", do:"does",
  "doesn't":"don't", "don't":"doesn't", "isn't":"aren't", "aren't":"isn't", "wasn't":"weren't", "weren't":"wasn't", a:"an", an:"a" };
const QUIZ_LEN = 12;
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function toks(s){ return s.trim().split(/\s+/).map(t => { const m = t.match(/^(["“(]*)(.*?)([.,!?;:"”)]*)$/); return { pre:m[1], core:m[2], post:m[3] }; }); }
const joinToks = ts => ts.map(t => t.pre + t.core + t.post).join(" ");
const plainWord = c => /^[A-Za-z][A-Za-z'’-]*$/.test(c);
const isSentence = w => toks(w[0]).length >= 3 && !/[\/…↗↘]/.test(w[0]);
const capLike = (src, word) => /^[A-Z]/.test(src) ? word[0].toUpperCase() + word.slice(1) : word;
function swapIdx(w){
  if (/\bif I were\b/i.test(w[0]) || /[\/…]/.test(w[0])) return [];
  return toks(w[0]).map((t, i) => SWAP[t.core.toLowerCase()] ? i : -1).filter(i => i >= 0);
}
function correctQuestion(w){
  const idx = swapIdx(w); if (!idx.length) return null;
  const ts = toks(w[0]), t = ts[pickOne(idx)];
  t.core = capLike(t.core, SWAP[t.core.toLowerCase()]);
  const bad = joinToks(ts);
  return { type:6, word:w, options:shuffle([w[0], bad]), correctOpt:w[0] };
}
function gapQuestion(w, L){
  const ts = toks(w[0]); let cand = swapIdx(w);
  const grammar = cand.length > 0 && Math.random() < .7;
  if (!grammar) cand = ts.map((t, i) => t.core.length >= 3 && plainWord(t.core) ? i : -1).filter(i => i >= 0);
  if (!cand.length) return null;
  const i = pickOne(cand), ans = ts[i].core, opts = [ans];
  if (grammar) opts.push(capLike(ans, SWAP[ans.toLowerCase()]));
  const bank = shuffle([...new Set(L.words.flatMap(x => toks(x[0]).slice(1).map(t => t.core)).filter(c => c.length >= 2 && plainWord(c)))]);
  for (const b of bank){ if (opts.length >= 4) break; if (!opts.some(o => o.toLowerCase() === b.toLowerCase())) opts.push(i === 0 ? capLike("A", b) : b); }
  if (opts.length < 3) return null;
  const gap = ts.map((t, k) => k === i ? t.pre + "_____" + t.post : t.pre + t.core + t.post).join(" ");
  return { type:5, word:w, gap, options:shuffle(opts), correctOpt:ans };
}
function orderQuestion(w){
  const ts = toks(w[0]); if (ts.length < 3 || ts.length > 10) return null;
  const parts = ts.map(t => t.pre + t.core + t.post);
  parts[parts.length - 1] = parts[parts.length - 1].replace(/[.!?]+$/, "");
  let order = shuffle(parts.map((_, k) => k)), n = 0;
  while (order.every((v, k) => parts[v] === parts[k]) && n++ < 10) order = shuffle(order);
  return { type:4, word:w, parts, order, picked:[], end:(w[0].match(/[.!?]+$/) || [""])[0] };
}
function lessonQuiz(L){
  const qs = [], used = new Set(), want = Math.min(QUIZ_LEN, L.words.length * 2);
  for (let tries = 0; qs.length < want && tries < 400; tries++){
    const w = pickOne(L.words), types = [0, 1, 2];
    if (isSentence(w)) types.push(4, 4, 5, 5);
    if (swapIdx(w).length) types.push(6, 6, 5);
    const t = pickOne(types), key = w[0] + "|" + t;
    if (used.has(key) || (qs.length && qs[qs.length - 1].word === w)) continue;
    const q = t === 4 ? orderQuestion(w) : t === 5 ? gapQuestion(w, L) : t === 6 ? correctQuestion(w)
      : buildQuestion(w, t, L.words.filter(x => x !== w));
    if (!q) continue;
    used.add(key); qs.push(q);
  }
  // pronunciation lessons: add listening questions with the sound pairs
  (L.pairs ? shuffle(L.pairs).slice(0, 4) : []).forEach(p => {
    const a = [p[0], ""], b = [p[1], ""], t = Math.random() < .5 ? a : b;
    qs.splice(Math.floor(Math.random() * (qs.length + 1)), 0, { type:3, word:t, options:shuffle([a, b]) });
  });
  return qs;
}
function startQuiz(L, mode, items){
  S.mode = mode; S.lesson = L;
  if (mode === "lesson"){
    S.quiz = lessonQuiz(L);
  } else {
    S.quiz = items;
  }
  S.qi = 0; S.score = 0; renderQ(); show("quiz");
}
function renderQ(){
  const q = S.quiz[S.qi], n = S.quiz.length; S.answered = false;
  let prompt;
  if (q.type === 0) prompt = `<div class="ask">What does this mean? · <span class="am">ትርጉሙ ምንድን ነው?</span></div><div class="big">${esc(q.word[0])}</div>`;
  else if (q.type === 1) prompt = `<div class="ask">Choose the English · <span class="am">በእንግሊዝኛ ይምረጡ</span></div><div class="big am">${esc(q.word[1])}</div>`;
  else if (q.type === 4) prompt = `<div class="ask">Put the words in order · <span class="am">ቃላቱን በቅደም ተከተል ያስቀምጡ</span></div><div class="big am" style="font-size:clamp(20px,5.6vw,26px)">${esc(q.word[1])}</div>`;
  else if (q.type === 5) prompt = `<div class="ask">Fill the gap · <span class="am">ባዶውን ቦታ ይሙሉ</span></div><div class="big">${esc(q.gap)}</div><div class="sub am">${esc(q.word[1])}</div>`;
  else if (q.type === 6) prompt = `<div class="ask">Which sentence is correct? · <span class="am">የትኛው ትክክል ነው?</span></div><div class="big am" style="font-size:clamp(20px,5.6vw,26px)">${esc(q.word[1])}</div>`;
  else prompt = `<div class="ask">${q.type===3 ? "Which word do you hear? · <span class='am'>የትኛውን ቃል ሰሙ?</span>" : "Listen and choose · <span class='am'>ያዳምጡና ይምረጡ</span>"}</div>
    <button class="speakbig" id="qsay" aria-label="Play sound">${ICON_SPEAK.replace(/22/g,"40")}</button>
    <button class="slowlink" id="qslow">${ICON_SLOW.replace(/22/g,"18")} Slow · <span class="am">በዝግታ</span></button>`;
  const optCls = q.type === 0 ? "opt am" : "opt";
  const optText = o => typeof o === "string" ? o : q.type === 0 ? o[1] : o[0];
  const title = S.mode === "place" ? "Level test" : S.mode === "review" ? "Review" : S.mode === "exam" ? "Final exam" : "Question";
  const body = q.type === 4
    ? `<div class="built" id="built" aria-label="Your sentence"></div><div class="tiles" id="tiles"></div>
       <div class="row"><button class="btn" id="oclear"><span>Clear<small>አጥፋ</small></span></button>
       <button class="btn primary" id="ocheck" disabled><span>Check<small>አረጋግጥ</small></span></button></div>`
    : `<div class="opts">${q.options.map((o,k)=>`<button class="${optCls}" data-k="${k}">${esc(optText(o))}</button>`).join("")}</div>`;
  $("#v-quiz").innerHTML = `
    <div class="label">${title} ${S.qi+1} of ${n} · <span class="am">ጥያቄ ${S.qi+1}/${n}</span></div>
    <div class="progress"><i style="width:${S.qi/n*100}%"></i></div>
    <div class="qprompt">${prompt}</div>
    ${body}
    ${S.mode === "place" ? `<button class="btn" id="qdunno"><span>I don't know<small>አላውቅም</small></span></button>` : ""}
    <div id="fb"></div>`;
  if (q.type === 2 || q.type === 3){ $("#qsay").onclick = () => speak(q.word[0]); $("#qslow").onclick = () => speak(q.word[0], true); setTimeout(()=>speak(q.word[0]), 250); }
  if (q.type === 4){ renderTiles(); return; }
  $("#v-quiz .opts").onclick = e => { const b = e.target.closest("[data-k]"); if (b) answer(+b.dataset.k); };
  if ($("#qdunno")) $("#qdunno").onclick = () => answer(-1);
}
function renderTiles(){
  const q = S.quiz[S.qi];
  $("#built").innerHTML = q.picked.map((v, k) => `<button class="tile" data-un="${k}">${esc(q.parts[v])}</button>`).join("");
  $("#tiles").innerHTML = q.order.map(v => `<button class="tile ${q.picked.includes(v)?"used":""}" data-v="${v}" ${q.picked.includes(v)?"disabled":""}>${esc(q.parts[v])}</button>`).join("");
  $("#ocheck").disabled = q.picked.length !== q.parts.length;
  $("#tiles").onclick = e => { const b = e.target.closest("[data-v]"); if (!b || S.answered) return; q.picked.push(+b.dataset.v); renderTiles(); };
  $("#built").onclick = e => { const b = e.target.closest("[data-un]"); if (!b || S.answered) return; q.picked.splice(+b.dataset.un, 1); renderTiles(); };
  $("#oclear").onclick = () => { if (S.answered) return; q.picked = []; renderTiles(); };
  $("#ocheck").onclick = () => {
    const ok = q.picked.map(v => q.parts[v]).join(" ") === q.parts.join(" ");
    $("#built").classList.add(ok ? "right" : "wrong");
    $("#oclear").disabled = $("#ocheck").disabled = true;
    answer(ok ? 1 : 0);
  };
}
function answer(k){
  if (S.answered) return; S.answered = true;
  const q = S.quiz[S.qi], target = q.correctOpt !== undefined ? q.correctOpt : q.word;
  const ok = q.type === 4 ? k === 1 : (k >= 0 && q.options[k] === target);
  if (ok) S.score++;
  if (q.levelTag){ q.correct = ok; }
  if (S.mode !== "place" && q.type !== 3){ ok ? markRight(q.word[0]) : markWrong(q.word[0]); }
  if (q.type !== 4) document.querySelectorAll("#v-quiz .opt").forEach((b,i) => {
    if (q.options[i] === target) b.classList.add("right"); else if (i === k) b.classList.add("wrong");
  });
  if ($("#qdunno")) $("#qdunno").disabled = true;
  if (S.mode !== "place") speak(q.word[0]);
  const last = S.qi === S.quiz.length - 1;
  const detail = q.type === 3 ? `You heard: <b>${esc(q.word[0])}</b>` : `${esc(q.word[0])} = <span class="am">${esc(q.word[1])}</span>`;
  $("#fb").innerHTML = S.mode === "place" ? "" : `
    <div class="feedback ${ok?"good":"bad"}">
      ${(() => { const c = pickOne(ok ? CHEER_RIGHT : CHEER_WRONG); return `<b class="pop"><span class="cheer">${ok ? "✓" : "✗"} ${c[0]}</span></b>`; })()}
      <span>${detail}</span>
    </div>`;
  $("#fb").insertAdjacentHTML("beforeend", `<button class="btn primary" id="qnext" style="margin-top:12px;width:100%">${last ? `<span>See result<small>ውጤት ይመልከቱ</small></span>` : nextBtn()}</button>`);
  $("#qnext").onclick = () => { if (last) finishQuiz(); else { S.qi++; renderQ(); } };
  $("#qnext").scrollIntoView({ behavior:"smooth", block:"nearest" });
}
function finishQuiz(){
  if (S.mode === "place") return finishPlacement();
  const n = S.quiz.length, pct = Math.round(S.score / n * 100), L = S.lesson;
  bumpStreak();
  if (S.mode === "review"){
    showResult({ L, big:`${S.score}/${n}`, pct, again: L.id === "mix" ? () => month4("mix") : startReview, kind:"Review" });
    return;
  }
  if (S.mode === "exam"){
    const passed = pct >= PASS_MARK;
    store.best.exam = Math.max(store.best.exam || 0, pct);
    saveStore();
    showResult({ L, big:`${pct}%`, pct, again:() => month4("exam"), kind:"Final exam", extra: passed
      ? `<p class="foot" style="margin:0;font-size:1.05em"><b>🎉 You passed! You finished the Fidel English course!</b><br><span class="am">አልፈዋል! ኮርሱን ጨርሰዋል! እልልልልል! 🦁</span></p>`
      : `<p class="foot" style="margin:0">You need ${PASS_MARK}% to pass. Do the big review and try again!<br><span class="am">ለማለፍ ${PASS_MARK}% ያስፈልጋል። ይከልሱና እንደገና ይሞክሩ!</span></p>` });
    return;
  }
  store.best[L.id] = Math.max(store.best[L.id] || 0, pct); saveStore();
  showResult({ L, big:`${S.score}/${n}`, pct, again:() => startQuiz(L, "lesson"), extra:
    `<button class="btn gold" id="rspk">${ICON_MIC(20)}<span>Now practise speaking<small>አሁን መናገር ይለማመዱ</small></span></button>` });
  $("#rspk").onclick = () => startSpeaking(L);
}

function startReview(){
  if (!canUse("lessons")){ showPaywall("lessons"); return; }
  const keys = shuffle(Object.keys(store.wrong).filter(k => WORDMAP[k])).slice(0, 10);
  if (!keys.length){ toast("No mistakes to review. Great work! · የሚከለስ ስህተት የለም"); renderHome(); return; }
  const items = keys.map((k, i) => buildQuestion(WORDMAP[k].w, i % 3));
  startQuiz({ id:"review", en:"Your mistakes", am:"ስህተቶችዎ", words:[] }, "review", items);
}

// ---------- placement test ----------
const PLACE_N = 5;
function startPlacement(){
  const pick = lv => shuffle(LESSONS.filter(l => l.level === lv && !l.month).flatMap(l => l.words)).slice(0, PLACE_N);
  const items = [];
  ["beg","int","adv"].forEach(lv => pick(lv).forEach(w => { const q = buildQuestion(w, 0); q.levelTag = lv; items.push(q); }));
  startQuiz({ id:"place", en:"Level test", am:"የደረጃ ፈተና", words:[] }, "place", items);
}
function finishPlacement(){
  const got = lv => S.quiz.filter(q => q.levelTag === lv && q.correct).length;
  const b = got("beg"), i = got("int"), a = got("adv");
  // Fair rules: a level counts as passed with 3 of 5. One or two unknown easy words
  // shouldn't hold back a student who does well on the harder questions.
  const rec = (a >= 3 && i >= 3) ? "adv" : (i >= 3 || (b >= 4 && i >= 2)) ? "int" : "beg";
  const L = levelOf(rec);
  store.placed = true; saveStore();
  $("#v-result").innerHTML = `
    <div class="result">
      <div class="label">Your level · <span class="am">ደረጃዎ</span></div>
      <div class="score" style="font-size:40px">${L.en}</div>
      <p class="am" style="margin:0;font-size:20px">${L.am}</p>
      <p style="margin:8px 0 0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums">Beginner ${b}/${PLACE_N} · Intermediate ${i}/${PLACE_N} · Advanced ${a}/${PLACE_N}</p>
      <p style="margin:6px 0 0;font-size:15px">Start with <b>${({ beg:"Month 1", int:"Month 2", adv:"Month 3" })[rec]}</b> · <span class="am">በ${({ beg:"ወር 1", int:"ወር 2", adv:"ወር 3" })[rec]} ይጀምሩ</span></p>
    </div>
    <p class="foot" style="margin:0">Also do the Pronunciation section. It fixes the sounds that are hardest for Amharic speakers.<br><span class="am">የአነባበብ ክፍሉንም ይስሩ። ለአማርኛ ተናጋሪዎች ከባድ የሆኑትን ድምፆች ያስተካክላል።</span></p>
    <button class="btn primary" id="pStart"><span>Start ${L.en} lessons<small>${L.am} ትምህርቶችን ይጀምሩ</small></span></button>`;
  $("#pStart").onclick = () => { store.level = rec; store.month = ({ beg:1, int:2, adv:3 })[rec] || 1; saveStore(); renderHome(); };
  show("result");
}

// ---------- speaking practice ----------
const SP = { lesson:null, items:[], i:0, best:[], result:null };
const PASS_SPEAK = 70;
const NUMS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const norm = s => s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean)
  .map(t => /^\d+$/.test(t) && +t <= 12 ? NUMS[+t] : t);
function compare(target, said){
  const pool = norm(said); let total = 0, hit = 0;
  const res = target.split(/\s+/).map(chunk => {
    const toks = norm(chunk); if (!toks.length) return [chunk, true];
    total++;
    const ok = toks.every(tk => { const i = pool.indexOf(tk); if (i >= 0){ pool.splice(i,1); return true; } return false; });
    if (ok) hit++;
    return [chunk, ok];
  });
  return { res, pct: total ? Math.round(hit / total * 100) : 0 };
}
function startSpeaking(L){
  if (!canUseMonth(monthOf(L))){ showPaywall(monthOf(L)); return; }
  SP.lesson = L; SP.items = shuffle(L.words).slice(0, 8); SP.i = 0; SP.best = SP.items.map(() => 0); SP.result = null; SP.fails = 0;
  renderSpeak(); show("speak");
}
function renderSpeak(){
  const L = SP.lesson; if (!L) return;
  const w = SP.items[SP.i], n = SP.items.length, last = SP.i === n-1, canMic = !!dict && !micDenied;
  let body;
  if (SP.result){
    const r = SP.result;
    const pass = r.pct >= PASS_SPEAK;
    if (!r.cheer) r.cheer = pickOne(pass ? CHEER_RIGHT : CHEER_WRONG);
    const msg = r.pct === 100 ? ["✓ " + r.cheer[0], `<span class="am">ፍጹም! አልፈዋል</span>`] : pass ? ["✓ " + r.cheer[0], `<span class="am">አልፈዋል</span>`] : ["✗ " + r.cheer[0], r.cheer[0].includes("እንደገና") ? "" : `<span class="am">እንደገና ይሞክሩ</span>`];
    body = `<div class="feedback ${pass?"good":"bad"} pop"><b><span class="cheer">${msg[0]}</span> ${msg[1]}</b><span>${r.pct}% correct</span>
        <span>You said: “${esc(r.said)}”</span></div>
      <div class="words">${r.res.map(([c,ok]) => `<span class="w ${ok?"ok":"no"}">${esc(c)}</span>`).join("")}</div>
      ${r.pct < 100 ? `<p class="micnote">Red words were missing or unclear. Listen again, then repeat.<br><span class="am">ቀይ ቃላት በደንብ አልተሰሙም። እንደገና ያዳምጡና ይድገሙ።</span></p>` : ""}`;
  } else if (canMic){
    body = `<p class="micnote">1. Tap <b>Listen</b> and repeat after me. 2. Tap <b>Record</b> and say it.<br><span class="am">1. ያዳምጡና ይድገሙ። 2. ይቅረጹና ይናገሩ።</span></p>
      <div class="micwrap"><button class="mic" id="micBtn" aria-label="Record">${ICON_MIC(36)}</button>
      <p class="micnote" id="micNote">🎤 Record · <span class="am">ይቅረጹ</span></p>
      <div class="heard" id="heard"></div></div>`;
  } else {
    const inTG = !!(window.Telegram && Telegram.WebApp && Telegram.WebApp.initData);
    const isFile = !/^https?:$/.test(location.protocol), online = onlineCourseUrl();
    const why = inTG ? ["Telegram can't use the microphone on this phone.", "Open the course in Chrome to record yourself and get ✓ or ✗.", "ድምፅዎን ለመቅረጽና ለመፈተሽ ኮርሱን በ Chrome ይክፈቱ።"]
      : isFile ? ["Recording works in the online course.", "This downloaded copy is for learning without internet. To record yourself and get ✓ or ✗, open the online course (needs internet).", "ለመቅረጽና ለመፈተሽ የኦንላይን ኮርሱን ይክፈቱ (ኢንተርኔት ያስፈልጋል)።"]
      : micDenied ? ["The microphone is turned off for this page.", "Tap the 🔒 lock next to the web address, allow the Microphone, then reload the page.", "ከአድራሻው አጠገብ ያለውን 🔒 ይንኩ፣ ማይክሮፎንን ይፍቀዱ፣ ከዚያ ገጹን እንደገና ይክፈቱ።"]
      : ["This browser can't check your speaking.", "Open the course in Google Chrome to record yourself and get ✓ or ✗.", "ለመፈተሽ ኮርሱን በ Google Chrome ይክፈቱ።"];
    body = `<div class="feedback bad" style="background:var(--gold-soft);color:var(--fg)"><b>🎤 ${why[0]}</b><span>${why[1]}</span><span class="am">${why[2]}</span></div>
      ${inTG ? `<button class="btn primary" id="openChrome"><span>Open in Chrome<small>በ Chrome ክፈት</small></span></button>` : ""}
      ${isFile && online ? `<a class="btn primary" style="text-decoration:none" href="${esc(online)}" target="_blank" rel="noopener"><span>Open the online course<small>የኦንላይን ኮርሱን ክፈት</small></span></a>` : ""}
      <p class="micnote">For now: tap Listen and repeat it out loud 3 times.<br><span class="am">ለአሁን፦ ያዳምጡና 3 ጊዜ ጮክ ብለው ይድገሙ።</span></p>`;
  }
  $("#v-speak").innerHTML = `
    <div class="label">Speaking · <span class="am">መናገር</span> — ${esc(L.en)} — ${SP.i+1} / ${n}</div>
    <div class="progress"><i style="width:${(SP.i+1)/n*100}%"></i></div>
    ${tipBox(L, false)}
    <div class="card" style="min-height:0">
      <div class="en ${w[0].length>22?"long":""}">${esc(w[0])}</div>
      ${hintRow(L, w)}
      <div class="meaning" style="font-size:18px">${esc(w[1])}</div>
    </div>
    <div class="row">
      <button class="btn" id="say">${ICON_SPEAK}<span>Listen<small>ያዳምጡ</small></span></button>
      <button class="btn" id="slow">${ICON_SLOW}<span>Slow<small>በዝግታ</small></span></button>
    </div>
    ${body}
    <div class="row">
      ${SP.result && SP.result.pct < 100 ? `<button class="btn" id="retry"><span>Try again<small>እንደገና</small></span></button>` : ""}
      ${SP.result ? "" : `<button class="btn" id="skipItem"><span>${canMic ? "Skip" : (last ? "Finish" : "Next")}<small>${canMic ? "እለፍ" : (last ? "ጨርስ" : "ቀጣይ")}</small></span></button>`}
      ${SP.result ? `<button class="btn ${SP.result.pct >= PASS_SPEAK ? "primary" : ""}" id="nextItem">${last ? `<span>Finish<small>ጨርስ</small></span>` : nextBtn()}</button>` : ""}
    </div>`;
  $("#v-speak #say").onclick = () => speak(w[0], false);
  $("#v-speak #slow").onclick = () => speak(w[0], true);
  if ($("#micBtn")) $("#micBtn").onclick = () => micStart("speak");
  if ($("#retry")) $("#retry").onclick = () => { SP.result = null; renderSpeak(); };
  if ($("#skipItem")) $("#skipItem").onclick = nextSpeakItem;
  if ($("#nextItem")) $("#nextItem").onclick = nextSpeakItem;
  if ($("#openChrome")) $("#openChrome").onclick = () => { try { Telegram.WebApp.openLink(location.href); } catch(e){ location.href = location.href; } };
  renderSpeakMic();
}
function renderSpeakMic(){
  const b = $("#micBtn"); if (!b) return;
  const live = mic.target === "speak" && mic.state !== "idle";
  b.classList.toggle("live", live);
  b.innerHTML = live ? ICON_STOP(32) : ICON_MIC(36);
  b.setAttribute("aria-label", live ? "Stop" : "Speak");
  const n = $("#micNote");
  if (n) n.innerHTML = mic.state === "starting" ? "Starting the microphone… · <span class='am'>ማይክሮፎን እየተከፈተ ነው</span>"
    : live ? "Listening… speak now, tap to stop · <span class='am'>እያዳመጥኩ ነው… ይናገሩ</span>"
    : "🎤 Record · <span class='am'>ይቅረጹ</span>";
}
function evaluateSpeech(said){
  const w = SP.items[SP.i];
  let r = compare(w[0], said);
  (mic.alts || []).forEach(alt => { const r2 = compare(w[0], alt); if (r2.pct > r.pct){ r = r2; said = alt; } });
  SP.result = { ...r, said: said.trim() };
  if (r.pct >= PASS_SPEAK) SP.result.cheer = pickOne(CHEER_RIGHT);
  else { SP.fails = (SP.fails || 0) + 1; SP.result.cheer = FAIL_STEPS[Math.min(SP.fails, FAIL_STEPS.length) - 1]; }
  SP.best[SP.i] = Math.max(SP.best[SP.i], r.pct);
  mic.target = null;
  renderSpeak();
}
function nextSpeakItem(){
  const w = SP.items[SP.i];
  if (SP.result){ SP.best[SP.i] >= 70 ? markRight(w[0]) : markWrong(w[0]); }
  SP.fails = 0;
  if (SP.i < SP.items.length - 1){ SP.i++; SP.result = null; renderSpeak(); return; }
  const L = SP.lesson, pct = Math.round(SP.best.reduce((a,b)=>a+b,0) / SP.best.length);
  if (!dict){ renderHome(); toast("Practice done! Open in Chrome to get a speaking score · በ Chrome ውጤት ያግኙ"); return; }
  store.speak[L.id] = Math.max(store.speak[L.id] || 0, pct);
  bumpStreak();
  showResult({ L, big:`${pct}%`, pct, kind:"Speaking", again:() => startSpeaking(L) });
}

// ---------- fun Amharic cheers ----------
const CHEER_RIGHT = [["ጎበዝ!","Clever!"],["ጀግና!","Hero!"],["ጀግናዬ!","My hero!"],["እሰይ!","Yay!"],["አሪፍ ነው!","Cool!"],
  ["ምርጥ!","Excellent!"],["ልክ ነው! ጎበዝ!","That's right!"],["ዋው! ጎበዝ ጀግና!","Wow, well done!"],["ኮራሁብዎ!","I'm proud of you!"],["እሰይ እሰይ!","Yes, yes!"],["ስልሚቻል! ጎበዝ ጀግና!","Well done, hero!"]];
const CHEER_WRONG = [["እረ ጉድ!","Oh my!"],["እረ በለው!","Oh, come on!"],["ኧረ ተው!","No way!"],["ወይኔ!","Oops!"],["ትንሽ ቀረዎት!","So close!"],["አይዞዎት!","Don't worry!"]];
const FAIL_STEPS = [["እስቲ እንደገና!","Let's try again!"],["እረ ወይኔ!","Oh no!"],["ምን ጉድ ነው!","What happened?!"],["እረ ጎበዝ!","Come on, you can do it!"]];
const NEXT_WORDS = [["እንቀጥል!","Next"],["ቀጣዩ ይምጣ!","Next"],["ወደፊት!","Next"],["ሌላ ይምጣ!","Next"]];
function nextBtn(){ const n = pickOne(NEXT_WORDS); return `<span class="am">${n[0]} →</span><small>${n[1]}</small>`; }
function party(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const d = document.createElement("div"); d.className = "party"; d.setAttribute("aria-hidden", "true");
  const bits = ["🎉","🦁","⭐","🎊","👏","🌟"];
  for (let i = 0; i < 26; i++){
    const sp = document.createElement("span"); sp.textContent = pickOne(bits);
    sp.style.left = Math.random() * 100 + "%"; sp.style.animationDelay = Math.random() * 0.8 + "s";
    d.appendChild(sp);
  }
  document.body.appendChild(d); setTimeout(() => d.remove(), 3500);
}

// ---------- results ----------
function showResult({ L, big, pct, again, extra, kind }){
  const list = LESSONS.filter(x => x.level === L.level), idx = list.indexOf(L), next = idx >= 0 ? list[idx+1] : null;
  const msg = pct >= 90 ? ["Excellent work! You finished like a champion!","እልልልልል! 🎉 ጀግና!"]
    : pct >= 60 ? ["Good job. Keep practising.","እሰይ እሰይ ጀግና! 👏"]
    : ["Try again. You can do it!","አይዞዎት! 💪 እንደገና እንሞክር"];
  $("#v-result").innerHTML = `
    <div class="result">
      <div class="label">${kind ? kind+" · " : ""}${esc(L.en)} · <span class="am">${esc(L.am)}</span></div>
      <div class="score pop">${big}</div>
      <div class="cheer pop" style="color:var(--gold)">${msg[1]}</div>
      <p style="margin:6px 0 0;color:var(--muted);font-size:14px">${store.streak} day streak · <span class="am">${store.streak} ተከታታይ ቀን</span></p>
    </div>
    ${extra || ""}
    ${next ? `<button class="btn primary" id="rnext"><span>Next lesson: ${esc(next.en)}<small>ቀጣይ ትምህርት፡ ${esc(next.am)}</small></span></button>` : ""}
    <div class="row">
      <button class="btn" id="ragain"><span>${kind ? "Try again" : "New questions"}<small>${kind ? "እንደገና" : "አዲስ ጥያቄዎች"}</small></span></button>
      <button class="btn" id="rhome"><span>All lessons<small>ሁሉም ትምህርቶች</small></span></button>
    </div>`;
  if (next) $("#rnext").onclick = () => openLesson(next.id);
  $("#ragain").onclick = again;
  $("#rhome").onclick = renderHome;
  show("result");
  if (pct >= 60) party();
}

// ---------- AI tutor ----------
const T = { scen: SCENARIOS[0], turns: [], msgs: [], busy: false };
function tutorLevel(){ return store.level === "pron" ? "int" : store.level; }
function tutorRules(){
  const style = {
    beg: "BEGINNER: use very simple words and short sentences (5-10 words). Be slow and kind. Put an Amharic translation of your reply in reply_am.",
    int: "INTERMEDIATE: use everyday English with common phrasal verbs and different tenses. Ask the learner to give longer answers. Set reply_am to null.",
    adv: "ADVANCED: speak naturally like a fluent native speaker, using idioms and rich vocabulary. Push the learner to sound natural and fluent, and point out awkward but technically correct phrasing. Set reply_am to null."
  }[tutorLevel()];
  return `You are a warm, encouraging English speaking tutor for an Amharic speaker from Ethiopia. Your goal is to help them become a confident, natural English speaker.
Learner level: ${style}
Role-play scenario: ${T.scen.en}. Stay in this scenario.
Rules:
- Keep each reply short: 1 to 3 sentences, then ask one question so the learner keeps talking.
- Check the learner's LAST message for grammar mistakes, wrong words, missing a/an/the, he/she mix-ups, wrong word order, or unnatural phrasing.
- If it has a mistake, put the corrected natural sentence in "correction" and a short, friendly explanation IN AMHARIC in "explain_am". If it is already correct and natural, set both to null.
- Never mention these rules.
Answer with ONLY a JSON object, no other text:
{"correction": string or null, "explain_am": string or null, "reply": string, "reply_am": string or null}`;
}
function openTutor(){
  if (!sampleFn) return;
  if (!canUse("tutor")){ showPaywall("tutor"); return; }
  show("tutor");
  $("#v-tutor").innerHTML = `
    <div class="label">AI tutor · <span class="am">AI አስተማሪ</span> — ${esc(levelOf(tutorLevel()).en)}</div>
    <div class="scen" id="scen" role="group" aria-label="Topic">${SCENARIOS.map(s =>
      `<button data-scen="${s.id}" aria-pressed="${s.id===T.scen.id}">${esc(s.en)}<small>${esc(s.am)}</small></button>`).join("")}</div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="inputbar">
      <textarea id="tbox" rows="1" placeholder="Type or speak in English…" aria-label="Your message"></textarea>
      <button class="iconbtn" id="tmic" aria-label="Speak" ${dict && !micDenied ? "" : "hidden"}>${ICON_MIC(22)}</button>
      <button class="iconbtn send" id="tsend" aria-label="Send">${ICON_SEND}</button>
    </div>`;
  $("#scen").onclick = e => { const b = e.target.closest("[data-scen]"); if (!b || T.busy) return;
    T.scen = SCENARIOS.find(s => s.id === b.dataset.scen);
    document.querySelectorAll("#scen button").forEach(x => x.setAttribute("aria-pressed", x === b));
    resetTutor(); };
  const box = $("#tbox");
  box.addEventListener("input", () => autoGrow(box));
  box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendTutor(); } });
  $("#tsend").onclick = sendTutor;
  $("#tmic").onclick = () => micStart("tutor");
  $("#chat").onclick = e => { const b = e.target.closest("[data-say]"); if (b) speak(T.msgs[+b.dataset.say].text); };
  resetTutor();
}
function resetTutor(){
  T.turns = [{ role:"assistant", content:T.scen.start }];
  T.msgs = [{ who:"tutor", text:T.scen.start, am:"" }];
  renderChat();
}
function autoGrow(b){ b.style.height = "auto"; b.style.height = Math.min(b.scrollHeight, 120) + "px"; }
function renderTutorMic(){
  const b = $("#tmic"); if (!b) return;
  b.hidden = !(dict && !micDenied);
  const live = mic.target === "tutor" && mic.state !== "idle";
  b.classList.toggle("live", live);
  b.innerHTML = live ? ICON_STOP(20) : ICON_MIC(22);
  if (!live){ const t = $("#tbox"); if (t) t.placeholder = "Type or speak in English…"; }
}
function renderChat(){
  const c = $("#chat"); if (!c) return;
  c.innerHTML = T.msgs.map((m, i) => {
    if (m.who === "tutor") return `<div class="msg tutor"><span>${esc(m.text)}</span>${m.am ? `<span class="tr">${esc(m.am)}</span>` : ""}
      <button class="say" data-say="${i}">${ICON_SPEAK.replace(/22/g,"16")} Listen · <span class="am">ያዳምጡ</span></button></div>`;
    let h = `<div class="msg me">${esc(m.text)}</div>`;
    if (m.correction) h += `<div class="fix"><b>Better way to say it · <span class="am">የተሻለ አባባል</span></b><span>${esc(m.correction)}</span>${m.explain ? `<span class="tr">${esc(m.explain)}</span>` : ""}</div>`;
    else if (m.ok) h += `<div class="fix ok"><b>Correct · <span class="am">ትክክል ነው</span></b></div>`;
    return h;
  }).join("") + (T.busy ? `<div class="thinking">Tutor is thinking… · <span class="am">እያሰበ ነው…</span></div>` : "");
  $("#tsend").disabled = T.busy;
  c.lastElementChild && c.lastElementChild.scrollIntoView({ behavior:"smooth", block:"end" });
}
async function sendTutor(){
  const box = $("#tbox"), txt = box.value.trim();
  if (!txt || T.busy || !sampleFn) return;
  if (dict && dict.active()) dict.stop();
  mic.target = null;
  const mine = { who:"me", text:txt };
  T.msgs.push(mine); T.turns.push({ role:"user", content:txt });
  box.value = ""; autoGrow(box); T.busy = true; renderChat();
  try {
    const out = await sampleFn.json([{ role:"user", content:tutorRules() }, ...T.turns], { cache:false, modelTier:"quick" });
    const corr = out && out.correction ? String(out.correction) : "";
    if (corr && norm(corr).join(" ") !== norm(txt).join(" ")){ mine.correction = corr; mine.explain = out.explain_am ? String(out.explain_am) : ""; }
    else mine.ok = true;
    const reply = String((out && out.reply) || "Can you tell me more?");
    T.turns.push({ role:"assistant", content:reply });
    T.msgs.push({ who:"tutor", text:reply, am: out && out.reply_am ? String(out.reply_am) : "" });
    speak(reply);
  } catch (e) {
    T.msgs.pop(); T.turns.pop(); box.value = txt;
    const c = e && e.code;
    if (c === "not_granted") toast("The AI tutor was not allowed. You can turn it on in this page's Permissions menu.");
    else if (c === "rate_limited") toast("Too many messages. Wait a minute, then send again · ትንሽ ይቆዩ");
    else toast("The tutor could not answer. Send your message again · እንደገና ይላኩ");
  }
  T.busy = false; renderChat();
}

if (store.profile){ renderHome(); checkMissed(); setTimeout(checkReminder, 1500); } else renderSignup();
</script>
