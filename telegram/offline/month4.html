<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<title>Fidel English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column, one task per screen, sticky top bar with streak */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --fg:#16231D; --muted:#5B6B62; --line:#DCE3DD;
  --accent:#1F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E1EFE8;
  --gold:#A8700F; --gold-soft:#FBF0D9;
  --good:#1E7A46; --good-soft:#E2F4E8; --bad:#B23A2E; --bad-soft:#FBE5E2;
  --font-en:"Lexend","Noto Sans Ethiopic",system-ui,sans-serif;
  --font-am:"Noto Sans Ethiopic","Nyala","Ebrima",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#18231D; --fg:#E7EFEA; --muted:#9AAFA3; --line:#2A3A31;
  --accent:#4FB58A; --accent-ink:#0B1410; --accent-soft:#1D3329;
  --gold:#E2B04F; --gold-soft:#33291A;
  --good:#5CC98A; --good-soft:#173324; --bad:#F07A6C; --bad-soft:#3A1E1B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#18231D; --fg:#E7EFEA; --muted:#9AAFA3; --line:#2A3A31;
  --accent:#4FB58A; --accent-ink:#0B1410; --accent-soft:#1D3329;
  --gold:#E2B04F; --gold-soft:#33291A;
  --good:#5CC98A; --good-soft:#173324; --bad:#F07A6C; --bad-soft:#3A1E1B; color-scheme:dark;}

body{background:var(--bg);color:var(--fg);font-family:var(--font-en);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.am{font-family:var(--font-am)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:13px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

h1,h2{text-wrap:balance;margin:0}
.view{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.goal{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.goal h1{font-size:22px;font-weight:700}
.goal p{margin:0;opacity:.92}
.goal .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
.goal .bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}

.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.lvl{border-radius:12px;padding:8px 4px;text-align:center;line-height:1.25;font-weight:500;font-size:15px}
.lvl small{display:block;font-family:var(--font-am);font-weight:400;font-size:12px;color:var(--muted)}
.lvl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lvl[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}

.action{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.action .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.action b{display:block;font-size:16px}
.action span.s{display:block;font-size:14px;color:var(--muted)}
.action.gold{background:var(--gold-soft);border-color:var(--gold)}
.action.gold .ic{background:var(--gold);color:var(--surface)}
.action.off{cursor:default}
.action.off .ic{background:var(--line);color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.trial{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:14px}
.trial b{color:var(--gold)}
.trial button{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap}
.plans{display:flex;flex-direction:column;gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.plan.best{border:2px solid var(--gold)}
.plan h2{font-size:18px;margin:0}
.plan .price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .price small{font-size:14px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.plan .tagb{align-self:flex-start;font-size:12px;font-weight:700;background:var(--gold);color:var(--surface);border-radius:99px;padding:3px 10px}
.lesson.locked{opacity:.6}
.lesson.locked .num{background:var(--line)}
.paynote{font-size:13px;color:var(--muted);text-align:center}

.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.lesson:active{transform:scale(.99)}
.num{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.lesson.done .num{background:var(--accent);color:var(--accent-ink)}
.lt{flex:1;min-width:0}
.lt b{display:block;font-weight:500}
.lt span{display:block;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-family:var(--font-en);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-right:4px}
.pills{flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.on{background:var(--good-soft);color:var(--good)}

.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.tip{background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.tip summary{font-weight:700;color:var(--accent);cursor:pointer}
.tip p{margin:8px 0 0}
.tip p.am{color:var(--fg)}
.pairs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:240px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%}
.card .en{font-size:clamp(26px,7.5vw,38px);font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.card .en.long{font-size:clamp(21px,5.8vw,29px)}
.card .pron{font-family:var(--font-am);color:var(--muted);font-size:17px}
.card .pron small{font-family:var(--font-en);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.card .thnote{font-size:12px;color:var(--muted)}
.card .meaning{font-family:var(--font-am);font-size:clamp(21px,6.2vw,29px);font-weight:600;color:var(--accent);padding-top:12px;margin-top:6px;border-top:1px dashed var(--line);width:100%}
.card .tap{font-size:14px;color:var(--gold);font-weight:500}

.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 14px;border-radius:14px;font-weight:500;background:var(--surface);border:1px solid var(--line);text-align:center;line-height:1.25}
.btn small{display:block;font-family:var(--font-am);font-weight:400;font-size:13px;color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary small{color:var(--accent-ink);opacity:.85}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.btn.gold small{color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{flex:none}

.qprompt{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.qprompt .ask{font-size:14px;color:var(--muted)}
.qprompt .big{font-size:clamp(23px,6.8vw,34px);font-weight:700;line-height:1.25;text-wrap:balance}
.speakbig{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.slowlink{font-size:14px;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:6px}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:56px;padding:12px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:17px;font-weight:500;text-align:left}
.opt.am{font-size:18px}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-size:17px}
.qprompt .sub{font-size:17px;color:var(--muted)}
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border-radius:14px;border:2px dashed var(--line);background:var(--surface)}
.built.right{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.built.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:44px;padding:8px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:17px;font-weight:500}
.tile.used{visibility:hidden}
.built .tile{border-color:var(--accent);color:var(--accent)}

.micwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.mic{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 0 var(--accent-soft);transition:box-shadow .3s}
.mic.live{background:var(--bad);color:#fff;box-shadow:0 0 0 12px var(--bad-soft)}
.micnote{font-size:14px;color:var(--muted);text-align:center;margin:0}
.heard{min-height:24px;font-size:15px;color:var(--muted);text-align:center;font-style:italic}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.w{padding:4px 10px;border-radius:10px;font-weight:500;font-size:17px}
.w.ok{background:var(--good-soft);color:var(--good)}
.w.no{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}

.scen{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scen button{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1.2;text-align:center}
.scen button small{display:block;font-family:var(--font-am);font-size:12px;color:var(--muted)}
.scen button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scen button[aria-pressed="true"] small{color:var(--accent-ink)}
.chat{display:flex;flex-direction:column;gap:12px;min-height:200px}
.msg{max-width:86%;padding:12px 14px;border-radius:18px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.msg.tutor{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg .tr{font-family:var(--font-am);font-size:14px;color:var(--muted)}
.msg .say{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:500}
.fix{align-self:flex-end;max-width:86%;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:14px;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.fix b{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.fix .tr{font-family:var(--font-am);font-size:14px;color:var(--muted)}
.fix.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.fix.ok b{color:var(--good)}
.thinking{align-self:flex-start;color:var(--muted);font-size:14px;padding:6px 4px}
.inputbar{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line)}
.inputbar textarea{flex:1;min-width:0;resize:none;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:48px;max-height:120px}
.iconbtn{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn.send{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.iconbtn:disabled{opacity:.45}

.result{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.score{font-size:56px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:20}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:24px;line-height:1}
.avatarbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;line-height:1}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.hero .big{font-size:84px;line-height:1.1}
.hero h1{font-size:24px}
.hero p{margin:0;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:14px;font-weight:500}
.field input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%}
.field input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.field .err{font-size:13px;color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:10px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent);font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{min-height:44px;min-width:44px;padding:6px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.choices button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.choices.emoji button{font-size:26px;padding:4px 8px}
.mascot{display:flex;align-items:flex-end;gap:10px}
.mascot .face{flex:none;font-size:52px;line-height:1}
.mascot .bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;padding:10px 14px;font-size:15px}
.mascot .bubble .am{display:block;color:var(--muted);font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:22px;padding:22px 18px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.modal .box .big{font-size:72px;line-height:1.1}
.modal .box h2{font-size:21px}
.modal .box p{margin:0;color:var(--muted)}
html.playing #say,html.playing #slow,html.playing #qsay,html.playing #qslow{animation:pulse .8s ease-in-out infinite;border-color:var(--accent)}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
.version{font-size:11px;color:var(--muted);text-align:center;margin:0}
.cheer{font-family:var(--font-am);font-size:30px;font-weight:700;line-height:1.2}
.feedback .cheer{font-size:24px}
.party{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.party span{position:absolute;top:-10%;font-size:28px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(360deg);opacity:.2}}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.party{display:none}}
/* game: Save the Village */
.gstart{text-align:center;padding:18px 2px}
.gstart h1{margin:.3em 0 0;font-size:28px}
.gsub{font-size:20px;margin:0 0 .6em;font-weight:700;color:var(--gold)}
.gart{display:flex;justify-content:space-between;align-items:flex-end;font-size:38px;padding:18px 22px 10px;border-radius:20px;background:linear-gradient(#070b24,#2a2152 60%,#3b2a1a 61%)}
.ghow{text-align:left;padding-left:20px;font-size:14px;color:var(--muted)}
.grec{font-weight:700;color:var(--gold)}
.ghud{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 0;font-size:15px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.ghud button{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.gfield{position:relative;border-radius:18px;overflow:hidden;background:#070b24;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.gfield canvas{display:block;width:100%}
.gmsg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;font-size:22px;font-weight:700;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .3s;padding:12px}
.gmsg .am{display:block;font-size:17px}
.gmsg.on{opacity:1}
.gask{text-align:center;padding:10px 0 8px;font-size:22px;font-weight:700;min-height:48px}
.gq{color:var(--muted)} .gwait{font-size:15px;font-weight:500;color:var(--muted)}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gopts.long{grid-template-columns:1fr}
.gopts button{min-height:54px;padding:8px 10px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:16px;line-height:1.25;touch-action:manipulation}
.gopts.long button{min-height:46px;font-size:15px}
.gopts button:active{transform:scale(.97);border-color:var(--gold)}
.gopts button.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.gshop{padding:10px 0}
.gtitle{font-weight:700;font-size:18px;margin:.2em 0}
.gbig{font-size:22px;font-weight:700;margin:.2em 0}
.gsmall{font-size:14px;color:var(--muted);margin:.2em 0 .8em}
.gitems{display:grid;gap:8px;margin-bottom:12px}
.gitem{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

/* games menu */
.ghub-h{text-align:center;padding:14px 0 4px}.ghub-h h1{margin:0;font-size:26px}.ghub-h p{margin:.2em 0 0;color:var(--muted)}
.ghub{display:grid;gap:10px;margin-top:12px}
.gcard{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.gcard:active{transform:scale(.98)}
.gci{font-size:36px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--gold-soft);flex:none}
.gct{flex:1;min-width:0}.gct b{display:block;font-size:17px}.gct>.am{display:block;font-size:14px;color:var(--gold);font-weight:600}
.gct small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.gcs{text-align:right;flex:none;font-size:12px}.gcs small{display:block;color:var(--gold);font-weight:700;margin-top:4px}
.gskill{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;line-height:1.2}
.gbadge{font-size:64px;line-height:1.1}
.gsnd{margin-left:auto}
/* lion run */
.rprompt{text-align:center;font-size:24px;font-weight:700;padding:4px 0 8px;min-height:44px}
.rctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rctl button{min-height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:24px}
.rctl button:active{border-color:var(--gold);transform:scale(.97)}
/* word tower */
.tower{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:210px;padding:8px;border-radius:18px;background:linear-gradient(#bfe3f7,#eaf6fc);overflow:hidden}
.tflag{font-size:22px;height:26px}
.tfloor{width:150px;height:24px;margin-top:2px;border-radius:4px;background:hsl(var(--hue) 55% 50%);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tfloor.drop{animation:tdrop .45s ease-out}
@keyframes tdrop{from{transform:translateY(-120px);opacity:.2}to{transform:none;opacity:1}}
.tground{width:100%;text-align:center;font-size:12px;color:#3d5a2a;border-top:4px solid #6aa34a;padding-top:2px;margin-top:2px}
.shake{animation:gshake .35s}
@keyframes gshake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.ttime{height:8px;border-radius:99px;background:var(--line);margin:10px 0;overflow:hidden}
.ttime i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}.ttime i.low{background:var(--bad)}
.tq{text-align:center;font-size:20px;font-weight:700;min-height:30px}
.tline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:46px;margin:10px 0;padding:8px;border-radius:14px;border:2px dashed var(--line)}
.tline.ok{border-color:var(--good);background:var(--good-soft)}
.tslot{min-width:44px;min-height:30px;padding:3px 8px;border-radius:8px;background:var(--bg);border-bottom:2px solid var(--line);font-weight:600}
.tslot.on{background:var(--accent-soft);border-color:var(--accent)}
.tend{font-weight:700;align-self:flex-end}
.tshow{font-weight:700;color:var(--bad)}
.tchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tchips button{padding:10px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:16px}
.tchips button:disabled{opacity:.25}.tchips button.bad{border-color:var(--bad);background:var(--bad-soft);animation:gshake .35s}
/* save the lion */
.strack{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 8px;border-radius:18px;background:linear-gradient(90deg,#e7d39b 70%,#4aa3c9 86%)}
.scell{display:grid;place-items:center;height:44px;font-size:26px;color:rgba(80,60,20,.5)}
.scell.river{font-size:30px}
.sq{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:700;margin:14px 0 6px}
.sbtn{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);font-size:20px}
.sword{display:flex;gap:6px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap}
.sword span{width:34px;height:42px;border-bottom:3px solid var(--fg);display:grid;place-items:center;font-size:24px;font-weight:700}
.sword.ok span{color:var(--good);border-color:var(--good)}
.skeys{display:grid;gap:6px}.skeys div{display:flex;gap:4px;justify-content:center}
.skeys button{flex:1;max-width:36px;min-height:46px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:16px;padding:0}
.skeys button.ok{background:var(--good-soft);color:var(--good)}.skeys button.no{background:var(--bad-soft);color:var(--bad);opacity:.6}
/* balloon pop */
.bctl{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:10px}.bctl .btn{min-height:46px;font-size:14px;padding:6px}
.bfield{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#7cc4ef,#d8f0fb 70%,#a7d98a 71%)}
.balloon{position:absolute;left:0;top:0;width:80px;height:96px;border-radius:50% 50% 47% 47%/42% 42% 58% 58%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 32%),var(--c);color:#fff;font-weight:700;font-size:13px;line-height:1.2;padding:6px;display:grid;place-items:center;text-shadow:0 1px 2px rgba(0,0,0,.35);will-change:transform}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:40px;background:rgba(60,60,60,.5)}
.balloon.pop{animation:bpop .3s forwards}.balloon.no{filter:grayscale(1)}
@keyframes bpop{to{scale:1.5;opacity:0}}
.glvl{padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.gwrap{position:relative}
.balloon.long{font-size:11px;line-height:1.15}

/* games 6-12 */
.gchoices{display:grid;gap:8px;margin:10px 0}
.gchoices button{min-height:50px;padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:16px;line-height:1.3;text-align:left}
.gchoices button.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.gchoices button.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.gchoices button.gone{opacity:.3;text-decoration:line-through}
.gwhy{margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--gold-soft)}
.gwhy.ok{background:var(--good-soft)}.gwhy p{margin:.35em 0}.gwhy .btn{margin-top:8px}
.dcase{padding:4px 0}.dhead{font-size:16px}.dhead b{font-size:19px}.dhead .am{display:block;color:var(--gold);font-weight:600}
.dstory{font-size:16px;font-weight:600;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.dclues{padding-left:4px;list-style:none;display:grid;gap:6px;margin:10px 0}.dclues li{padding:8px 10px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.dq,.hnote+.dq{font-weight:700;font-size:17px;margin:12px 0 0}
.qplace{font-size:16px;margin:4px 0 10px}.qplace small{color:var(--muted)}
.qchat{display:grid;gap:8px;margin-bottom:6px}
.qmsg{display:flex;gap:8px;align-items:flex-end}.qmsg.me{justify-content:flex-end}
.qwho{font-size:26px}.qb{max-width:82%;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:16px}
.qmsg.me .qb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qsay{font-size:14px;padding:0 4px}
.bgram{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}.bgram .gsmall{width:100%;margin:.6em 0 0}
.bgram button{padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.tslot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grow.g2{grid-template-columns:1fr 1fr}
.bbans{font-size:18px;font-weight:700}
.mgrid{display:grid;gap:8px;margin:10px 0}.mgrid.c3{grid-template-columns:repeat(3,1fr)}.mgrid.c4{grid-template-columns:repeat(4,1fr)}
.mcard{position:relative;aspect-ratio:3/4;border-radius:12px;perspective:600px;padding:0}
.mcard>span{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s;padding:4px;font-weight:700;font-size:14px;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.mback{background:linear-gradient(135deg,var(--accent),#2f8f6a);font-size:26px!important}
.mface{background:var(--surface);border:2px solid var(--line);transform:rotateY(180deg)}.mface.pic{font-size:38px!important}
.mcard.flip .mback{transform:rotateY(180deg)}.mcard.flip .mface{transform:rotateY(0)}
.mcard.done .mface{border-color:var(--good);background:var(--good-soft)}
.rabad{padding:14px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:18px;text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:5px}
.hmap{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px;padding:10px 4px;border-radius:16px;background:linear-gradient(#cfe8b8,#e9dcb0);margin:4px 0 12px}
.hstop{font-size:19px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.6);opacity:.55}
.hstop.on{opacity:1;box-shadow:0 0 0 3px var(--gold);background:#fff}.hstop.done{opacity:1}
.hpath{width:6px;border-top:3px dotted #8a6a3a}
.hplace{font-size:17px}.hplace small{color:var(--muted)}
.hnote{margin:10px 0;padding:14px;border-radius:12px;background:#f6ecd2;color:#3b2a10;font-size:16px;line-height:1.5;border:1px solid #e0cfa2}
.suword{text-align:center;font-size:28px;font-weight:700;margin:6px 0 2px}
.suzone{margin:12px 0}
.suwords span{font-weight:700;padding:1px 3px;border-radius:4px}.suwords .ok{color:var(--good)}.suwords .no{color:var(--bad);background:var(--bad-soft)}

/* games 13-19 */
.qask{font-weight:700;margin:6px 0}.qask .am{font-weight:500;color:var(--muted)}
.qp{font-size:21px;font-weight:700;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.qp.mono{letter-spacing:2px;font-family:ui-monospace,Menlo,monospace}
.qsub{text-align:center;margin:6px 0 0;color:var(--muted)}
.gchoices.two{grid-template-columns:1fr 1fr}.gchoices.two button{text-align:center}
.hpbar{position:relative;height:16px;border-radius:99px;background:var(--line);overflow:hidden;min-width:120px}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--good);transition:width .3s}.hpbar.red i{background:#d9534a}.hpbar.blue i{background:#3a8fd9}
.hpbar span{position:relative;display:block;text-align:center;font-size:11px;font-weight:700;line-height:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.arena{position:relative;display:grid;gap:10px;padding:14px;border-radius:18px;background:linear-gradient(#2b1d3f,#4a2d4f);color:#fff}
.boss{display:grid;justify-items:center;gap:2px;text-align:center}.boss .am{font-size:13px;opacity:.85}
.bossic{font-size:64px;line-height:1.1;animation:bfloat 2s ease-in-out infinite}
@keyframes bfloat{50%{transform:translateY(-6px)}}
.boss.hit .bossic{animation:bhit .4s}@keyframes bhit{30%{transform:scale(.85) rotate(-8deg);filter:brightness(2)}}
.hero{display:flex;align-items:center;gap:10px}.hero .hpbar{flex:1}
.reward{display:grid;justify-items:center;gap:2px;padding:12px;border-radius:14px;background:var(--gold-soft);margin:8px 0}.reward>span:first-child{font-size:44px}
.agent{padding:2px 0}.aghead{font-weight:700;font-size:16px}.aghead .am{display:block;color:var(--gold);font-size:13px}.aghead small{color:var(--muted);font-weight:500}
.agcard{margin:10px 0;padding:14px;border-radius:14px;background:#1d2430;color:#d8f3dc;font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.5}
.agcard b{color:#ffd166;font-family:var(--font-en)}
.agfiles{display:grid;gap:4px}.agfiles span,.agfile{font-size:13px;padding:6px 10px;border-radius:10px;background:var(--gold-soft)}
.stbox{position:relative;padding:16px 16px 30px;border-radius:16px;background:#fbf6ea;color:#2b2112;border:1px solid #e8dcc0;font-size:17px;line-height:1.55}
.stbox p{margin:0}.stbox .qsay{position:absolute;right:8px;bottom:6px}
.stnote{font-size:14px;padding:6px 10px;border-radius:10px;background:var(--accent-soft);margin:0 0 10px}
.stend{padding:18px;border-radius:16px;background:var(--gold-soft);font-size:16px;line-height:1.5}.stend b{font-size:20px}
.dscore{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-size:16px;font-weight:600}.dscore b{font-size:26px;margin:0 6px}
.dq2{margin:8px 0}.dmsg{text-align:center;min-height:22px;margin-top:6px;font-weight:600}
.dpad{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dpad.top{transform:rotate(180deg);margin-bottom:8px}
.dqmini{grid-column:1/-1;text-align:center;font-weight:700;font-size:17px;padding:6px;border-radius:10px;background:var(--gold-soft)}
.dpad button{min-height:52px;padding:8px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:15px;line-height:1.25}
.dpad button.ok{border-color:var(--good);background:var(--good-soft)}.dpad button.bad{border-color:var(--bad);background:var(--bad-soft)}
.alsky{position:relative;height:190px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 70% 20%,#3a2f7a,#0b0d2a 70%)}
.alship{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:44px;transition:top .6s}
.alien{position:absolute;left:14%;bottom:30px;font-size:40px;transition:transform .3s}.alien.happy{transform:translateY(-10px) scale(1.15)}
.albub{position:absolute;left:46px;top:-8px;white-space:nowrap;font-size:13px;font-weight:700;background:#fff;color:#222;padding:4px 8px;border-radius:12px}
.alearth{position:absolute;right:-20px;bottom:-40px;font-size:110px;opacity:.95}
.zhall{display:grid;grid-template-columns:repeat(8,1fr);align-items:center;padding:14px 6px 6px;border-radius:16px;background:linear-gradient(#2a2f2a,#141714);color:#9aa59a;font-size:26px;text-align:center}
.zhall span.z{animation:zwalk .6s ease-in-out infinite alternate}@keyframes zwalk{to{transform:translateY(-3px) rotate(4deg)}}
.zgap{grid-column:1/-1;font-size:13px;color:#ffd0c7;margin:6px 0 0}
.bomb{position:relative;display:grid;justify-items:center;gap:10px;padding:16px;border-radius:18px;background:linear-gradient(#3b3b3b,#1d1d1d)}
.botime{font-family:ui-monospace,Menlo,monospace;font-size:40px;font-weight:700;color:#7CFC00;background:#000;padding:2px 18px;border-radius:10px;letter-spacing:3px}
.botime.low{color:#ff4b3a;animation:blink .5s infinite}@keyframes blink{50%{opacity:.4}}
.wires{display:flex;gap:10px}.wires span{width:46px;height:14px;border-radius:7px;background:var(--c);display:grid;place-items:center;font-size:12px}
.wires span.cut{background:repeating-linear-gradient(90deg,var(--c) 0 16px,transparent 16px 30px)}
.boom{font-size:90px;animation:bpop2 .6s}@keyframes bpop2{from{transform:scale(.2)}}
</style>

 ማነው?"], ["I'll take care of it.", "እኔ እከታተለዋለሁ።"], ["Please keep me informed.", "እባክዎ መረጃ ያድርሱኝ።"], ["I'm sorry, I made a mistake.", "ይቅርታ፣ ስህተት ሰርቻለሁ።"], ["It won't happen again.", "ዳግመኛ አይደገምም።"], ["Congratulations on your promotion!", "ለዕድገትዎ እንኳን ደስ አለዎት!"]], "month": 3}, {"id": "present", "level": "adv", "en": "Presentations and meetings", "am": "ገለጻና ስብሰባ", "words": [["Good morning, everyone.", "እንደምን አደራችሁ ሁላችሁም።"], ["Today I'm going to talk about our sales.", "ዛሬ ስለ ሽያጫችን እናገራለሁ።"], ["Let's start with the first point.", "በመጀመሪያው ነጥብ እንጀምር።"], ["As you can see in this chart, sales went up.", "በዚህ ሰንጠረዥ እንደምታዩት ሽያጩ ጨምሯል።"], ["To sum up, we had a good year.", "ለማጠቃለል፣ ጥሩ ዓመት ነበረን።"], ["Does anyone have any questions?", "ጥያቄ ያለው ሰው አለ?"], ["That's a great question.", "በጣም ጥሩ ጥያቄ ነው።"], ["Thank you for your attention.", "ስላዳመጣችሁኝ አመሰግናለሁ።"], ["Let me move on to the next slide.", "ወደሚቀጥለው ስላይድ ልለፍ።"], ["I'd like to thank my team.", "ቡድኔን ማመስገን እፈልጋለሁ።"], ["Thank you all for coming.", "ስለመጣችሁ ሁላችሁንም አመሰግናለሁ።"], ["Let me introduce myself.", "ራሴን ላስተዋውቅ።"], ["My name is Selam, and I work in marketing.", "ስሜ ሰላም ነው፣ በማርኬቲንግ ክፍል እሰራለሁ።"], ["The purpose of this meeting is to plan next year.", "የዚህ ስብሰባ ዓላማ የሚቀጥለውን ዓመት ማቀድ ነው።"], ["My presentation has three parts.", "ገለጻዬ ሶስት ክፍሎች አሉት።"], ["First, I'll talk about our results.", "በመጀመሪያ ስለ ውጤታችን እናገራለሁ።"], ["Second, I'll explain the problems.", "ሁለተኛ፣ ችግሮቹን አብራራለሁ።"], ["Finally, I'll suggest some solutions.", "በመጨረሻም አንዳንድ መፍትሄዎችን እጠቁማለሁ።"], ["Please look at this graph.", "እባካችሁ ይህን ግራፍ ተመልከቱ።"], ["Sales increased by twenty percent.", "ሽያጩ በሃያ በመቶ ጨምሯል።"], ["Costs decreased last year.", "ባለፈው ዓመት ወጪዎች ቀንሰዋል።"], ["This is very important.", "ይህ በጣም አስፈላጊ ነው።"], ["Let me give you an example.", "አንድ ምሳሌ ልስጣችሁ።"], ["In other words, we need more customers.", "በሌላ አነጋገር ተጨማሪ ደንበኞች ያስፈልጉናል።"], ["That brings me to my next point.", "ይህ ወደሚቀጥለው ነጥቤ ያመጣኛል።"], ["Are there any comments?", "አስተያየት አለ?"], ["Can everyone hear me?", "ሁላችሁም ትሰሙኛላችሁ?"], ["Can you see the screen?", "ስክሪኑን ማየት ትችላላችሁ?"], ["Let's take a short break.", "አጭር እረፍት እንውሰድ።"], ["Let's get started.", "እንጀምር።"], ["Who would like to begin?", "ማን መጀመር ይፈልጋል?"], ["Sorry to interrupt, but I have a question.", "ስላቋረጥኩ ይቅርታ፣ ግን ጥያቄ አለኝ።"], ["Could you explain that again?", "ያንን እንደገና ሊያብራሩ ይችላሉ?"], ["I'm not sure I understand.", "በትክክል እንደገባኝ እርግጠኛ አይደለሁም።"], ["Let's vote on it.", "በዚህ ላይ ድምፅ እንስጥ።"], ["We are running out of time.", "ጊዜ እያለቀብን ነው።"], ["Let's continue this next week.", "ይህንን በሚቀጥለው ሳምንት እንቀጥል።"], ["Who will write the notes?", "ቃለ ጉባኤውን ማን ይጽፋል?"], ["In conclusion, we must work as a team.", "በማጠቃለያ እንደ ቡድን መስራት አለብን።"], ["I'm happy to answer your questions.", "ጥያቄዎቻችሁን ለመመለስ ደስተኛ ነኝ።"]], "month": 3}, {"id": "euph", "level": "adv", "en": "Euphemisms: what people really mean", "am": "ለስላሳ አገላለጾች፡ እውነተኛ ትርጉማቸው", "tip": ["At work and in polite talk, English speakers hide bad news in soft words. 'We need to let you go' = you are fired. 'I'll think about it' often means no. Learn the real meaning so you are never confused.", "በስራ ቦታና በጨዋ ንግግር እንግሊዝኛ ተናጋሪዎች መጥፎ ዜናን በለስላሳ ቃላት ይደብቃሉ። 'We need to let you go' = ከስራ ተባረሃል። 'I'll think about it' ብዙ ጊዜ 'አይ' ማለት ነው። እንዳይምታቱ እውነተኛ ትርጉማቸውን ይማሩ።"], "words": [["We need to let you go.", "ከስራ ልናሰናብትዎ ነው (ተባረዋል)።"], ["He was let go last month.", "ባለፈው ወር ከስራ ተባረረ።"], ["The company is downsizing.", "ኩባንያው ሰራተኞችን እየቀነሰ ነው።"], ["I'll think about it.", "አስብበታለሁ (ብዙ ጊዜ 'አይ' ማለት ነው)።"], ["That's an interesting idea.", "አስገራሚ ሀሳብ ነው (ግን አልተስማማኝም)።"], ["With all due respect, I disagree.", "ከአክብሮት ጋር፣ አልስማማም።"], ["Your work needs some improvement.", "ስራዎ መሻሻል ያስፈልገዋል (ደካማ ነው)።"], ["We had a small disagreement.", "ትንሽ ተጋጭተን ነበር (ተጣልተን ነበር)።"], ["He was economical with the truth.", "እውነቱን ሙሉ በሙሉ አልተናገረም (ዋሽቷል)።"], ["It's a pre-owned car.", "ያገለገለ መኪና ነው።"], ["They are going through a difficult time.", "ከባድ ጊዜ ውስጥ ናቸው።"], ["He's had a little too much to drink.", "ትንሽ ጠጥቶ ሰክሯል።"], ["The patient didn't make it.", "በሽተኛው ሕይወቱ አለፈ።"], ["I'm afraid that won't be possible.", "ይቅርታ፣ ያ አይቻልም።"], ["Let's agree to disagree.", "ባንስማማም እንከባበር።"]], "month": 3}, {"id": "colloc", "level": "adv", "en": "Make or do? Words that go together", "am": "አብረው የሚሄዱ ቃላት", "tip": ["Some words just go together in English, and you have to learn them. MAKE = create something (make a mistake, make a decision). DO = work and tasks (do homework, do the dishes). Also: TAKE a photo, HAVE a shower, CATCH a cold.", "አንዳንድ ቃላት በእንግሊዝኛ አብረው ይሄዳሉ፤ መሸምደድ ያስፈልጋል። MAKE = አዲስ ነገር መፍጠር (make a mistake, make a decision)። DO = ስራና ተግባር (do homework, do the dishes)። ደግሞ፡ TAKE a photo, HAVE a shower, CATCH a cold።"], "words": [["I made a mistake.", "ስህተት ሰራሁ።"], ["We need to make a decision.", "ውሳኔ መወሰን አለብን።"], ["She made a lot of money.", "ብዙ ገንዘብ አገኘች።"], ["Let's make a plan.", "እቅድ እናውጣ።"], ["Can you do me a favour?", "አንድ ውለታ ሊውሉልኝ ይችላሉ?"], ["I do my homework every evening.", "በየምሽቱ የቤት ስራዬን እሰራለሁ።"], ["He does the dishes after dinner.", "ከእራት በኋላ ሳህኖቹን ያጥባል።"], ["Do your best.", "የተቻለዎትን ያድርጉ።"], ["Can you take a photo of us?", "ፎቶ ሊያነሱን ይችላሉ?"], ["I have a shower every morning.", "በየጠዋቱ ሻወር እወስዳለሁ።"], ["I caught a cold.", "ጉንፋን ያዘኝ።"], ["Pay attention, please.", "እባክዎ በትኩረት ይከታተሉ።"], ["I'll keep a secret.", "ምስጢር እጠብቃለሁ።"], ["Let's take a break.", "እረፍት እንውሰድ።"]], "month": 3}, {"id": "g-link", "level": "adv", "grammar": true, "en": "Linking words", "am": "ማያያዣ ቃላት", "tip": ["Linking words join ideas and make you sound fluent. AND adds, BUT shows a difference, BECAUSE gives a reason, SO gives a result. Stronger: ALTHOUGH, HOWEVER, THEREFORE, INSTEAD, UNLESS.", "ማያያዣ ቃላት ሀሳቦችን ያገናኛሉ፤ አቀላጥፈው እንዲናገሩም ይረዳሉ። AND = እና፣ BUT = ግን፣ BECAUSE = ምክንያቱም፣ SO = ስለዚህ። ጠንከር ያሉ፡ ALTHOUGH (ቢሆንም)፣ HOWEVER (ሆኖም)፣ THEREFORE (ስለሆነም)፣ INSTEAD (በምትኩ)፣ UNLESS (ካልሆነ በስተቀር)።"], "words": [["I was tired, so I went to bed early.", "ደክሞኝ ስለነበር ቀድሜ ተኛሁ።"], ["I stayed home because it was raining.", "ዝናብ ስለነበር ቤት ቀረሁ።"], ["Although it was late, we kept working.", "ቢመሽም መስራታችንን ቀጠልን።"], ["The phone is good. However, it is expensive.", "ስልኩ ጥሩ ነው። ሆኖም ውድ ነው።"], ["I wanted tea, but there was only coffee.", "ሻይ ፈልጌ ነበር፤ ግን ቡና ብቻ ነበር።"], ["Unless you hurry, you will miss the bus.", "ካልፈጠኑ አውቶቡሱ ያመልጥዎታል።"], ["Instead of a taxi, I took the bus.", "በታክሲ ፋንታ በአውቶቡስ ሄድኩ።"], ["She studied hard. Therefore, she passed.", "ጠንክራ አጠናች፤ ስለሆነም አለፈች።"], ["Even though I'm busy, I'll help you.", "ብጨናነቅም እረዳዎታለሁ።"], ["First of all, thank you for coming.", "በመጀመሪያ፣ ስለመጡ እናመሰግናለን።"], ["On the other hand, it saves time.", "በሌላ በኩል ደግሞ ጊዜ ይቆጥባል።"], ["In addition, the price is low.", "በተጨማሪም ዋጋው ዝቅተኛ ነው።"]], "month": 3}, {"id": "g-passive", "level": "adv", "grammar": true, "en": "Passive: it was made", "am": "ተደረገ፣ ተሰራ", "tip": ["Use the passive when the action is more important than who did it: 'Coffee is grown in Ethiopia.' Form: is / are / was / were + past form (made, built, sent). Add 'by…' only if it matters who did it.", "ማን እንዳደረገው ሳይሆን ድርጊቱ ሲበልጥ passive ይጠቀሙ፡ 'Coffee is grown in Ethiopia.' (ቡና በኢትዮጵያ ይበቅላል)። አሰራር፡ is / are / was / were + ያለፈ መልክ (made, built, sent)። ማን እንዳደረገው አስፈላጊ ከሆነ ብቻ 'by…' ይጨምሩ።"], "words": [["Coffee is grown in Ethiopia.", "ቡና በኢትዮጵያ ይመረታል።"], ["This bag was made in Ethiopia.", "ይህ ቦርሳ የተሰራው በኢትዮጵያ ነው።"], ["The letter was sent yesterday.", "ደብዳቤው ትናንት ተልኳል።"], ["The meeting was cancelled.", "ስብሰባው ተሰርዟል።"], ["English is spoken all over the world.", "እንግሊዝኛ በመላው ዓለም ይነገራል።"], ["My phone was stolen.", "ስልኬ ተሰረቀ።"], ["The road is being repaired.", "መንገዱ እየተጠገነ ነው።"], ["Lalibela was built a long time ago.", "ላሊበላ የተገነባው ከረጅም ጊዜ በፊት ነው።"], ["Your order has been sent.", "ትዕዛዝዎ ተልኳል።"], ["The book was written by a famous writer.", "መጽሐፉ የተጻፈው በታዋቂ ደራሲ ነው።"], ["Breakfast is served at seven.", "ቁርስ በአንድ ሰዓት ይቀርባል።"], ["I was born in Gondar.", "የተወለድኩት ጎንደር ነው።"]], "month": 3}, {"id": "g-reported", "level": "adv", "grammar": true, "en": "Reported speech: she said that…", "am": "የሌላ ሰው ንግግር ማስተላለፍ", "tip": ["To tell someone what another person said, use said / told + one step back in time: 'I am tired' → She said (that) she was tired. 'I will call' → He said he would call. Questions: He asked if I was OK.", "የሌላን ሰው ንግግር ለማስተላለፍ said / told ይጠቀሙና ጊዜውን አንድ ደረጃ ወደኋላ ይመልሱ፡ 'I am tired' → She said she was tired። 'I will call' → He said he would call። ጥያቄ፡ He asked if I was OK።"], "words": [["She said she was tired.", "ደክሞኛል አለች።"], ["He said he would call me.", "እደውልልሃለሁ አለ።"], ["They told me the shop was closed.", "ሱቁ ተዘግቷል አሉኝ።"], ["My boss said I could leave early.", "አለቃዬ ቀድመህ መሄድ ትችላለህ አለኝ።"], ["He asked if I was OK.", "ደህና ነህ ወይ ብሎ ጠየቀኝ።"], ["She asked me where I lived.", "የት እንደምኖር ጠየቀችኝ።"], ["He told me not to worry.", "አትጨነቅ አለኝ።"], ["The doctor told me to rest.", "ሐኪሙ እንዳርፍ ነገረኝ።"], ["I told her I was busy.", "ስራ እንደበዛብኝ ነገርኳት።"], ["She said she had finished.", "ጨርሻለሁ አለች።"]], "month": 3}, {"id": "mistakes", "level": "adv", "hintLabel": "Not", "en": "Common mistakes Ethiopians make", "am": "ኢትዮጵያውያን የሚሰሯቸው የተለመዱ ስህተቶች", "tip": ["These mistakes come from translating Amharic word by word. Learn the correct English (big text). Under it, in small text, is what NOT to say.", "እነዚህ ስህተቶች አማርኛን ቃል በቃል ከመተርጎም ይመጣሉ። ትክክለኛውን እንግሊዝኛ (ትልቁን ጽሑፍ) ይማሩ። ከስሩ በትንሹ የተጻፈው መባል የሌለበት ነው።"], "words": [["I agree.", "እስማማለሁ።", "I am agree."], ["Turn on the light.", "መብራቱን አብራው።", "Open the light."], ["Turn off the TV.", "ቴሌቪዥኑን አጥፋው።", "Close the TV."], ["I am 25 years old.", "25 ዓመቴ ነው።", "I have 25 years."], ["I'm so hungry.", "በጣም ርቦኛል።", "I have hunger."], ["I'll call you later.", "በኋላ እደውልልሃለሁ።", "I will phone to you."], ["See you tomorrow, then.", "እንግዲያው ነገ እንገናኝ።", "We will see tomorrow."], ["Let's discuss the problem.", "ስለ ችግሩ እንወያይ።", "Let's discuss about the problem."], ["Explain it to me.", "አስረዳኝ።", "Explain me."], ["I'm married.", "ባለትዳር ነኝ።", "I married."], ["I'm bored.", "ሰለቸኝ።", "I am boring."], ["I'm going home.", "ወደ ቤት እየሄድኩ ነው።", "I am going to home."], ["I have a function pickVoice(){ if(!hasSpeech) return; const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));

let speakTimer = null;
function browserSpeak(text, slow, retry){
  if (!hasSpeech){ toast("Sound is not available on this browser · ድምፅ አይሰራም"); return; }
  clearTimeout(speakTimer);
  if (!voice) pickVoice();
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  if (busy) speechSynthesis.cancel();
  const go = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; if (voice && !retry) u.voice = voice; u.rate = slow ? 0.55 : 0.9;
    let started = false;
    u.onstart = () => { started = true; soundState(true); };
    u.onend = () => soundState(false);
    u.onerror = e => { if (!retry && e.error !== "interrupted" && e.error !== "canceled") browserSpeak(text, slow, true); };
    try { speechSynthesis.resume(); } catch(e){}
    speechSynthesis.speak(u);
    // Chrome sometimes stays silent: try once more with the default voice, then tell the learner
    speakTimer = setTimeout(() => {
      if (started || speechSynthesis.speaking) return;
      speechSynthesis.cancel();
      if (!retry) browserSpeak(text, slow, true);
      else toast("No sound? Turn up the volume and try again · ድምፁን ይጨምሩና እንደገና ይሞክሩ");
    }, 1800);
  };

  if (busy) setTimeout(go, 150); else go();

function audioBase(){ return (LICENSE && LICENSE.web) ? LICENSE.web.replace(/\/$/, "") + "/audio/" : null; }
function audioId(t){ let h = 0x811c9dc5; for (const ch of t){ h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, "0"); }
let player = null;
function soundState(on){ document.documentElement.classList.toggle("playing", !!on); }
function playRecording(text, slow){
  const base = audioBase(), id = audioId(text);
  if (!base || !AUDIO_IDS.has(id)) return false;
  try { if (player){ player.pause(); player.src = ""; } } catch(e){}
  const a = new Audio(base + id + ".mp3"); player = a;
  let fellBack = false;
  const fallback = () => { if (fellBack || player !== a) return; fellBack = true; browserSpeak(text, slow); };
  a.preservesPitch = true; a.playbackRate = slow ? 0.7 : 1;
  a.onerror = () => { soundState(false); fallback(); };
  a.onplaying = () => soundState(true);
  a.onended = a.onpause = () => soundState(false);
  const pr = a.play(); if (pr && pr.catch) pr.catch(err => { if (!err || err.name !== "AbortError") fallback(); });
  return true;
}
function speak(text, slow){
  text = String(text).replace(/\.\.\.$/, "").trim();
  if (dict && dict.browser && dict.active()){ mic.target = null; dict.release(); }
  if (tts){
    tts.speak(text, { language:"en", rate: slow ? 0.7 : 0.95 }).catch(e => {
      const c = e && e.code;
      if (c === "not_granted" || c === "unavailable"){ tts = null; browserSpeak(text, slow); }
    });
    return;
  }
  if (playRecording(text, slow)) return;
  browserSpeak(text, slow);
}

const mic = { target:null, text:"", partial:"", state:"idle", timer:null };
function micStart(target){
  if (!dict || micDenied) return;

  mic.target = target; mic.text = ""; mic.partial = ""; mic.alts = [];

function onDictState({ state, reason }){

// The phone's own speech recognition (Chrome, Android, iPhone Safari). Same shape as the Claude dictation
// capability, so the speaking practice works the same way with either.
// Where the learner can record with automatic checking, when this page can't (downloaded file, Telegram).
// The downloaded course replaces this with a link to the online course.
function onlineCourseUrl(){ return (LICENSE && LICENSE.web) ? LICENSE.web.replace(/\/$/, "") + "/?m=" + (+store.months || 0) + "&t=0&b=" + encodeURIComponent(LICENSE.bot || "") : null; }
function makeBrowserDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !/^https?:$/.test(location.protocol)) return null;   // Chrome blocks speech checking in files opened from the computer
  let rec = null, active = false, onS = () => {}, onP = () => {}, onF = () => {};
  return {
    browser: true,
    active: () => active,
    onState(f){ onS = f; }, onPartial(f){ onP = f; }, onFinal(f){ onF = f; },
    start(){
      return new Promise((resolve, reject) => {
        try {
          rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
          rec.onstart = () => { active = true; onS({ state:"listening" }); resolve(); };
          rec.onresult = e => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; i++){
              const r = e.results[i];
              if (r.isFinal) onF({ text: r[0].transcript, alts: Array.from(r).map(a => a.transcript) });
              else interim += r[0].transcript;
            }
            if (interim) onP({ text: interim });
          };
          rec.onerror = e => {
            const c = (e.error === "not-allowed" || e.error === "service-not-allowed") ? "not_granted" : e.error === "no-speech" ? "no_speech" : e.error === "network" ? "network" : e.error;
            active = false; onS({ state:"idle", reason:c }); reject({ code:c });
          };
          rec.onend = () => { if (active){ active = false; onS({ state:"idle", reason:"stopped" }); } };
          rec.start();
        } catch(err){ reject({ code:"unavailable" }); }
      });
    },
    stop(){ try { if (rec) rec.stop(); } catch(e){} return Promise.resolve(); },
    release(){ try { if (rec){ rec.onend = null; rec.abort(); } } catch(e){} if (active){ active = false; onS({ state:"idle", reason:"stopped" }); } }
  };
}
function onDictFinal({ text, alts }){
  if (alts) mic.alts = (mic.alts || []).concat(alts);
  mic.text += text; mic.partial = "";
  if (mic.target === "tutor"){ const b = $("#tbox"); if (b){ b.value = (b.value + text).replace(/^\s+/, ""); autoGrow(b); } }
  else { clearTimeout(mic.timer); mic.timer = setTimeout(() => { if (dict && dict.active()) dict.stop(); }, 1600); }
  showHeard();
}
function showHeard(){
  if (mic.target === "speak"){ const h = $("#heard"); if (h) h.textContent = (mic.text + " " + mic.partial).trim(); }
  else { const b = $("#tbox"); if (b && mic.partial) b.placeholder = mic.partial; }
}
(async () => {

const dayStr = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
function daysSince(ds){ if (!ds) return null; const [y,m,d] = ds.split("-").map(Number); const a = new Date(y, m-1, d), b = new Date(); b.setHours(0,0,0,0); return Math.round((b - a) / 86400000); }
function liveStreak(){ const g = daysSince(store.last); return (g === 0 || g === 1) ? (store.streak || 0) : 0; }
function normPhone(v){ const m = v.replace(/[\s\-()]/g, "").match(/^(?:\+?251|0)?([79]\d{8})$/); return m ? "+251" + m[1] : null; }
const okEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

function modal(html, buttons){
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
  m.innerHTML = `<div class="box">${html}<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${buttons.map((b, i) =>
    `<button class="btn ${i===0?"primary":""}" data-mb="${i}">${b.label}</button>`).join("")}</div></div>`;
  m.addEventListener("click", e => {
    const b = e.target.closest("[data-mb]");
    if (!b && e.target !== m) return;
    m.remove();
    if (b && buttons[+b.dataset.mb].fn) buttons[+b.dataset.mb].fn();
  });
  document.body.appendChild(m); m.querySelector("[data-mb]").focus();
}

let GTIERS = null;
function gameTiers(){
  if (GTIERS) return GTIERS;
  const T = [[], [], [], [], []], seen = T.map(() => new Set());
  LESSONS.forEach(l => {
    if (l.level === "pron" || l.id === "abc") return;
    const m = monthOf(l), t = /^(idioms|euph)/.test(l.id) && l.level !== "beg" ? 4 : Math.min(3, m);
    l.words.forEach(w => { if (w[1] && !/[\/…↗↘]/.test(w[0]) && !seen[t].has(w[0])){ seen[t].add(w[0]); T[t].push(w); } });

}
function gameWords(level, ok, min){
  const T = gameTiers(); min = min || 8;

  if (!ls.length) ls = LESSONS.filter(l => okL(l) && monthOf(l) === 1);

// ---- drawing ----
function gameDraw(dt){
  const S = GS, cv = $("#gCan"), c = cv.getContext("2d"), W = S.W, H = S.H, t = S.t;
  c.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  if (S.shake > 0){ S.shake -= dt; c.translate((Math.random() - .5) * 10 * S.shake, (Math.random() - .5) * 10 * S.shake); }
  const hz = H * .24, vy = H * .8;
  const morning = S.state === "shop" ? 1 : 0;
  let g = c.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, morning ? "#3a4f8c" : "#070b24"); g.addColorStop(1, morning ? "#f0a05a" : "#2a2152");
  c.fillStyle = g; c.fillRect(-10, -10, W + 20, hz + 10);
  if (!morning) S.stars.forEach(s => { c.globalAlpha = .4 + .6 * Math.abs(Math.sin(t * s[3] + s[2])); c.fillStyle = "#fff"; c.fillRect(s[0] * W, s[1] * H, 1.6, 1.6); });
  c.globalAlpha = 1;
  // moon (or sun in the morning)
  c.save(); c.shadowColor = morning ? "#ffd27a" : "#fff6c8"; c.shadowBlur = 24; c.fillStyle = morning ? "#ffcf6b" : "#fff3c4";
  c.beginPath(); c.arc(W * .82, morning ? hz * .8 : hz * .38, 15, 0, 7); c.fill(); c.restore();
  // hills
  c.fillStyle = morning ? "#4b3d52" : "#141233"; c.beginPath(); c.moveTo(0, hz);
  for (let x = 0; x <= W; x += W / 8) c.lineTo(x, hz - 12 - 10 * Math.sin(x * .03 + 1)); c.lineTo(W, hz + 2); c.lineTo(0, hz + 2); c.fill();
  // savanna
  g = c.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, morning ? "#6b6a3a" : "#16241c"); g.addColorStop(1, morning ? "#9a8a4a" : "#2c3a22");
  c.fillStyle = g; c.fillRect(-10, hz, W + 20, H - hz + 10);
  // grass tufts
  c.strokeStyle = morning ? "rgba(60,50,20,.45)" : "rgba(120,160,90,.18)"; c.lineWidth = 1;
  for (let i = 0; i < 26; i++){ const gx = (i * 97 % 100) / 100 * W, gy = hz + ((i * 53) % 100) / 100 * (vy - hz); c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx - 3, gy - 6); c.moveTo(gx, gy); c.lineTo(gx + 3, gy - 7); c.stroke(); }
  // acacia trees
  [[.07, .9], [.93, .75]].forEach(([tx, sc]) => {
    const x = tx * W, y = hz + 30 * sc; c.fillStyle = morning ? "#2d2a22" : "#05070f";
    c.fillRect(x - 2, y - 26 * sc, 4, 30 * sc);
    c.beginPath(); c.ellipse(x, y - 30 * sc, 34 * sc, 9 * sc, 0, 0, 7); c.fill();
  });
  // hyenas, far ones first
  S.hy.slice().sort((a, b) => a.p - b.p).forEach(h => {
    const p = Math.max(0, h.p), y = hz + 8 + p * (vy - hz - 14), x = W / 2 + (h.x - .5) * W * (.42 + .58 * p);
    const s = (h.boss ? 1.5 : 1) * (26 + p * 34);
    h.sx = x; h.sy = y; h.ss = s;
    c.globalAlpha = h.p < 0 ? Math.max(0, 1 + h.p * 25) : 1;
    drawHyena(c, x, y, s, t, h);
    c.globalAlpha = 1;
    drawLabel(c, h, x, y - s * .72, h === S.target);
  });
  // spears
  S.spears.forEach(sp => {
    const h = sp.h, x0 = W / 2, y0 = H - 18, x1 = h.sx, y1 = h.sy, k = Math.min(1, sp.t);
    const x = x0 + (x1 - x0) * k, y = y0 + (y1 - y0) * k - Math.sin(k * Math.PI) * 30, a = Math.atan2(y1 - y0, x1 - x0);
    c.save(); c.translate(x, y); c.rotate(a);
    c.strokeStyle = "#c9a27a"; c.lineWidth = 3; c.beginPath(); c.moveTo(-26, 0); c.lineTo(8, 0); c.stroke();
    c.fillStyle = "#e8eef2"; c.beginPath(); c.moveTo(16, 0); c.lineTo(6, -5); c.lineTo(6, 5); c.fill(); c.restore();
  });
  drawVillage(c, W, H, vy, t, S);
  // effects
  S.fx = S.fx.filter(f => {
    f.t += dt;
    if (f.kind === "poof"){ const k = f.t / .5; c.globalAlpha = Math.max(0, 1 - k); c.fillStyle = "#e9dcc0";
      for (let i = 0; i < 8; i++){ const a = i / 8 * 6.28; c.beginPath(); c.arc(f.x + Math.cos(a) * f.s * k, f.y + Math.sin(a) * f.s * k * .6, 4 * (1 - k) + 1, 0, 7); c.fill(); }
      c.globalAlpha = 1; return k < 1; }
    if (f.kind === "text"){ const k = f.t / 1; c.globalAlpha = Math.max(0, 1 - k); c.fillStyle = "#ffd75e"; c.font = "700 16px Lexend, sans-serif"; c.textAlign = "center";
      c.fillText(f.txt, f.x, f.y - k * 30); c.globalAlpha = 1; return k < 1; }
    if (f.kind === "eagle"){ const k = f.t / .9; c.fillStyle = "#000"; c.font = "34px serif"; c.textAlign = "center"; c.globalAlpha = Math.max(0, 1 - k * .6);
      c.fillText("🦅", f.x + k * W * .5, f.y - k * H * .6); c.globalAlpha = 1; return k < 1; }
    return false;
  });
}
function drawHyena(c, x, y, s, t, h){
  const bob = Math.sin(t * 9 + h.ph) * s * .04, step = Math.sin(t * 9 + h.ph);
  c.save(); c.translate(x, y + bob);
  c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); c.ellipse(0, s * .5 - bob, s * .42, s * .09, 0, 0, 7); c.fill();
  const fur = h.boss ? "#8a6440" : "#b28c5c", dark = h.boss ? "#4a3220" : "#6b4c2c";
  // legs
  c.fillStyle = dark; c.fillRect(-s * .2, s * .2 + step * s * .03, s * .1, s * .28); c.fillRect(s * .1, s * .2 - step * s * .03, s * .1, s * .28);
  // body
  c.fillStyle = fur; c.beginPath(); c.ellipse(0, s * .16, s * .38, s * .26, 0, 0, 7); c.fill();
  c.fillStyle = dark; [[-.2, .1], [.18, .2], [.02, .3], [-.08, .06], [.26, .05]].forEach(([a, b]) => { c.beginPath(); c.arc(a * s, b * s, s * .045, 0, 7); c.fill(); });
  // mane
  c.fillStyle = dark; c.beginPath(); c.ellipse(0, -s * .12, s * .1, s * .2, 0, 0, 7); c.fill();
  // ears
  c.fillStyle = dark; [-1, 1].forEach(d => { c.beginPath(); c.ellipse(d * s * .2, -s * .34, s * .09, s * .12, d * .4, 0, 7); c.fill(); });
  // head
  c.fillStyle = fur; c.beginPath(); c.ellipse(0, -s * .12, s * .27, s * .24, 0, 0, 7); c.fill();
  c.fillStyle = "#d9bf93"; c.beginPath(); c.ellipse(0, s * .02, s * .14, s * .11, 0, 0, 7); c.fill();
  c.fillStyle = "#1b1410"; c.beginPath(); c.ellipse(0, -s * .02, s * .06, s * .04, 0, 0, 7); c.fill();
  // glowing eyes
  c.save(); c.shadowColor = h.boss ? "#ff3b2f" : "#ffd23a"; c.shadowBlur = 10; c.fillStyle = h.boss ? "#ff5a45" : "#ffe066";
  [-1, 1].forEach(d => { c.beginPath(); c.arc(d * s * .1, -s * .15, s * .042, 0, 7); c.fill(); }); c.restore();
  // mouth: laughing or grinning
  c.strokeStyle = "#1b1410"; c.lineWidth = Math.max(1.2, s * .025);
  if (h.laugh > 0){ c.fillStyle = "#5a1a1a"; c.beginPath(); c.ellipse(0, s * .08, s * .09, s * .06 + Math.abs(Math.sin(t * 30)) * s * .03, 0, 0, 7); c.fill();
    c.fillStyle = "#fff"; c.fillRect(-s * .06, s * .04, s * .03, s * .03); c.fillRect(s * .03, s * .04, s * .03, s * .03); }
  else { c.beginPath(); c.arc(0, s * .03, s * .07, .3, 2.8); c.stroke(); }
  if (h.boss){ c.fillStyle = "#000"; c.font = `${Math.round(s * .32)}px serif`; c.textAlign = "center"; c.fillText("👑", 0, -s * .42); }
  if (h.flash > 0){ c.globalAlpha = h.flash / .3; c.fillStyle = "#fff"; c.beginPath(); c.ellipse(0, 0, s * .45, s * .5, 0, 0, 7); c.fill(); c.globalAlpha = 1; }
  c.restore();
  if (h.laugh > 0){ c.font = "700 14px 'Noto Sans Ethiopic', sans-serif"; c.textAlign = "center"; c.fillStyle = "#ffb4a8"; c.fillText("ሃ ሃ ሃ!", x + s * .5, y - s * .3); }
}
function drawLabel(c, h, x, y, on){
  const txt = h.w[1], fs = h.boss ? 14 : 15;
  c.font = `700 ${fs}px 'Noto Sans Ethiopic', sans-serif`;
  const w = Math.min(c.measureText(txt).width, GS.W * .7) + 16, hh = fs + 10;
  const bx = Math.max(4, Math.min(GS.W - w - 4, x - w / 2));
  c.fillStyle = on ? "#f2b94a" : "rgba(255,255,255,.88)";
  if (on){ c.save(); c.shadowColor = "#f2b94a"; c.shadowBlur = 12; }
  c.beginPath(); if (c.roundRect) c.roundRect(bx, y - hh / 2, w, hh, 9); else c.rect(bx, y - hh / 2, w, hh); c.fill();
  if (on) c.restore();
  c.fillStyle = "#1c1408"; c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(txt, bx + w / 2, y + 1, w - 10); c.textBaseline = "alphabetic";

function drawVillage(c, W, H, vy, t, S){
  c.fillStyle = "#3b2a1a"; c.fillRect(-10, vy + 6, W + 20, H - vy);
  c.fillStyle = "rgba(255,170,60,.08)"; c.fillRect(-10, vy + 6, W + 20, H - vy);
  // fence stakes (one row per fence level)
  for (let r = 0; r < S.fence; r++){ c.fillStyle = "#8a5a2b";
    for (let x = 6; x < W; x += 13){ c.fillRect(x, vy - 4 - r * 6, 5, 14); } c.fillRect(0, vy + 2 - r * 6, W, 3); }
  // torches
  for (let i = 0; i < S.torch; i++){ const tx = [W * .2, W * .8, W * .5][i], ty = vy - 4;
    c.fillStyle = "#5b3a1e"; c.fillRect(tx - 2, ty - 16, 4, 20);
    c.save(); c.shadowColor = "#ff9a2e"; c.shadowBlur = 16; c.fillStyle = "#ffb43c"; c.beginPath(); c.ellipse(tx, ty - 20 - Math.sin(t * 14 + i) * 1.5, 4, 7, 0, 0, 7); c.fill(); c.restore(); }
  // tukuls
  [[.18, 1], [.82, 1], [.36, .8], [.64, .8]].forEach(([fx, sc]) => {
    const x = fx * W, base = H - 8, w = 52 * sc, wall = 24 * sc;
    c.fillStyle = "#b9824c"; c.fillRect(x - w / 2, base - wall, w, wall);
    c.fillStyle = "#4a2e17"; c.fillRect(x - 6 * sc, base - 16 * sc, 12 * sc, 16 * sc);
    c.fillStyle = "#d8b264"; c.beginPath(); c.moveTo(x - w / 2 - 8 * sc, base - wall + 2); c.lineTo(x, base - wall - 34 * sc); c.lineTo(x + w / 2 + 8 * sc, base - wall + 2); c.fill();
    c.strokeStyle = "rgba(90,60,20,.5)"; c.lineWidth = 1; for (let k = -2; k <= 2; k++){ c.beginPath(); c.moveTo(x, base - wall - 34 * sc); c.lineTo(x + k * w / 5, base - wall + 2); c.stroke(); }
  });
  // fire
  const fx = W / 2, fy = H - 14;
  c.save(); const glow = c.createRadialGradient(fx, fy, 2, fx, fy, 60); glow.addColorStop(0, "rgba(255,170,60,.45)"); glow.addColorStop(1, "rgba(255,170,60,0)");
  c.fillStyle = glow; c.fillRect(fx - 60, fy - 60, 120, 120);
  [["#ff6a1f", 13, 22], ["#ffb43c", 9, 16], ["#fff0a0", 4, 8]].forEach(([col, w, h], i) => {
    c.fillStyle = col; c.beginPath(); c.ellipse(fx, fy - h / 2 - Math.sin(t * 13 + i) * 2, w, h + Math.sin(t * 17 + i) * 2, 0, 0, 7); c.fill(); });
  c.restore();
}

function gameHudHTML(items){ return `<div class="ghud">${items.join("")}<button class="gsnd" aria-label="Sound on or off">${gameStore().sound ? "🔊" : "🔇"}</button></div>`; }
function wireSnd(){ const b = $("#v-game .gsnd"); if (b) b.onclick = () => { const g = gameStore(); g.sound = !g.sound; saveStore(); b.textContent = g.sound ? "🔊" : "🔇"; }; }
function fitCanvas(cv, h){
  const w = cv.parentElement.clientWidth, dpr = Math.min(2, window.devicePixelRatio || 1);

const lives = n => "❤️".repeat(Math.max(0, n)) + "🤍".repeat(Math.max(0, 3 - n));
const sayIfOn = t => { if (gameStore().sound) speak(t); };

// ---------- game 2: Lion Run (speed) ----------
function runIntro(){ gameIntro("run", [
  ["🦁 Your lion runs. An Amharic word appears at the top.", "አንበሳዎ ይሮጣል። ከላይ የአማርኛ ቃል ይታያል።"],
  ["👆 Tap the lane with the right English word (or use ◀ ▶).", "ትክክለኛው የእንግሊዝኛ ቃል ያለበትን መስመር ይንኩ።"],
  ["💥 Wrong gate = you lose a heart. It gets faster and faster!", "የተሳሳተ በር = አንድ ልብ ያጣሉ። እየፈጠነ ይሄዳል!"]], runPlay); }
function runPlay(){
  const run = ++GRUN, runPool = L => gameWords(L, w => w[0].length <= 14 && w[1].length <= 22);
  let all = runPool(1);
  const R = { L:1, lane:1, lx:1, rows:[], t:0, last:0, dist:0, hearts:3, score:0, combo:0, crash:0, missed:new Map(), over:false };
  $("#v-game").innerHTML = gameHudHTML([`<span id="rLife">${lives(3)}</span>`, `<span>⭐ <b id="rScore">0</b></span>`, `<span class="glvl" id="gLvl">${lvlChip(1)}</span>`]) +
    `<div class="rprompt" id="rPrompt">…</div><div class="gfield"><canvas id="rCan" aria-label="Lion running on a road with word gates"></canvas><div class="gmsg" id="gMsg"></div></div>
    <div class="rctl" id="rCtl"><button data-mv="-1" aria-label="Left">◀</button><button data-mv="1" aria-label="Right">▶</button></div><div id="rPanel"></div>`;
  show("game"); wireSnd();
  const cv = $("#rCan"); let D = fitCanvas(cv, Math.max(300, Math.min(500, window.innerHeight - 310)));
  const move = d => { if (!R.over) R.lane = Math.max(0, Math.min(2, R.lane + d)); };
  cv.addEventListener("pointerdown", e => { if (R.over) return; const r = cv.getBoundingClientRect(); R.lane = Math.max(0, Math.min(2, Math.floor((e.clientX - r.left) / (r.width / 3)))); });
  $("#rCtl").onclick = e => { const b = e.target.closest("[data-mv]"); if (b) move(+b.dataset.mv); };
  const key = e => { if (current !== "game" || GRUN !== run) { document.removeEventListener("keydown", key); return; } if (e.key === "ArrowLeft") move(-1); if (e.key === "ArrowRight") move(1); };
  document.addEventListener("keydown", key);
  const newRow = () => {
    const L = R.score < 8 ? 1 : R.score < 16 ? 2 : R.score < 25 ? 3 : 4;
    if (L !== R.L){ R.L = L; all = runPool(L); levelUp(L); }
    const w = pickOne(all), opts = gameOpts(w, all).slice(0, 3);
    if (!opts.includes(w[0])) opts[0] = w[0];
    const o = shuffle(opts); R.rows.push({ w, opts:o, ans:o.indexOf(w[0]), y:-.1, done:false, pick:-1 });
  };
  const prompt = () => { const r = R.rows.find(x => !x.done); $("#rPrompt").innerHTML = r ? `<span class="am">${esc(r.w[1])}</span> <span class="gq">= ?</span>` : "…"; };
  newRow(); prompt();
  const loop = ts => {
    if (GRUN !== run || current !== "game" || !$("#rCan")) return;
    const dt = R.last ? Math.min(.05, (ts - R.last) / 1000) : 0; R.last = ts; R.t += dt;
    if (!R.over){
      const sp = Math.min(.42, .17 + R.score * .007);
      R.dist += sp * dt; R.lx += (R.lane - R.lx) * Math.min(1, dt * 14); if (R.crash > 0) R.crash -= dt;
      R.rows.forEach(r => {
        r.y += sp * dt;
        if (!r.done && r.y >= .8){
          r.done = true; r.pick = R.lane;
          if (R.lane === r.ans){ R.combo++; R.score += 1 + (R.combo >= 5 ? 1 : 0); markRight(r.w[0]); sayIfOn(r.w[0]); gameBeep(660, 990, .12, "triangle", .08); }
          else { R.combo = 0; R.hearts--; R.crash = .5; R.missed.set(r.w[0], r.w); markWrong(r.w[0]); SFX.bite(); gameMsgIn(`💥 ${r.w[0]}`, r.w[1], 1200); }
          $("#rScore").textContent = R.score; $("#rLife").textContent = lives(R.hearts); prompt();
          if (R.hearts <= 0){ R.over = true; setTimeout(() => gameOverPanel($("#rPanel"), "run", R.score, `🦁 The lion is tired! · <span class="am">አንበሳው ደከመ!</span>`, R.missed, runPlay), 500); $("#rCtl").hidden = true; }
        }
      });
      R.rows = R.rows.filter(r => r.y < 1.15);
      const lastR = R.rows[R.rows.length - 1];
      if (!lastR || lastR.y > .5) { newRow(); if (R.rows.filter(x => !x.done).length === 1) prompt(); }
    }
    runDraw(cv, D, R);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function gameMsgIn(en, am, ms){ const m = $("#gMsg"); if (!m) return; m.innerHTML = `<div>${esc(en)}<span class="am">${esc(am || "")}</span></div>`; m.classList.add("on"); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove("on"), ms || 1400); }
function runDraw(cv, D, R){
  const c = cv.getContext("2d"), W = D.W, H = D.H, lw = W / 3;
  c.setTransform(D.dpr, 0, 0, D.dpr, 0, 0);
  c.fillStyle = "#86a94f"; c.fillRect(0, 0, W, H);
  c.fillStyle = "#c99a5e"; c.fillRect(W * .03, 0, W * .94, H);
  // moving lane lines and grass edges
  c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 3; c.setLineDash([18, 22]); c.lineDashOffset = -(R.dist * H) % 40;
  [lw, lw * 2].forEach(x => { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }); c.setLineDash([]);
  c.fillStyle = "rgba(90,60,30,.25)";
  for (let i = 0; i < 14; i++){ const y = ((i / 14 + R.dist * 1.0) % 1) * H; c.beginPath(); c.arc((i * 37 % 100) / 100 * W, y, 2.5, 0, 7); c.fill(); }
  // gates
  c.textAlign = "center"; c.textBaseline = "middle";
  R.rows.forEach(r => {
    const y = r.y * H;
    r.opts.forEach((t, k) => {
      const x = k * lw + 6, w = lw - 12, h = 38;
      let bg = "rgba(255,250,240,.95)", fg = "#2a1d0c";
      if (r.done){ if (k === r.ans){ bg = "#3fae6a"; fg = "#fff"; } else if (k === r.pick){ bg = "#d9534a"; fg = "#fff"; } else { bg = "rgba(255,250,240,.35)"; } }
      c.fillStyle = "#6b4a2b"; c.fillRect(x + 2, y - h / 2 - 8, 5, h + 16); c.fillRect(x + w - 7, y - h / 2 - 8, 5, h + 16);
      c.fillStyle = bg; c.beginPath(); if (c.roundRect) c.roundRect(x, y - h / 2, w, h, 9); else c.rect(x, y - h / 2, w, h); c.fill();
      c.strokeStyle = r.done ? "transparent" : "#e2a93b"; c.lineWidth = 2; c.stroke();
      c.fillStyle = fg; c.font = `700 ${t.length > 9 ? 13 : 15}px Lexend, sans-serif`; c.fillText(t, x + w / 2, y + 1, w - 8);
    });
  });
  // lion
  const lx = (R.lx + .5) * lw, ly = H * .87 + Math.sin(R.t * 16) * 3;
  c.fillStyle = "rgba(0,0,0,.2)"; c.beginPath(); c.ellipse(lx, H * .87 + 22, 20, 6, 0, 0, 7); c.fill();
  c.fillStyle = "#000"; c.font = "44px serif"; c.fillText("🦁", lx, ly);
  if (R.crash > 0){ c.globalAlpha = Math.min(1, R.crash * 2); c.font = "36px serif"; c.fillText("💥", lx + 18, ly - 22); c.globalAlpha = 1; }
  c.textBaseline = "alphabetic";
}

// ---------- game 3: Word Tower (grammar) ----------
function towerIntro(){ gameIntro("tower", [
  ["🧱 You see a sentence in Amharic and English words mixed up.", "የአማርኛ ዓረፍተ ነገርና የተደባለቁ የእንግሊዝኛ ቃላት ያያሉ።"],
  ["👆 Tap the words in the right order before time runs out.", "ጊዜው ሳያልቅ ቃላቱን በትክክለኛ ቅደም ተከተል ይንኩ።"],
  ["🏗️ Each correct sentence adds one floor. How tall can you build?", "እያንዳንዱ ትክክለኛ ዓረፍተ ነገር አንድ ፎቅ ይጨምራል። ምን ያህል ከፍ ይገነባሉ?"]], towerPlay); }
function towerPlay(){
  const run = ++GRUN, towerPool = L => gameWords(L, w => isSentence(w) && toks(w[0]).length <= (L >= 3 ? 10 : 8) && w[1].length <= 48, 6);
  let pool = towerPool(1);
  const T = { L:1, floors:0, hearts:3, score:0, missed:new Map(), q:null, picked:[], time:0, max:0, lock:false };
  $("#v-game").innerHTML = gameHudHTML([`<span id="tLife">${lives(3)}</span>`, `<span>🏗️ <b id="tFloors">0</b></span>`, `<span>⭐ <b id="tScore">0</b></span>`, `<span class="glvl" id="gLvl">${lvlChip(1)}</span>`]) +
    `<div class="gwrap"><div class="tower" id="tTower" aria-label="Your tower"></div><div class="gmsg" id="gMsg"></div></div><div class="ttime"><i id="tBar"></i></div>
    <div class="tq" id="tQ"></div><div class="tline" id="tLine"></div><div class="tchips" id="tChips"></div><div id="tPanel"></div>`;
  show("game"); wireSnd();
  const drawTower = (drop) => {
    const n = T.floors, shown = Math.min(n, 6);
    let h = `<div class="tflag">${n ? "🚩" : ""}</div>`;
    for (let i = n; i > n - shown; i--) h += `<div class="tfloor ${i === n && drop ? "drop" : ""}" style="--hue:${(i * 37) % 360}">${i}</div>`;
    h += `<div class="tground">${n > 6 ? `+${n - 6} more · ` : ""}🌍</div>`;
    $("#tTower").innerHTML = h;
  };
  const next = () => {
    if (GRUN !== run) return;
    const L = T.floors < 3 ? 1 : T.floors < 6 ? 2 : T.floors < 9 ? 3 : 4;
    if (L !== T.L){ T.L = L; pool = towerPool(L); levelUp(L); }
    const w = pickOne(pool), q = orderQuestion(w); if (!q){ next(); return; }
    T.q = q; T.picked = []; T.lock = false;
    T.max = Math.max(9, 7 + q.parts.length * 2.6 - Math.min(T.floors, 12) * .35); T.time = T.max;
    $("#tQ").innerHTML = `<span class="am">${esc(w[1])}</span>`;
    render();
  };
  const render = () => {
    const q = T.q;
    $("#tLine").innerHTML = q.parts.map((_, i) => `<span class="tslot ${i < T.picked.length ? "on" : ""}">${i < T.picked.length ? esc(q.parts[q.order[T.picked[i]]]) : ""}</span>`).join("") + `<span class="tend">${esc(q.end)}</span>`;
    $("#tChips").innerHTML = q.order.map((pi, k) => `<button data-k="${k}" ${T.picked.includes(k) ? "disabled" : ""}>${esc(q.parts[pi])}</button>`).join("");
  };
  $("#tChips").onclick = e => {
    const b = e.target.closest("[data-k]"); if (!b || T.lock) return;
    const k = +b.dataset.k, q = T.q, want = q.parts[T.picked.length];
    if (q.parts[q.order[k]] === want){
      T.picked.push(k); gameBeep(500 + T.picked.length * 60, 700 + T.picked.length * 60, .08, "triangle", .07); render();
      if (T.picked.length === q.parts.length){
        T.lock = true; T.floors++; T.score += 10 + Math.round(T.time); markRight(q.word[0]);
        $("#tFloors").textContent = T.floors; $("#tScore").textContent = T.score; drawTower(true); sayIfOn(q.word[0]);

      }
    } else {
      b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 400);
      T.time = Math.max(0, T.time - 2); gameBeep(200, 120, .15, "square", .06);
      $("#tTower").classList.add("shake"); setTimeout(() => $("#tTower") && $("#tTower").classList.remove("shake"), 400);
    }
  };
  const tick = setInterval(() => {
    if (GRUN !== run || current !== "game" || !$("#tBar")){ clearInterval(tick); return; }
    if (T.lock || !T.q) return;
    T.time -= .1; $("#tBar").style.width = Math.max(0, T.time / T.max * 100) + "%";
    $("#tBar").className = T.time < 3 ? "low" : "";
    if (T.time <= 0){
      T.lock = true; T.hearts--; const w = T.q.word; T.missed.set(w[0], w); markWrong(w[0]); SFX.bite();
      $("#tLife").textContent = lives(T.hearts);
      $("#tLine").innerHTML = `<span class="tshow">⏰ ${esc(w[0])}</span>`; $("#tChips").innerHTML = "";
      if (T.hearts <= 0){ clearInterval(tick); setTimeout(() => gameOverPanel($("#tPanel"), "tower", T.score, `🏗️ Your tower: ${T.floors} floors · <span class="am">${T.floors} ፎቅ ገነቡ!</span>`, T.missed, towerPlay), 1500); }
      else setTimeout(next, 2000);
    }
  }, 100);
  drawTower(false); next();
}

// ---------- game 4: Save the Lion (spelling) ----------
function spellIntro(){ gameIntro("spell", [
  ["🐊 A crocodile waits in the river. Your lion walks toward it!", "አዞ ወንዙ ውስጥ ይጠብቃል። አንበሳዎ ወደ እሱ እየሄደ ነው!"],
  ["🔤 Spell the English word, letter by letter. Tap 🔊 to hear it.", "የእንግሊዝኛውን ቃል ፊደል በፊደል ይጻፉ። ለመስማት 🔊 ይንኩ።"],
  ["❌ Each wrong letter = one step closer. ✅ Each word = one step back.", "እያንዳንዱ የተሳሳተ ፊደል = አንድ እርምጃ ወደ አዞው። እያንዳንዱ ቃል = አንድ እርምጃ ወደ ኋላ።"]], spellPlay); }
function spellPlay(){
  const run = ++GRUN;
  const spellPool = lv => { const seen = new Set(), re = lv >= 4 ? /^[A-Za-z]{7,13}$/ : lv >= 3 ? /^[A-Za-z]{5,12}$/ : /^[A-Za-z]{3,10}$/;
    return gameWords(Math.min(3, lv), w => re.test(w[0]) && !seen.has(w[0].toLowerCase()) && seen.add(w[0].toLowerCase()), 6); };
  let pool = spellPool(1);
  const STEPS = 6, L = { lv:1, step:0, score:0, words:0, missed:new Map(), w:null, got:null, used:new Set(), lock:false };
  $("#v-game").innerHTML = gameHudHTML([`<span>✅ <b id="sWords">0</b></span>`, `<span>⭐ <b id="sScore">0</b></span>`, `<span class="glvl" id="gLvl">${lvlChip(1)}</span>`]) +
    `<div class="gwrap"><div class="strack" id="sTrack" aria-label="The lion and the crocodile"></div><div class="gmsg" id="gMsg"></div></div>
    <div class="sq"><span class="am" id="sAm"></span><button class="sbtn" id="sHear" aria-label="Hear the word">🔊</button></div>
    <div class="sword" id="sWord"></div><div class="skeys" id="sKeys"></div><div id="sPanel"></div>`;
  show("game"); wireSnd();
  const track = () => { let h = ""; for (let i = 0; i <= STEPS; i++) h += `<span class="scell ${i === STEPS ? "river" : ""}">${i === L.step ? "🦁" : i === STEPS ? "🐊" : "·"}</span>`; $("#sTrack").innerHTML = h; };
  const keys = () => { $("#sKeys").innerHTML = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"].map(r => `<div>${[...r].map(ch => {
      const u = L.used.has(ch), ok = u && L.w[0].toUpperCase().includes(ch);
      return `<button data-ch="${ch}" ${u ? "disabled" : ""} class="${u ? (ok ? "ok" : "no") : ""}">${ch}</button>`; }).join("")}</div>`).join(""); };
  const word = () => { $("#sWord").innerHTML = [...L.w[0]].map((ch, i) => `<span class="${L.got[i] ? "on" : ""}">${L.got[i] ? ch.toUpperCase() : ""}</span>`).join(""); };
  const next = () => {
    if (GRUN !== run) return;
    const lv = L.words < 4 ? 1 : L.words < 8 ? 2 : L.words < 12 ? 3 : 4;
    if (lv !== L.lv){ L.lv = lv; pool = spellPool(lv); levelUp(lv); }
    L.w = pickOne(pool); L.used = new Set(); L.lock = false;
    L.got = [...L.w[0]].map((_, i) => i === 0);
    L.used.add(L.w[0][0].toUpperCase()); L.got = [...L.w[0]].map(ch => ch.toUpperCase() === L.w[0][0].toUpperCase());
    $("#sAm").textContent = L.w[1]; word(); keys(); track();
    setTimeout(() => { if (GRUN === run) speak(L.w[0], true); }, 300);
  };
  const guess = ch => {
    if (L.lock || L.used.has(ch)) return;
    L.used.add(ch);
    if (L.w[0].toUpperCase().includes(ch)){
      L.got = L.got.map((g, i) => g || L.w[0][i].toUpperCase() === ch); gameBeep(700, 900, .08, "triangle", .07);
      if (L.got.every(Boolean)){
        L.lock = true; L.words++; L.score += 10 + L.w[0].length * 2; L.step = Math.max(0, L.step - 1); markRight(L.w[0]);
        $("#sWords").textContent = L.words; $("#sScore").textContent = L.score; SFX.win(); sayIfOn(L.w[0]);
        $("#sWord").classList.add("ok"); setTimeout(() => { $("#sWord") && $("#sWord").classList.remove("ok"); next(); }, 1100);
      }
    } else {
      L.step++; L.missed.set(L.w[0], L.w); markWrong(L.w[0]); gameBeep(220, 110, .18, "square", .07);
      $("#sTrack").classList.add("shake"); setTimeout(() => $("#sTrack") && $("#sTrack").classList.remove("shake"), 400);
      if (L.step >= STEPS){
        L.lock = true; L.got = L.got.map(() => true); word(); track();
        $("#sKeys").innerHTML = "";
        setTimeout(() => gameOverPanel($("#sPanel"), "spell", L.score, `🐊 The crocodile got the lion! · <span class="am">አዞው አንበሳውን ያዘው!</span> ${L.words} words`, L.missed, spellPlay), 1200);
        return;
      }
    }
    word(); keys(); track();
  };
  $("#sKeys").onclick = e => { const b = e.target.closest("[data-ch]"); if (b) guess(b.dataset.ch); };
  $("#sHear").onclick = () => speak(L.w[0], true);
  const key = e => { if (current !== "game" || GRUN !== run){ document.removeEventListener("keydown", key); return; } if (/^[a-z]$/i.test(e.key)) guess(e.key.toUpperCase()); };
  document.addEventListener("keydown", key);
  next();
}
